,{"label":5,"text":"산화 주석"}],"answer_raw":"4","explanation":"(치과보존학 p.184)\n객관식 보기가 정확하지 않을 수 있습니다..","images":["images/questions/q020.png"],"source_page":10},{"id":"q021","number":21,"question":"다음의 임상 상황에서 사용할 수 있는 버를 알맞게 짝지은 것은?\n[김길동씨는 하악 좌측 제1대구치에 저작시 찌릿한 통증을 주소로 내원하였다. 임상 및 방사\n선 검사상 하악 좌측 제1대구치에 아말감 수복물이 존재하였고 하방으로 이차 우식이 관찰되\n었다. 환자와의 충분한 상담 끝에 기존 아말감 수복물을 제거 후 다시 아말감으로 재수복하기\n로 하였다.]","choices":[{"label":1,"text":"(가),(다)"},{"label":2,"text":"(가),(라)"},{"label":3,"text":"(가),(마)"},{"label":4,"text":"(나),(라)"},{"label":5,"text":"(나),(마)"}],"answer_raw":"3","explanation":"(치과보존학 p.185)\n아말감 와동을 형성하는데 가장 기본적으로 이용되는 절삭기구는 #330, #245 같은 배모양\n(pear shape)의 버(bur)이며 ~중략~ 또한 연화된 우식의 제거를 위해서 일반적으로 둥근 버\n(round bur)를 이용하여 우식의 크기에 따라 적절한 크기를 선택하여야 한다.\n→   이 문제 혹시 나,마 (5번) 하신 분 없을까요? 교과서 109쪽에 문제에 나와있는 버 헤드\n형태 나오고 설명에 (나)를 아말감 와동 retention 형성시 angled undercut 형성에 사용한다\n고 나와 있어요.","images":["images/questions/q021.png"],"source_page":11},{"id":"q022","number":22,"question":"연마용 다이아몬드 버는 입자에 따라 거칠기가 다르다. 거칠기의 내림차순으로 나열하시\n오.","choices":[{"label":1,"text":"무색 - 적색 - 황색"},{"label":2,"text":"적색 - 황색 - 무색"},{"label":3,"text":"적색 - 무색 - 황색"},{"label":4,"text":"황색 - 무색 - 적색"},{"label":5,"text":"무색 - 황색 - 적색"}],"answer_raw":"1","explanation":"번 (선택지 순서는 다릅니다) (치과보존학 p111, 그림 6-13)\n위로부터 coarse(무색)-medium(적색)-fine(황색) diamond bur","images":[],"source_page":12,"explanationImages":["images/explanations/q022_explanation_1.png"]},{"id":"q023","number":23,"question":"치아와동 형성과정에서 치은변연 사면에 해당하는 수복물로 적절한 것을 고르시오.","choices":[{"label":1,"text":"아말감 – 복합레진 – 금수복물"},{"label":2,"text":"복합레진 – 금수복물 – 아말감"},{"label":3,"text":"복합레진 – 아말감 – 금수복물"},{"label":4,"text":"금수복물 – 복합레진 – 금수복물"},{"label":5,"text":"아말감 – 금수복물 – 복합레진"}],"answer_raw":"1","explanation":"번 (치과보존학 129p)","images":["images/questions/q023.png"],"source_page":12,"explanationImages":["images/explanations/q023_explanation_1.png"]},{"id":"q024","number":24,"question":"와동의 구성과 명칭에 대한 다음 설명 중 옳은 것은?","choices":[{"label":1,"text":"치아 장축과 평행한 방향의 벽을 측벽 (side wall) 이라 한다."},{"label":2,"text":"와동저에 수직인 방향의 벽을 축벽 (axial wall) 이라 한다."},{"label":3,"text":"2개의 와벽으로 구성된 우각을 점각이라 한다."},{"label":4,"text":"3개 이상의 와벽이 만나는 우각을 선각이라 한다."},{"label":5,"text":"와연부위의 와벽과 치아 외면에 의해 만들어진 각을 와연우각 (cavosurface angle)이라"}],"answer_raw":"5","explanation":"","images":[],"source_page":13},{"id":"q025","number":25,"question":"다음 matrix system에 대한 설명 중 옳은 것은?","choices":[{"label":1,"text":"A는 band를 slide에 고정하는 수나사의 부분이 된다."},{"label":2,"text":"B의 나사를 반시계방향으로 돌리면 head와 slide 사이의 거리가 멀어진다."},{"label":3,"text":"retainer를 치아에 고정할 때 head의 U자의 열린 부분이 치아의 치관부를 향하도록 해야"},{"label":4,"text":"Band를 장착할 때는 slide와 head를 최대한 분리시킨 상태에서 하는 것이 편리하다."},{"label":5,"text":"인접면의 한 쪽에만 matrix를 삽입하는 제품으로 반대쪽에 matrix를 삽입하지 않아 편리"}],"answer_raw":"1","explanation":"1) 정답 (치과보존학 p. 200)\n2) 반시계 -> 시계 (치과보존학 p.200)\n3) 치관부 -> 치경부 (치과보존학 p.200)\n4) 분리 -> 근접 (치과보존학 p.200)\n5) Sectional matrix system에 대한 설명 (치과보존학 p.205)","images":["images/questions/q025.png"],"source_page":13},{"id":"q026","number":26,"question":"레진의 종류에 따른 filler의 크기로 올바른 것은?","choices":[{"label":1,"text":"Megafiller:"},{"label":2,"text":"Microdiller:"},{"label":3,"text":"Midfiller:"},{"label":4,"text":"Minifiller:"},{"label":5,"text":"Nanofiller:"}],"answer_raw":"5","explanation":"(치과보존학 p.312)\n충전재 입의 크기만으로 복합레진을 분류할 경우에 는 100 μm이상의 경우에는 megafilled,\n10~100 μm범위의 입자를 사용할 경우는 macrofilled, 1 ~ 10 μm범위는 midifilled, 0.1 ~\n1μm 는 minifilled, 0.01 ~0.1 μm범위는 microfilled, 0.005~0.01 μm범위는 nanofilled로\n분류된다.","images":[],"source_page":14},{"id":"q027","number":27,"question":"다음 그림에서 각 와동 에서의 c factor의 값으로 알맞게 연결된 것은?\nA               B                C                D                E","choices":[{"label":1,"text":"A: 0.25"},{"label":2,"text":"B: 0.5"},{"label":3,"text":"C: 1.2"},{"label":4,"text":"D: 2.5"},{"label":5,"text":"E: 6"}],"answer_raw":"2","explanation":"(치과보존학 p.322)\n*교과서 그림과 상이한 그림이 나왔으나 문제푸는데는 지장없음. 색칠된 면이 접착면적이라고\n설명되어있었음.","images":["images/questions/q027.png"],"source_page":14,"explanationImages":["images/explanations/q027_explanation_1.png"]},{"id":"q028","number":28,"question":"다음 빈칸에 들어갈 말로 옳은 것은?\n(        ) 결합은 계면에서 서로 다른 전하를 띄게 될 때 전기적인 인력에 의해서 생겨나는\n결합으로 결합력이 약하다. (      ) 결합은 일차원자가 결합 (primary atomic bond)와 이차\n원자가 결합 (secondary atomic bond)으로 나뉜다. 일차원자가 결합은 전자쌍에 의한 결합\n인 이온 결합과 전자를 공유하는 공유결합이 있으며 이차원자가 결합은 반데르발스 결합과 수\n소결합이 있다. (      ) 결합은 접착면의 거칠기에 따른 미세한 요철에 대한 함입\n(micromechanical interlocking)으로 이루어지는 결합을 일컫는다.","choices":[{"label":1,"text":"물리-화학-기계"},{"label":2,"text":"화학-기계-물리"},{"label":3,"text":"화학-물리-기계"},{"label":4,"text":"물리-기계-화학"},{"label":5,"text":"기계-화학-물리"}],"answer_raw":"1","explanation":"(보기 순서는 다를 수 있음)","images":[],"source_page":15},{"id":"q029","number":29,"question":"다음은 다이아몬드 버로 상아질 삭제 후의 상아질 단면과 접착 과정 후의 SEM 사진이다.\n단면에 나타난 층과 본딩 방법에 대한 설명으로 옳은 것은?","choices":[{"label":1,"text":"Smear layer      -  Self-etch system"},{"label":2,"text":"Hybrid layer      -  Self-etch system"},{"label":3,"text":"Adhesive layer    -  Self-etch system"},{"label":4,"text":"Smear layer      -  Etch & rinse system"},{"label":5,"text":"Adhesive layer   -  Etch & rinse system"}],"answer_raw":"1","explanation":"(치과보존학 p.260)\n치과보존학 그림 12-8 smear layer, 그림 12-9b self-etch system","images":["images/questions/q029.png"],"source_page":15},{"id":"q030","number":30,"question":"Simplified 1-step self-etching adhesive의 접착계면에서 수분투과성이 나타나는 이유\n는?","choices":[{"label":1,"text":"접착제의 친수성"},{"label":2,"text":"접착제의 소수성"},{"label":3,"text":"접착제의 높은 pH"},{"label":4,"text":"접착제의 보관온도"},{"label":5,"text":"중합 후 표면에 발생하는 oxygen inhibition layer"}],"answer_raw":"1","explanation":"치과보존학 제4개정판 276페이지\n(특히 프라이머와 접착레진이 혼합된 simplified-step adhesives에서 일어나기 쉬운데, 접착\n제의 친수성 성분이 많아질수록 산성을 띄게 되는 데서 기인한다.)","images":[],"source_page":16},{"id":"q031","number":31,"question":"다음 사진은 산부식에 의해서 과도하게 탈회되어 수축된 교원섬유망의 사진이다. 다시 회\n복시키는 방법으로 옳은 것은?","choices":[{"label":1,"text":"광중합"},{"label":2,"text":"산부식"},{"label":3,"text":"air-drying"},{"label":4,"text":"re-wetting"},{"label":5,"text":"접착제 도포"}],"answer_raw":"4","explanation":"치과보존학 p.272 교원섬유를 이루는 교원질 분자 사이에는 수분과 같은 조직액이 채워질 수\n있는 공간이 생기게 되고 탈수과정에 의해 수분을 상실하게 되면 교원 섬유망의 수축이 일어\n나게 된다. 역으로 수분이 공급되면 교원섬유망은 부풀게 된다.\n art & science p.150 사진","images":["images/questions/q031.png"],"source_page":16},{"id":"q032","number":32,"question":"다음 중 이 접착기전에 가장 적합한 것을 고르시오.","choices":[{"label":1,"text":"이상적으로 혼성층이 두껍게 형성되는게 좋다."},{"label":2,"text":"wet bonding을 신경쓸 필요 없다."},{"label":3,"text":"강산으로 산부식하여 도말층을 제거한다."},{"label":4,"text":"노출된 콜라겐 구조가 무너질 경우 접착력이 감소한다."},{"label":5,"text":"carboxylic acid로 도말층을 제거 후 상아질과 접착제 간 화학적 결합을 한다."}],"answer_raw":"2","explanation":"치과보존학 그림 (12-15) self-etch technique","images":["images/questions/q032.png"],"source_page":17},{"id":"q033","number":33,"question":"다음 광중합 방법으로 옳은 것을 고르시오.","choices":[{"label":1,"text":"Step cure"},{"label":2,"text":"Ramp cure"},{"label":3,"text":"Exponential cure"},{"label":4,"text":"oscillating cure"},{"label":5,"text":"pulse delay cure"}],"answer_raw":"1","explanation":"(치과보존학 p336)\n그림 14-31. 여러가지 mode의 광조사 방법","images":["images/questions/q033.png"],"source_page":17,"explanationImages":["images/explanations/q033_explanation_1.png"]},{"id":"q034","number":34,"question":"다음 구조의 레진 단량체에 대한 설명으로 옳은 것을 고르시오.","choices":[{"label":1,"text":"방향족 화합물이다"},{"label":2,"text":"점도가 높다"},{"label":3,"text":"이중작용기를 가진다"},{"label":4,"text":"수분흡수를 감소시킨다"},{"label":5,"text":"레진 압축강도를 증가시킨다"}],"answer_raw":"3","explanation":"(TEGDMA)","images":["images/questions/q034.png"],"source_page":18},{"id":"q035","number":35,"question":"다음과 같은 미세입자형 복합레진의 제조방식으로 옳은 것은?","choices":[{"label":1,"text":"minifilled hybrid"},{"label":2,"text":"small particle hybrid"},{"label":3,"text":"condensed microfill"},{"label":4,"text":"agglomerated microfill"},{"label":5,"text":"prepolymerized microfill"}],"answer_raw":"5","explanation":"(치과보존학 p313)\n그림 14-5 a. prepolymerized resin particle의 제조과정","images":["images/questions/q035.png"],"source_page":18},{"id":"q036","number":36,"question":"다음 사진의 변색의 원인은?","choices":[{"label":1,"text":"타액에 의한 오염"},{"label":2,"text":"제거되지 않은 우식"},{"label":3,"text":"수복재 부식산물"},{"label":4,"text":"변연 미세누출"},{"label":5,"text":"2차 우식"}],"answer_raw":"4","explanation":")\n치과보존학 그림 12-21. 접착수복물의 변연부 누출(marginal leakage)로 인한 착색","images":["images/questions/q036.png"],"source_page":19},{"id":"q037","number":37,"question":"다음 사진의 치간이개방법은?","choices":[{"label":1,"text":"Single wedging"},{"label":2,"text":"Double wedging"},{"label":3,"text":"Piggy back wedging"},{"label":4,"text":"Wedge-wedging"}],"answer_raw":"2","explanation":")\n치과보존학 그림 10-41 Double wedging technique","images":["images/questions/q037.png"],"source_page":19},{"id":"q038","number":38,"question":"복합레진 4급 수복에 있어 다음 A,B,C에 들어갈 shade는?\n객관식 보기 조합\n답 : opaque - body - enamel\n교과서 353P","choices":[],"answer_raw":"opaque - body - enamel","explanation":"치과보존학 4판 p.35","images":["images/questions/q038.png"],"source_page":20,"answer_only":true,"answer_display":"opaque - body - enamel","explanationImages":["images/explanations/q038_explanation_1.png"]},{"id":"q039","number":39,"question":"하악 제3대구치로 인한 제2대구치의 원심 치은연하우식 치료법으로 가장 적절한 것은?\n(PA x-ray 제시 - #37에 1급 아말감으로 추정되는 수복물이 있었고 #38이 #37 방향으로\ntilting되어 pulp에가까운 (pulp involve되진않음) #37 distocervical caries가 있었음)","choices":[{"label":1,"text":"Resin inlay"},{"label":2,"text":"Direct resin restoration"},{"label":3,"text":"Glass ionomer"},{"label":4,"text":"Open sandwich"},{"label":5,"text":"Closed sandwich"}],"answer_raw":"4","explanation":") 인 것 같습니다.","images":[],"source_page":20},{"id":"q040","number":40,"question":"다음 그림에서 와동 형성 후 표시된 부분처럼 형성되는 것은?","choices":[{"label":1,"text":"skirt"},{"label":2,"text":"collar"},{"label":3,"text":"slot"},{"label":5,"text":"occlusal step"}],"answer_raw":"5","explanation":"","images":["images/questions/q040.png"],"source_page":21},{"id":"q041","number":41,"question":"그림의 유지형태와 같은 기능을 하는 것은?","choices":[{"label":1,"text":"Dovetail"},{"label":2,"text":"cusp capping"},{"label":3,"text":"gingiva bevel"},{"label":4,"text":"reverse bevel"},{"label":5,"text":"occlusal bevel"}],"answer_raw":"1","explanation":")\n해설 : ref) 치과보존학 p.229 (그림11-5)\n            그림11-5 캡션 : 인레이와 온레이는 마주보는 내부 와벽에 의해 유지력을 얻는다.\n        ref) 치과보존학 p.230 (오른쪽 아래 문단)\n            1차적인 유지형태로는 교합면 방향으로 최소이개도와 충분한 높이의 마주보는\n            와벽에 의한 유지와 인접면 방향으로는 dovetail 형태를 들 수 있다.","images":["images/questions/q041.png"],"source_page":21},{"id":"q042","number":42,"question":"금 인레이의 다음 구조를 무엇이라 하는가?","choices":[{"label":1,"text":"2차 플레어"},{"label":2,"text":"유지구"},{"label":3,"text":"slot"},{"label":4,"text":"교합면 사면"},{"label":5,"text":"치은측 변연사면"}],"answer_raw":"5","explanation":"(답안 순서는 바뀔 수 있습니다.)\nreference: 치과보존학 p.235","images":["images/questions/q042.png"],"source_page":22},{"id":"q043","number":43,"question":"금인레이의 2차 플레어에 관한 내용중 옳은것은?","choices":[{"label":1,"text":"강하고 뭉툭한 상아질 변연을 얻는다"},{"label":3,"text":"심미적이유로 상악소구치 근심협측에서는 연장하지 않는다"},{"label":4,"text":"치은협측, 치은설측 선각을 변연까지 연장하여 보철물이 들뜨지 않도록 한다."},{"label":5,"text":"변연을 연장하여 자정작용 작업이 원활하지 않다."}],"answer_raw":"3","explanation":"(치과보존학 p234-236)\n(보기 복원이 정확하진 않습니다..)\n1) 다소 뭉툭하고 강인한 법랑질 변연이 형성됨\n2) 작업모형.. -> 보기 기억이 안납니다\n3) 상악소구치와 제1대구치의 2급 금 인레이 와동형성 시 심미적 이유로 근심협측 인접면 와\n동벽의 플레어를 최소한으로 제한할 필요가 있다.\n4) 치은-협측, 치은-설측선각은 변연까지 연장되지 않아야 하는데, 연장되어 와동의 변연까지\n뻗어있는 경우 변연이 들뜨게 됨.\n5) 인접면에서의 2차 플레어로 변연이 embrasure 까지 연장되어, 자정작용과 인레이 장착\n시 마무리 작업을 원활하게 한다.","images":["images/questions/q043.png"],"source_page":22},{"id":"q044","number":44,"question":"금인레이 유지력 관련 설명에서 옳은 것은?","choices":[{"label":1,"text":"유지구는 유지력을 보강할 수 없다."},{"label":2,"text":"치관외와벽인 경우 서로 마주보는 와벽에 의해 얻어진다."},{"label":3,"text":"치관내와벽에서 교합면 방향으로 수렴해야 한다."},{"label":4,"text":"와벽의 길이보다 평행한 와벽이 중요하다."},{"label":5,"text":"마주보는 와벽이 하나는 길고, 하나는 짧을 경우 유지력은 짧은 와벽에 의해 결정된다."}],"answer_raw":"5","explanation":"교과서 229쪽","images":[],"source_page":23},{"id":"q045","number":45,"question":"전부도재관의 가장 바람직한 형태는?","choices":[{"label":1,"text":"chamfer"},{"label":2,"text":"knife edge"},{"label":3,"text":"feather edge"},{"label":4,"text":"round shoulder"},{"label":5,"text":"shoulder with bevel"}],"answer_raw":"1","explanation":")\n해설 : ref) 치과보존학 p.441 오른쪽 문단\n: 크라운이나 브릿지 형태의 경우, 삭제 외형이 크게 다르지는 않으나 변연의 경우 상대적으\n로 보다 두껍고 명확하게 부여하여야 하며, shoulder 나 chamfer 변연 형성이 추천된다. ~\n사면 형성을 해서는 안된다.\n             ref) A&S p.507 왼쪽 문단\n: ~ well-defined chamfer margin seem appropriate.","images":[],"source_page":23},{"id":"q046","number":46,"question":"젊은 남자환자가 전치부 심미적 이유로 병원을 내원함. 진단명과 치료법으로 맞는 것?\n(그림 - 교과서에는 없어서 가장 비슷한 느낌의 사진으로 구글링함)","choices":[{"label":1,"text":"쇼그렌 증후군 + 복합레진"},{"label":2,"text":"상아질 형성 저하 + 세라믹 crown"},{"label":3,"text":"법랑질 형성 부전 + 세라믹 laminate"},{"label":4,"text":"칫솔질에 의한 abrasion + 세라믹 laminate"},{"label":5,"text":"테트라사이클린 변색 + 세라믹 crown"}],"answer_raw":"3","explanation":"교과서에 특별히 reference는 못 찾았으나 사진이 전형적인 법랑질 형성 부전이었습니다.","images":["images/questions/q046.png"],"source_page":24},{"id":"q047","number":47,"question":"다음 중 도재 라미네이트의 적응증으로 옳은 것은?","choices":[{"label":1,"text":"마모증 및 침식증이 있는 치아"},{"label":2,"text":"절단 교합인 환자"},{"label":3,"text":"치주질환 심한 환자"},{"label":4,"text":"법랑질 부족한 치아"},{"label":5,"text":"치아 위치 이상"}],"answer_raw":"1","explanation":"(5번도?)\n해설:치과보존학 p420-421\n1) 치아 우식증,부식,마모로 인한 치관부 소실은 적응증\n2) parafunction이 없어야하기에 절단 교합도 안 되지 않을까 싶습니다.\n3) 이 내용은 어떤 교과서를 보더라도 나오지가 않아요..\n4) 법랑질 접착을 얻기 힘든 경우는 비적응증\n5) 회전된 치아, 불규칙한 치아 배열, 정중이개, 치아 사이 공간은 적응증, 치아 형태 및 위치\n이상이 심하여 과도한 치아삭제가 요구되는 경우는 비적응증","images":[],"source_page":24},{"id":"q048","number":48,"question":"재래형 글래스아이오노머시멘트 사용으로 적당한 것은","choices":[{"label":1,"text":"광범위한 치수강"},{"label":2,"text":"부분전장관 수복"},{"label":3,"text":"금속 합착"},{"label":4,"text":"수분조절이 되지 않는 환자"},{"label":5,"text":"수복물의 유지력 좋고 우식활성이 높은 환자"}],"answer_raw":"5","explanation":"치과보존학 p486 표22-2\n1) 치수강이 큰 경우 gic는 비추천\n2) 부분 전장관 수복 시 zpc,gic 비추천\n3) 금속수복물 합착은 pc/reinforced zoe 추천\n4) 격리가 어려운 경우엔 zpc,gic 비추천\n5) 우식 이환율이 높은 경우 gic,rmgic 추천","images":[],"source_page":25},{"id":"q049","number":49,"question":"섬유 강화형 레진 포스트에 대한 설명으로 옳은 것은?","choices":[{"label":1,"text":"보통 합착형 시멘트를 사용한다."},{"label":2,"text":"상아질과 탄성계수가 유사하다."},{"label":3,"text":"치질과 접착하지만 응력분산에는 비효율적이다."},{"label":4,"text":"심미성이 요구되는 부위에는 탄소 섬유 포스트를 이용한다."},{"label":5,"text":"광중합형 유동성 복합레진을 이용하면 적합도가 증가하여 결합력이 증가한다."}],"answer_raw":"2","explanation":"치과보존학 4판 p458\n섬유 강화 레진 포스트는 다른 재료에 비해 상아질과 유사한 탄성 계수를 갖고,~\n(FOD 4판 p569 table 21-1 참고)\n3) p458 치질과 화학적으로 접착할 수 있고 치질-코스트-코어 한 덩어리를 이루어 응력을 효\n과적으로 분산시킬 수 있다.\n4) p458 탄소 섬유 포스트는 어두운 색으로 인해 심미성이 요구되는 부위에 사용하기 어려웠\n다.\n5) p459 증가된 필러 함량, 작아진 필러 크기, 이중 중합 또는 화학 중합 방식에 의해 코어용\n복합레진의 적합성이 증가되었고,","images":[],"source_page":25},{"id":"q050","number":50,"question":"다음 중 스트레스가 가장 집중되는 형태는?","choices":[{"label":1,"text":"평행형 포스트"},{"label":2,"text":"경사형 포스트"},{"label":3,"text":"평행 톱니형 포스트"},{"label":4,"text":"나사형 경사진 포스트"},{"label":5,"text":"평행형과 경사형의 조합형 포스트"}],"answer_raw":"4","explanation":"치과보존학 4판 p457\n나사형의 경사진 포스트가 가장 많은 스트레스를 유발한다","images":[],"source_page":26},{"id":"q051","number":51,"question":"다음 그림이 의미하는 치경부 병소는?","choices":[{"label":1,"text":"부식"},{"label":2,"text":"교모"},{"label":3,"text":"마모"},{"label":4,"text":"굴곡파절"},{"label":5,"text":"치경부우식"}],"answer_raw":"4","explanation":"(치과보존학 4판 그림 17-2 p.390)","images":["images/questions/q051.png"],"source_page":26},{"id":"q052","number":52,"question":"다음은 생활치미백술에서 사용되는 약제의 분해과정으로, A B 빈칸에 해당되는 것은?","choices":[{"label":1,"text":"oxygen                     water"},{"label":2,"text":"oxygen             hydrogen oxide"},{"label":3,"text":"oxygen             dihydrogen oxide"},{"label":4,"text":"ammonia          carbon dioxide"},{"label":5,"text":"ammonia       benzalkonium chloride"}],"answer_raw":"4","explanation":"(Fundamental 4판, p.418 Fig 16-5)","images":["images/questions/q052.png"],"source_page":27,"explanationImages":["images/explanations/q052_explanation_1.png"]},{"id":"q053","number":53,"question":"다음 중 노화에 따른 상악 전치의 변화로 옳은 것은?","choices":[{"label":1,"text":"상아질이 얇아진다"},{"label":2,"text":"표면질감 증가한다"},{"label":3,"text":"빛반사 증가한다"},{"label":4,"text":"법랑질 투명도가 높아진다"},{"label":5,"text":"법랑질 절단 결절이 선명해진다"}],"answer_raw":"4","explanation":"(치과보존학 4판 p.344-345)\n1) 나이가 들수록 상아질은 두꺼워진다\n2) 나이가 들수록 법랑질의 표면질감 감소한다\n3) 빛의 반사 감소한다\n4) 법랑질의 투명도는 더욱 증가한다\n5) 절단연은 평평해진다","images":[],"source_page":27},{"id":"q054","number":54,"question":"다음 중 투과하는 빛을 산란시키는 아래의 광학적 성질에 가장 가까운 단어는?","choices":[{"label":1,"text":"색상 Hue"},{"label":2,"text":"명도 Brightness"},{"label":3,"text":"채도 Chroma"},{"label":4,"text":"광택 Gloss"},{"label":5,"text":"투명도 Translucency"}],"answer_raw":"5","explanation":"(FOD p.467 fig.17-39)\nVeneers displaying different amounts of translucency. The left veneer is made\nfrom a very translucent porcelain, which allows most of the underlying tooth color\nto show through.","images":["images/questions/q054.png"],"source_page":28},{"id":"q055","number":55,"question":"물체가 외부로부터 일부 파장을 흡수하고 더 긴 파장의 빛을 방출하는 현상은?","choices":[{"label":1,"text":"광택(gloss)"},{"label":2,"text":"형광"},{"label":3,"text":"진주광"},{"label":4,"text":"유백광"},{"label":5,"text":"투명도"}],"answer_raw":"2","explanation":"번 아닌가요\n치과보존학 5판 p344\n-유백광은 물체의 내부 밀도분포가 고르지 않거나 굴절률이 불균일한 경우에 나타나는 산란현\n상이다. 가시광선이 법링질에 의해서 산란되면서 짧은 파장 (bluish tone)은 반사시키 고 긴\n파장(yellow-orange) 은 투과시켜 나타나는 현상으로서 투명도가 높은 젊은 법랑질에서 발생\n하며 절단면과 인접면에서 두드러지게 나타난다.\n-형광성은 UV광선 하에서 상아질이 청색을 흡수하거나 백색광을 방출시켜 발생하며 역시 치\n아에 생동감을 부여한다. 비형광성 수복재를 사용하는 경우 회색조를 띄며 uv광에서 검게 나\n타난다.\nArt and Science, 7th edition, p203, (chapter7)\n- Fluorescence is a form of luminescence, that is, a form of light emission by a\nsubstance as the result of some external stimuli. Following the excitation by light,\nusually ultraviolet (UV), a luorescent substance will reemit some of the absorbed\nenergy in the form of longer wavelengths.\n번역 : 형광 물질은 흡수된 에너지의 일부를 더 긴 파장의 형태로 다시 방출합니다.\n문제에서 더 긴 파장을 방출한다고 하였으므로, 형광성이 정답으로 보입니다","images":[],"source_page":28},{"id":"q056","number":56,"question":"근관치료된 치아의 파절 강도를 가장 약하게 하는 요인으로 옳은 것은?","choices":[{"label":1,"text":"노화"},{"label":2,"text":"수분 상실"},{"label":3,"text":"치질 삭제"},{"label":4,"text":"킬레이트"},{"label":5,"text":"Naocl로 인한 구조 약화"}],"answer_raw":"3","explanation":"(근관치료학 p.433)","images":[],"source_page":29},{"id":"q057","number":57,"question":"다음은 우식으로 인한 상아질의 반응에 대한 모식도 및 조직학적 반응이다. A에 해당하는\n것은?\n[모식도는 교과서에 없는 모식도 였던 것으로 추정됨. new odontoblast-like cell이 새로운\ndentin을 형성하는 모식도]","choices":[{"label":1,"text":"1차 상아질"},{"label":2,"text":"2차 상아질"},{"label":3,"text":"반응 상아질"},{"label":4,"text":"수복 상아질"},{"label":5,"text":"경화 상아질"}],"answer_raw":"4","explanation":"번 수복상아질\n\n\nA&S fig.1.27 참고\n++ 제 기억으로는 이 그림이었던걸로 기억해요..!\n\n\n\n\n출처\nPathway 10th p.871 그림 23-3 B수복상아질","images":["images/questions/q057.png"],"source_page":29,"explanationImages":["images/explanations/q057_explanation_1.png"]},{"id":"q058","number":58,"question":"C형 근관에 대한 설명으로 옳은 것은?","choices":[{"label":1,"text":"백인에서 호발한다."},{"label":2,"text":"하악 제1대구치에서 호발한다."},{"label":3,"text":"근심협측에 분리된 치근 나타난다."},{"label":4,"text":"1979년 Cox와 Cooke이 처음으로 보고하였다."},{"label":5,"text":"Hertwig’s epithelial root sheath가 근심 또는 협측 치근과 fusion되어서 생긴다."}],"answer_raw":"4","explanation":"(POP 12판 p.223)\n4: 출처는 못 찾겠으나 맞는 보기.\n1,3: 아시아에서 주로 나타나고 하악 제2대구치에서 호발.\n5: Hertwig’s epithelial root sheath가 근심 또는 협측 치근과 fusion의 failure로 나타남.\n\n\n4번 보기 해설 추가합니다 (POP 10판 p231)\nC 모양 근관계는 1979년에 처음 보고되었다.(Ref. Cooke HG, Cox FL:C-shaped canal\nconfigurations in mandibular molars. J Am Dent Assoc 99)","images":[],"source_page":30},{"id":"q059","number":59,"question":"다음 클램프의 이름은?","choices":[{"label":1,"text":"Wingless"},{"label":2,"text":"Tiger"},{"label":3,"text":"Silker-Glickman"},{"label":4,"text":"Deep reaching"},{"label":5,"text":"톱니 달린 clamp"}],"answer_raw":"3","explanation":") Silker-Glickman (POP 10판 p.123)","images":["images/questions/q059.png"],"source_page":31},{"id":"q060","number":60,"question":"500개의 치아를 검사한 Kransner & Rankow에 따르면 근관입구와 치수강저를 찾는데\n이용되는 기준은?","choices":[{"label":1,"text":"CDJ"},{"label":2,"text":"CEJ"},{"label":3,"text":"DEJ"},{"label":4,"text":"Pulpal floor"},{"label":5,"text":"Pulp horn"}],"answer_raw":"2","explanation":"(POP 12판 Chapter 7)\nKransner and Rankow found that the cementoenamel junction(CEJ) was the most\nimportant anatomic landmark for determining the location of pulp chambers and\nroot canal orifices.","images":[],"source_page":31},{"id":"q061","number":61,"question":"다음 중 근관내 미생물 연구내용과 연구자 간에 옳게 짝지어진 것은?","choices":[{"label":1,"text":"Miller: 괴사된 치수에서 세균을 처음으로 발견했다."},{"label":2,"text":"Hunter: 괴사된 치수이더라도 세균이 없으면 치근단염증은 발생하지 않는다."},{"label":3,"text":"Kakehashi: 무균 쥐와 일반 쥐에 인위적으로 치수를 노출했을 때 세균이 없다면 치수 및"},{"label":4,"text":"Moller: 모든 질환의 원인은 세균이며 괴사된 치수의 세균이 전신으로 퍼져 심각한 전신질"},{"label":5,"text":"Anthony van: 근관 내 세균은 치관부 중간부 치근부 분포가 다르다."}],"answer_raw":"3","explanation":"(근관치료학 p.107-108)\nAntony Van Leeuwenhoek: 17세기에 괴사된 치수에서 세균을 처음으로 발견\nMiller: Antony가 세균을 발견하고 200년 뒤 세균이 치근단치주염의 원인이라는 가설을 제\n시. 광학 현미경으로 근관 내 세균을 관찰한 후 근관의 치관부와 중간부 그리고 치근단부에\n세균이 다르게 분포함을 보고\nMoller: 세균에 의한 감염이 치근단치주염의 발생에 얼마나 중요한지 보여줌. 치수를 인위적\n으로 괴사시킨 후 한쪽 군은 세균감염을, 다른 군은 감염이 안되게 한 후 치근단 조직의 반응\n을 관찰\nHunter: 내과의사로 많은 질병의 원인이 세균이라고 주장하며, 이러한 세균은 좋지 않은 구\n강 상태와 치과 치료에서 기인하는 경우가 많다고 주장: “Focal infection theory”","images":[],"source_page":32},{"id":"q062","number":62,"question":"odontoclast 현미경 사진이다. 옳지 않은 것은?","choices":[{"label":1,"text":"RGD amino-sequence를 가진 경조직만 흡수한다."},{"label":2,"text":"파골세포와 비슷한 형태지만 크기가 더 크고 세포핵이 더 많다."},{"label":3,"text":"전상아질은 RGD peptide가 없어서 내흡수가 억제된다."},{"label":4,"text":"OPG는 유인 수용체로 파괴활동을 억제한다."},{"label":5,"text":"Ruffled border로 부착하여 상아질을 흡수한다."}],"answer_raw":"2","explanation":"(해설 POP 12판 (P.711-712) 그림 18.1 )\nOdontoclasts differ from osteoclasts in that they are smaller, have fewer nuclei,\nand have smaller sealing zones, possibly as result of differences in their respective\nresorption substrata.","images":["images/questions/q062.png"],"source_page":32},{"id":"q063","number":63,"question":"전도속도가 제일 빠른 것은?","choices":[{"label":1,"text":"A-α"},{"label":2,"text":"A-β"},{"label":3,"text":"A-δ"},{"label":4,"text":"B"},{"label":5,"text":"C dorsal root"}],"answer_raw":"1","explanation":"(근관치료학 교과서 p20 표1-1)","images":[],"source_page":33,"explanationImages":["images/explanations/q063_explanation_1.png"]},{"id":"q064","number":64,"question":"다음은 Vertucci에 의한 근관 형태 분류 중 type Vll를 고르시오.\n2.          3.            4.            5.\n답 : 4 (근관치료학 p.166)","choices":[],"answer_raw":"4","explanation":"(근관치료학 p.166)","images":["images/questions/q064.png"],"source_page":33,"answer_only":true,"answer_display":"④ Type VII","explanationImages":["images/explanations/q064_explanation_1.png"]},{"id":"q065","number":65,"question":"다음 사진에서 M으로 표시된 신경섬유와 비교한 U 신경섬유의 특징으로 옳은 것은?","choices":[{"label":1,"text":"전달 속도가 빠르다."},{"label":2,"text":"전기적 자극에 더 민감하다."},{"label":3,"text":"치수 내 깊은 곳에 위치한다."},{"label":4,"text":"Schwann 세포에 의해 둘러싸여있다."},{"label":5,"text":"치수발생과정 중 늦게 발생한다."}],"answer_raw":"3","explanation":") (POP 10th p.504)\n“M” 으로 표시된 구조는 Schwann 세포에 의해 둘러싸인 myelinated nerve axon이며 “U”\n로 표시된 섬유는 unmyelinated axon입니다.\n1) unmyelinated axon은 전달 속도가 느립니다.\n2) unmyelinated axon은 전기적 자극에 더 둔감합니다.\n3) 치수 내 깊은 곳에 위치합니다.\n\n\n\n\n4) myelinated nerve axon(“M” 섬유)가 둘러싸여 있습니다\n5) myelinated nerve axon(“M” 섬유)가 더 늦게 발생하고, 이는 치수에서 A 섬유의 상대적\n으로 늦은 출현으로 전기 치수 검사가 어린 치아에서 신뢰할 수 없는 경향이 있는 이유를 설\n명할 수 있습니다.","images":["images/questions/q065.png"],"source_page":34,"explanationImages":["images/explanations/q065_explanation_1.png"]},{"id":"q066","number":66,"question":"치내치의 분류(Oehler’s classification) 중 다음 제시된 그림에 해당되는 것은?","choices":[{"label":1,"text":"Type I"},{"label":2,"text":"Type II"},{"label":3,"text":"Type IIIA"},{"label":4,"text":"Type IIIB"},{"label":5,"text":"해당 없음"}],"answer_raw":"2","explanation":"근관치료학 교과서 174p 심화학습 치내치의 분류","images":["images/questions/q066.png"],"source_page":35,"explanationImages":["images/explanations/q066_explanation_1.png"]},{"id":"q067","number":67,"question":"방사선 촬영에서 대조도에 직접적으로 영향을 미치는 것 중 술자가 조절할 수 있는 유일\n한 것은?","choices":[{"label":1,"text":"mA"},{"label":2,"text":"kVp"},{"label":3,"text":"노출시간"},{"label":4,"text":"조사 거리"},{"label":5,"text":"필름의 크기"}],"answer_raw":"2","explanation":"mA, 노출 시간, 조사 거리 등은 방사선량(노출도)에 영향을 미치지만 대조도에는 직접적으로\n영향을 주지 않습니다. 필름의 크기는 대조도와 관계가 없습니다.","images":[],"source_page":36},{"id":"q068","number":68,"question":"하악 제1대구치 근관치료시 파일 분리(separation)가 되었다. 분리된 파일을 두장의 방사\n선사진으로 확인시 원심(A)측에서 발견되었다. 부가적인 치근인 이름은 radix (B)이다.\nA,B","choices":[{"label":1,"text":"협, entomolaris"},{"label":2,"text":"협, paramolaris"},{"label":3,"text":"설, entomolaris"},{"label":4,"text":"설, paramolaris"},{"label":5,"text":"설, exomolaris"}],"answer_raw":"3","explanation":"","images":[],"source_page":36},{"id":"q069","number":69,"question":"완전탈구된 치아를 연성고정시, 레진과 강선을 고정할때 강선 ( )mm를 사용하고자 한다.\n()mm 이내를 사용해야 연성 고정인가? () 최대값을 고르시오.","choices":[{"label":1,"text":"0.1"},{"label":2,"text":"0.2"},{"label":3,"text":"0.3"},{"label":4,"text":"0.4"},{"label":5,"text":"0.5"}],"answer_raw":"4","explanation":"POP 12th P.840\nComposite and wire splints where the wire diameter is no greater than 0.4mm is\nconsidered to be a flexible splint.","images":[],"source_page":36},{"id":"q070","number":70,"question":"치근파절된 치근의 치유 형태 중 성공적으로 치유되었다고 볼 수 없는 것은?","choices":[{"label":1,"text":"A"},{"label":2,"text":"B"},{"label":3,"text":"C"},{"label":4,"text":"D"},{"label":5,"text":"모두"}],"answer_raw":"4","explanation":"(Pathway of Pulp 한글판 10판, p.685-686)\nA: healing with calcified tissue\nB: healing with interproximal connective tissue\nC: healing with interproximal bone and connective tissue\nD: interproximal inflammatory tissue without healing\nA,B,C의 치유 형태는 성공한 것으로 간주. D는 치유되지 않은 경우임.\n\n\n\n71. 2012년 발표된       International Association of Dental Traumatology guidelines for\nthe management of traumatic dental injuries: 1. Fractures and luxations of\npermanent teeth 에 따른 함입된 치아에 대한 올바른 처치 방법은?\n1) 미성숙 치근을 가진 치아인 경우 교정적 정출 시행한다.\n2) 미성숙 치근을 가진 치아인 경우 외과적 정출 시행한다.\n3) 성숙 치근을 가진 치아가 3mm 이하 함입된 경우 처치 없이 기다린다.\n4) 성숙 치근을 가진 치아가 3mm 이하 함입된 경우 즉시 외과적 정출술 시행한다.\n5) 성숙 치근을 가진 치아가 3mm 이하 함입된 경우 즉시 교정적 정출술 시행한다.\n\n\n답 : 3 (C-2-2-1)\n미성숙치근인 경우 개입없이 자발맹출을 기다린다.\n성숙 치근을 가진 치아의 경우 <3mm 함입시, 처치하지 않고, 2-4주 후에도 움직임이 없으면\n수술적/교정적 정출 시행. >7mm 함입시, 수술적 정출 시행함.","images":["images/questions/q070.png"],"source_page":37},{"id":"q071","number":71,"question":"2012년 발표된  International Association of Dental Traumatology guidelines for\nthe management of traumatic dental injuries: 1. Fractures and luxations of\npermanent teeth 에 따른 함입된 치아에 대한 올바른 처치 방법은?","choices":[{"label":1,"text":"미성숙 치근을 가진 치아인 경우 교정적 정출 시행한다."},{"label":2,"text":"미성숙 치근을 가진 치아인 경우 외과적 정출 시행한다."},{"label":3,"text":"성숙 치근을 가진 치아가 3mm 이하 함입된 경우 처치 없이 기다린다."},{"label":4,"text":"성숙 치근을 가진 치아가 3mm 이하 함입된 경우 즉시 외과적 정출술 시행한다."},{"label":5,"text":"성숙 치근을 가진 치아가 3mm 이하 함입된 경우 즉시 교정적 정출술 시행한다."}],"answer_raw":"3","explanation":"미성숙치근인 경우 개입없이 자발맹출을 기다린다.\n성숙 치근을 가진 치아의 경우 <3mm 함입시, 처치하지 않고, 2-4주 후에도 움직임이 없으면\n수술적/교정적 정출 시행. >7mm 함입시, 수술적 정출 시행함.","images":[],"source_page":37},{"id":"q072","number":72,"question":"다음은 치아지지조직 손상을 감별진단한 표이다. A, B, C에 들어갈 증상으로 옳게 짝지어\n진 것은?\nA            B                C","choices":[{"label":1,"text":"타진 민감도     동요도           변위"},{"label":2,"text":"타진 민감도      변위            동요도"},{"label":3,"text":"동요도        변위            타진 민감도"},{"label":4,"text":"동요도     타진 민감도        변위"},{"label":5,"text":"변위        동요도           타진 민감도"}],"answer_raw":"1","explanation":"최신근관치료학 p. 610","images":["images/questions/q072.png"],"source_page":38,"explanationImages":["images/explanations/q072_explanation_1.png"]},{"id":"q073","number":73,"question":"치근내흡수에 대한 설명으로 옳은 것은?","choices":[{"label":1,"text":"치근 내흡수는 치근 외흡수에 비해 높은 빈도로 발생한다"},{"label":2,"text":"치수 내 다핵성 거대세포에 의해서 내면이 흡수되는 것이 특징적 소견이다."},{"label":3,"text":"상아모세포층과 전상아질과는 관련이 없다"},{"label":4,"text":"pink tooth는 내흡수에서만 일어나는 증상이다"},{"label":5,"text":"근관치료를 시행해도 내흡수의 진행을 멈출 수 없다"}],"answer_raw":"2","explanation":"POP 10판 p.692-693\n1) 치근 외흡수가 치근 내흡수에 비해 훨씬 더 많이 발생한다.\n2) 맞는 보기\n3) 치근 흡수가 일어나기 위해서는 육아조직이 존재해야 할뿐 아니라, 상아모세포층과 전상아\n질이 사라지거나 또는 변화되어야 한다.\n4) pink tooth는 내흡수의 전형적인 소견이며, pink tooth 는 상피하방 염증성 치근 외흡수\n의 소견일 수도 있다.\n5) 내흡수는 근관치료를 하여 흡수를 야기하는 세포에 혈류 공급을 효과적으로 차단하는 것이\n치료 방법니다.","images":[],"source_page":39},{"id":"q074","number":74,"question":"치아 지지 조직 손상에 대한 설명으로 옳은 것은?","choices":[{"label":1,"text":"측방탈구: 치아가 순측으로 변위된 경우"},{"label":2,"text":"정출: 치아가 근단부 방향으로 변위된 경우"},{"label":3,"text":"함입: 치아가 치경부 방향으로 변위된 경우"},{"label":4,"text":"진탕: 타진에 과민반응을 보이고 동요도가 증가되었으나 치아의 변이는 없는 경우"},{"label":5,"text":"아탈구: 변위와 동요도를 보이지 않으며 타진반응에 민감한 경우"}],"answer_raw":"1","explanation":"근관치료학 p.599,601\n정출-함입 설명이 서로 바뀌고, 진탕-아탈구 설명이 서로 바뀜","images":[],"source_page":39},{"id":"q075","number":75,"question":"다음 중 치근외흡수로부터 보호하는 조직은?","choices":[{"label":1,"text":"치수"},{"label":2,"text":"법랑질"},{"label":3,"text":"상아질"},{"label":4,"text":"백악질"},{"label":5,"text":"치조골"}],"answer_raw":"4","explanation":"(POP 10th, p.688)\n즉, 백악질 보호층이 소실되었기 때문에 치주인대의 염증으로 치근흡수와 골흡수가 야기된다.","images":[],"source_page":39},{"id":"q076","number":76,"question":"치수-상아질 복합체의 조직학적 소견이다. 다음 중 손상을 받아 내흡수가 일어나는 곳은?","choices":[{"label":1,"text":"A"},{"label":2,"text":"B"},{"label":3,"text":"C"},{"label":4,"text":"D"},{"label":5,"text":"E"}],"answer_raw":"2","explanation":"(POP 10th, p.495 - predentin, p.692 10th - 치근내흡수)\n치근흡수가 일어나기 위해서는 육아조직이 존재해야 할 뿐 아니라, 상아모세포층과 전상아질\n(predentin)이 사라지거나 또는 변화되어야 한다.","images":["images/questions/q076.png"],"source_page":40},{"id":"q077","number":77,"question":"치근단해부학에 대한 설명으로 옳은 것은?","choices":[{"label":1,"text":"백악상아경계는 근첨협착부와 항상 일치한다."},{"label":2,"text":"근첨협착부는 major apical diameter 라고도 한다."},{"label":3,"text":"근관에 따라 근첨협착부는 하나 이상일 수 있다."},{"label":4,"text":"백악상아경계는 방사선 사진 상에 보인다."},{"label":5,"text":"치근단공과 근첨협착부는 연령이 증가함에 따라 거리가 증가하는데 이는 상아질의 침착에"}],"answer_raw":"3","explanation":")\n1 근관내 CDJ위치는 매우 다양하다. 일반적으로 AC와 같은 지점이 아니며, AF 로부터 약\n1mm 지점에 위치한다. POP 10th 159p\n\n\n\n\n2.\n\n\nPOP10th 159p\n3. 전형적인 형태와 다른 경우는 경사진 협착부, 다수의 협착부, 평행한 협착부 등으로 표현될\n수 있다. (근관치료학 322p)\n\n\n\n\n4. 백악-상아질 경계 부위가 치근단 협착을 형성한다고 추론되어져 왔지만 사실 경계는 임상\n적으로 정확하게 결정하기 어렵고 백악질의 근관 내 범위는 다양하다. 비록 치근단 협착이 존\n재하나 매우 숙련된 술자일지라도 방사선 상에서 볼 수 없고, (근관치료학 172p)\n5. 이 거리는 백악질이 축적됨에 따라 나이가 들수록 더 커진다 (POP 10th 159p)","images":[],"source_page":41,"explanationImages":["images/explanations/q077_explanation_1.png","images/explanations/q077_explanation_2.png"]},{"id":"q078","number":78,"question":"2011년 Jung의 ‘Comparison of the Reliability of “0.5” and “Apex” Mark\nMeasurements in Two Frequency-based Electronic Apex Locators’ 논문에 대한 내용\n중 옳은 것을 고르시오.","choices":[{"label":1,"text":"“0.5” mark는 apical constriction 위치를 의미한다."},{"label":2,"text":"“apex”mark 보다 “0.5”mark가 더 정확하다."},{"label":3,"text":"위 논문에서 사용한 Root ZX와 i-Root의 주파수는 동일하다."},{"label":4,"text":"Root Zx의 ‘0.5’mark는 실제로 major foramen보다 평균 0.5mm 이상 짧은 지점을 나타"},{"label":5,"text":"“apex” mark는 major foramen의 위치를 나타낸다."}],"answer_raw":"5","explanation":"(C-3-1-2)\n3) Materials and Methods- Although the frequencies (0.5 and 5 kHz) used in i-\nRoot are different from those of Root ZX,\n5) In conclusion, the ‘‘APEX’’ mark of the EALs used in this study represents the\nMF (major foramen) consistently,","images":[],"source_page":42},{"id":"q079","number":79,"question":"다음 기구에 대한 설명으로 옳은 것은?","choices":[{"label":1,"text":"스테인레스 스틸을 꼬아서 만든 기구이다."},{"label":2,"text":"근관을 뚫고 삭제하는데 사용하는 기구이다."},{"label":3,"text":"근관을 삭제하고 확대하는 데 사용하는 기구이다."},{"label":4,"text":"근관 내 연조직 제거 시 사용하는 기구이다."},{"label":5,"text":"상아질을 삭제하는 신뢰할 수 있는 가장 오래된 기구이다."}],"answer_raw":"4","explanation":"근관치료학 226p.\nbarbed broach에 대한 설명\n1) 점점 가늘어지는부드러운강철에 절단기로 금을 내어 날카로운 가시가 바깥쪽을 향한다.\n4) Barbed broach는 연조직을 제거할 때사용한다.","images":["images/questions/q079.png"],"source_page":42},{"id":"q080","number":80,"question":"다음 중 근관성형의 일반적인 고려사항으로 옳은 것은?","choices":[{"label":1,"text":"초기 치관부 확대는 작업장 상실, 근관 변위 등의 오류를 줄일 수 있다."},{"label":2,"text":"효율적인 근관벽 삭제를 위해 세척액과 윤활제의 사용 없이 파일을 적용해야 한다."},{"label":3,"text":"기구와 세척액을 치근단 조직에까지 적용하면 치근단 세균 감소에 도움이 된다."},{"label":4,"text":"근단의 크기를 추정하기 위해 초기 근관 탐침 시 큰 크기의 파일을 사용하여야 한다."},{"label":5,"text":"삭제력을 증진하기 위해 파일을 근관벽에 꽉 끼도록 하여 회전을 하는 것이 바람직하다."}],"answer_raw":"1","explanation":"(근관치료학 p.326)\n1) 맞는 문장\n2) 세척액과 윤활제가 항상 채워진 상태에서 파일을 조작해야함\n3) 기구,세척액은 근관 내에 한정되어야 함\n4) 초기 근관 탐침은 항상 작은 파일로 시도\n5) 파일을 상아질에 꽉 끼도록 하거나 힘을 가하면 바람직하지 않은 회전 저항력 만들게 되어\n파절 유발","images":[],"source_page":43},{"id":"q081","number":81,"question":"다음 중 표준화된 크기의 파일과 색상 조합으로 옳은 것은?","choices":[{"label":1,"text":"25-노란색"},{"label":2,"text":"40-초록색"},{"label":3,"text":"55-파란색"},{"label":4,"text":"70-검은색"},{"label":5,"text":"90-흰색"}],"answer_raw":"5","explanation":"(근관치료학 p.226)\n25번 빨간색 / 40번 검정색 / 55번 빨간색 / 70번 초록색","images":[],"source_page":43},{"id":"q082","number":82,"question":"근관치료에 사용되는 기구의 표준화에 대한 설명으로 옳은 것은?","choices":[{"label":1,"text":"기구 끝 부분의 직경을 D16이라 한다."},{"label":2,"text":"파일의 작업날의 길이는 최소 21mm 이다."},{"label":3,"text":"D0의 직경은 D16의 직경보다 0.32mm 증가한다."},{"label":4,"text":"file의 직경은 file 작업 날의 1mm 당 0.02mm씩 커진다."},{"label":5,"text":"각 기구의 번호는 기구 끝의 직경의 10배로 나타낸다"}],"answer_raw":"4","explanation":"(근관치료학p224~225)\n1) D16 -> D0\n2) 21mm -> 16mm\n3) D16의 직경은 D0의 직경보다 0.32mm 증가한다\n4) 옳은 보기\n5) 10배 -> 100배","images":[],"source_page":43},{"id":"q083","number":83,"question":"다음 설명으로 맞는 것을 고르시오\n작은 수동 파일을 근단공 약간 넘겨서 삽입\n근단부 변위(transportation)을 예방할 수 있음\n근관에 세척제의 진입을 도움","choices":[{"label":1,"text":"glide path"},{"label":2,"text":"recapitulation"},{"label":3,"text":"apical patency"},{"label":4,"text":"apical clearing"},{"label":5,"text":"m~ dynamic activation"}],"answer_raw":"3","explanation":"근관치료학 326p","images":[],"source_page":44},{"id":"q084","number":84,"question":"cyclic fx 사진 흰 화살표가 의미하는 것","choices":[{"label":1,"text":"fibrous dimple"},{"label":2,"text":"concentric abrasion mark"},{"label":3,"text":"crack initiation area"},{"label":4,"text":"rewinding"},{"label":5,"text":"microvoid"}],"answer_raw":"3","explanation":"근관치료학 330p","images":["images/questions/q084.png"],"source_page":44},{"id":"q085","number":85," tion_1.png"]},{"id":"q090","number":90,"question":"다음 방사선사진 중 가장 오른쪽은 gp이다. 왼쪽에서부터 순서대로 나열한것은?","choices":[{"label":1,"text":"ss - fiber glass- ti"},{"label":2,"text":"Ti - fiber glass - ss"},{"label":3,"text":"fiber glass - ti - ss"},{"label":4,"text":"ti - ss - fiber glass"},{"label":5,"text":"ss - ti - fiber glass"}],"answer_raw":"1","explanation":"POP 12th 그림 10-19","images":["images/questions/q090.png"],"source_page":47},{"id":"q091","number":91,"question":"다음 중 limited mucoperiosteal flap은?","choices":[{"label":1,"text":"horizontal"},{"label":2,"text":"triangular"},{"label":3,"text":"trapezoidal"},{"label":4,"text":"rectangular"},{"label":5,"text":"curve submarginal"}],"answer_raw":"5","explanation":"5는 부분 점막골막 피판, 나머지는 전부 점막골막 피판 (pathway 10판 한글판 800p)","images":[],"source_page":48},{"id":"q092","number":92,"question":"다음 지혈제 중 수술부위 잔존 시 치유 지연시키는 것은?","choices":[{"label":1,"text":"gelfoam"},{"label":2,"text":"collacote"},{"label":3,"text":"epinephrine"},{"label":4,"text":"ferric sulfate"},{"label":5,"text":"calcium sulfate"}],"answer_raw":"4","explanation":"수술부위에서 ferric sulfate를 완전히 제거하지 못한 경우, 치유 지연과 이물반응, 심한 경우\n농양이 형성될 수 있다. (pathway 10판 한글판 804p)","images":[],"source_page":48},{"id":"q093","number":93,"question":"이 플랩에 대한 설명으로 맞는 것은?","choices":[{"label":1,"text":"반달모양 절개선을 가진다"},{"label":2,"text":"미세치근단수술에 쓰지 않는다"},{"label":3,"text":"치은퇴축되어 심미적 문제 생길 수 있다"},{"label":4,"text":"치근단 결손 부위 바로 윗부분에 절개선을 위치시킬 가능성 줄일 수 있다"},{"label":5,"text":"시야 확보를 위해 조직을 잡아당겨야 해서 가장자리가 찢어질수 있다"}],"answer_raw":"4","explanation":"근관치료학 책 521p\n1,2,5는 semilunar flap 설명\n3은 triangular or trapezoidal flap 설명","images":["images/questions/q093.png"],"source_page":48},{"id":"q094","number":94,"question":"GTR은 무슨 세포 이주를 막기 위한 것인가?","choices":[{"label":1,"text":"골모세포(osteoblast)"},{"label":2,"text":"치은세포(gingiva cell)"},{"label":3,"text":"치주인대세포(PDL cell)"},{"label":4,"text":"상아모세포(odontoblast)"},{"label":5,"text":"백악모세포(cementoblast)"}],"answer_raw":"2","explanation":"POP 10판 한글 P.820\n노출된 치근면과 치은조직, 그리고 치조골 사이에 놓이는 차폐막은 치은조직세포가 노출된 치\n근 표면에 이주하는 것을 방지한다.","images":[],"source_page":49},{"id":"q095","number":95,"question":"미백 후 부작용에 관한 사진이다. 그 이유로 가장 적당한 것은?","choices":[{"label":1,"text":"와동 확장을 불충분하게 하였다."},{"label":2,"text":"치수강 내 수산화칼슘을 첩약하였다."},{"label":3,"text":"치경부 barrier를 형성하지 않았다."},{"label":4,"text":"과붕산나트륨을 미백제로 사용하였다."},{"label":5,"text":"미백 과정 중에 에탄올로 근관을 처리하였다."}],"answer_raw":"3","explanation":"","images":["images/questions/q095.png"],"source_page":49},{"id":"q096","number":96,"question":"Carbamide peroxide에 대한 설명으로 옳은 것은?","choices":[{"label":1,"text":"pH 3-4.5이다."},{"label":2,"text":"내부 미백에 사용할 수 없다."},{"label":3,"text":"레진 수복 시 접착에 영향을 준다."},{"label":4,"text":"자가미백을 위하여 35% 농도를 사용한다."},{"label":5,"text":"빠른 분해를 위하여 수용성 레진인 carbopol을 포함한다."}],"answer_raw":"3","explanation":"(근관치료학 p.668)","images":[],"source_page":49},{"id":"q097","number":97,"question":"다음 임상 사진에서 보이는 변색의 원인은?","choices":[{"label":1,"text":"다양한 외인성 착색 요인에 의한 변색이다."},{"label":2,"text":"근관계의 심한 석회화로 인해 근관 내로의 접근이 어려운 경우가 많은 변색이다."},{"label":3,"text":"연령이 증가함에 따라 상아질 침착이 증가되고 법랑질 두께는 얇아지며, 표면 질감의 변화"},{"label":4,"text":"치수실이나 근관벽에 불규칙한 2차 상아질이 심하게 형성되어 변색을 야기한다."},{"label":5,"text":"내출혈된 적혈구가 분해되면서 유리된 헤모글로빈이 일련의 색소화합물을 생성하고 이들이"}],"answer_raw":"5","explanation":"근관치료학 p.657~658 2)치수내출혈, 그림 20-2\n치아 외상에 따른 근관 내출혈로 인해 적갈색의 변색을 보이는 상악중절치","images":["images/questions/q097.png"],"source_page":50},{"id":"q098","number":98,"question":"생활 치수 치료 시 가장 효과적인 지혈제는?","choices":[{"label":1,"text":"MTAD"},{"label":2,"text":"NaOCl"},{"label":3,"text":"epinephrine"},{"label":4,"text":"ferric sulfate"},{"label":5,"text":"CHX"}],"answer_raw":"2","explanation":"근관치료학 p.620\n노출된 치수 부위에서 출혈이 될 경우 지혈을 위해 1.5~6%의 NaOCl을 면구에 적셔서 강하게\n압박하는 것이 가장 효과적인 방법이며 5~10분간 압박 후에도 지혈이 되지 않는 경우에는 염\n증 치수로 진단한다.","images":[],"source_page":50},{"id":"q099","number":99,"question":"노화될수록 증가하는 것은?","choices":[{"label":1,"text":"치수세포 수"},{"label":2,"text":"치수혈관 수"},{"label":3,"text":"치수 세포크기"},{"label":4,"text":"치수 세포기질 양"},{"label":5,"text":"교원질 섬유수"}],"answer_raw":"5","explanation":"근관치료학 p.690","images":[],"source_page":51},{"id":"q100","number":100,"question":"노인의 치료와 관련하여 옳은 것은?","choices":[{"label":1,"text":"치수내 섬유화가 감소한다."},{"label":2,"text":"노년층에서 일어나는 동맥경화증이 치수벽에 미치는 영향에 대한 연구가 있다."},{"label":3,"text":"골다공증 치료약인 bisphosphonate제재를 경구 복용한 환자에서 근관치료 후 치근단병소"},{"label":4,"text":"급성 통증 반응을 보인다."},{"label":5,"text":"노인 환자에서는 방사선학적 근첨으로부터 1~2mm 짧게 근관장 설정하는 것이 적절하다."}],"answer_raw":"5","explanation":"근관치료학 p.693~701","images":[],"source_page":51}]}};
const YEARS=[2020,2021,2022,2023,2024,2025];
const KEY_PREFIX="QB_FINAL_V7_";
const OLD_KEY="QB_FINAL_V6";
const CURRENT_YEAR_KEY="QB_CURRENT_YEAR";
let DATA=null, YEAR=Number(localStorage.getItem(CURRENT_YEAR_KEY))||2025;
if(!YEARS.includes(YEAR)) YEAR=2025;
let mode="home",idx=0,answers={},books={},positions={},wrongIds=[];
let pendingMode=null,pendingCurrentId=null,previewFilter="all";

function key(y=YEAR){return KEY_PREFIX+y}
function defaultState(){return {mode:"all",idx:0,answers:{},books:{},positions:{},wrongIds:[],lastUsed:0}}
function loadState(y){
  let raw=localStorage.getItem(key(y));
  // Existing v12 data is preserved and migrated to the new year-specific 2025 store.
  if(!raw && y===2025){
    const old=localStorage.getItem(OLD_KEY);
    if(old){localStorage.setItem(key(y),old);raw=old;}
  }
  let s=raw?JSON.parse(raw):defaultState();
  answers=s.answers||{}; books=s.books||{}; positions=s.positions||{};
  wrongIds=s.wrongIds||Object.keys(answers).filter(id=>answers[id]?.lastCorrect===false);
  mode=s.mode&&["all","wrong","bookmark"].includes(s.mode)?s.mode:"all";
  idx=Number.isInteger(s.idx)?s.idx:0;
  if(!positions[mode]) positions[mode]=idx;
}
function save(){
  if(!DATA)return;
  positions[mode]=idx;
  localStorage.setItem(key(YEAR),JSON.stringify({mode,idx,answers,books,positions,wrongIds,lastUsed:Date.now()}));
  localStorage.setItem(CURRENT_YEAR_KEY,String(YEAR));
}
async function loadYear(y,showHome=false){
  if(!YEARS.includes(y))return;
  if(DATA)save();
  const app=document.getElementById("app");
  app.innerHTML='<div class="card"><p style="text-align:center">📚 '+y+'년 문제를 불러오는 중...</p></div>';
  try{
    let loaded=false;
    try{
      if(location.protocol!=="file:"){
        const r=await fetch(`questions-${y}.json`,{cache:"no-cache"});
        if(!r.ok)throw new Error(`HTTP ${r.status}`);
        DATA=await r.json(); loaded=true;
      }
    }catch(_e){}
    if(!loaded){
      DATA=EMBEDDED_DATA[y];
      if(!DATA)throw new Error(`embedded data unavailable for ${y}`);
    }
    YEAR=y; loadState(y); localStorage.setItem(CURRENT_YEAR_KEY,String(y));
    mode=showHome?"home":mode;
    render();
  }catch(e){
    app.innerHTML=`<div class="card"><h3>⚠️ ${y}년 문제를 불러오지 못했습니다.</h3><p style="color:#6b7280">questions-${y}.json 파일이 같은 폴더에 있는지 확인해주세요.</p><p style="font-size:12px;color:#9ca3af">${esc(e.message)}</p></div>`;
  }
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function arr(m=mode){if(!DATA)return[];if(m==="wrong")return DATA.questions.filter(q=>wrongIds.includes(q.id));if(m==="bookmark")return DATA.questions.filter(q=>books[q.id]);return DATA.questions}
function ans(q){return q.answer_raw?[Number(q.answer_raw)]:[]}
function modeName(m){return m==="all"?"전체":m==="wrong"?"오답":"북마크"}
function goHome(){save();mode="home";render()}
function changeYear(y){loadYear(Number(y),true)}
function openInfo(type){
  const title=document.getElementById("infoTitle"),box=document.getElementById("infoContent");

  const fig=q.images?.length?`<div class="figure">${q.images.map(src=>`<img src="${src}" onclick="zoom(this.src)">`).join('')}</div>`:"";
  const efig=q.explanationImages?.length?q.explanationImages.map(src=>`<div class="figure explanation-figure"><img src="${src}" onclick="zoom(this.src)"></div>`).join(""):"";
  document.getElementById("app").innerHTML=`<div class="card"><div class="meta">${YEAR}년 · 제 ${q.number}번 · ${idx+1} / ${A.length} <button class="book ${marked?'active':''}" title="북마크" onclick="toggleBook('${q.id}');event.stopPropagation()">🔖</button></div><div class="q">${esc(q.question||"(원문에서 문제 문장이 확인되지 않습니다.)")}</div>${fig}<div>${cs}</div>${result}${st?`<div class="explain"><b>해설</b><br>${esc(q.explanation||"원문 해설 없음")}${efig}</div><button class="retry-btn" onclick="resetQuestion('${q.id}')">🔄 이 문제 다시 풀기</button>`:""}<div class="nav"><button onclick="move(-1)">← 이전</button><button onclick="move(1)">다음 →</button></div><div class="list-card"><div class="list-head"><b>📋 문제 목록</b><button onclick="openGoto()">전체 번호 보기</button></div><div class="list-note">번호를 누르면 바로 이동합니다 · 🟢 풀이함 · ❌ 오답 · 🔖 북마크</div></div><div style="font-size:12px;color:#6b7280;margin-top:8px">오답 횟수: ${st?.wrongCount||0} · ${marked?'🔖 북마크됨 · ':''}${q.source_page?`원문 p.${q.source_page}`:''}</div></div>`;
  save();
}
loadYear(YEAR,true);
</script>
</body></html>
