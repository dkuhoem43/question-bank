<script>
const EMBEDDED_DATA={"2020":{"year":2020,"title":"2020 치과보존과 전문의시험 1차","questions":[{"id":"q001","number":1,"question":"병소가 개방되기 전, 투과 광학 현미경에서 법랑질 우식 병소를 관찰할 때 나누어지는 각 층 중에서\n최근에 일어난 재광화의 양을 말해주는 층은 무엇인가?","choices":[{"label":1,"text":"투명층(translucent zone)"},{"label":2,"text":"암층(dark zone)"},{"label":3,"text":"병소본체(body of lesion)"},{"label":4,"text":"표층(surface zone)"},{"label":5,"text":"이환영역(affected area)"}],"answer_raw":"2","explanation":"치과보존학 4판 p.34\n따라서 암대의 크기는 최근에 일어난 재광화의 양을 말해주는 지표라 볼 수 있다.","images":[],"source_page":20},{"id":"q002","number":2,"question":"Modified Keyes-Jordan diagram 에 근거한 치아 우식증의 발생 기전에서 치아우식증의 전제 요건이 아\n닌 것은?","choices":[{"label":1,"text":"식습관"},{"label":2,"text":"치아"},{"label":3,"text":"치면세균막"},{"label":4,"text":"탄수화물"},{"label":5,"text":"시간"}],"answer_raw":"1","explanation":"치과보존학 4판 p.26","images":["images/2020/q002_img1.jpeg"],"source_page":1},{"id":"q003","number":3,"question":"우식증 시작에는 (1) 가 중요한 역할을 하지만 우식증 진행에는 (2)가 상당한 관여를 하는 것으로 여겨\n지고 있다 옳게 연결된 것은?","choices":[{"label":1,"text":"Streptococcus sanguis - streptococcus mutans"},{"label":2,"text":"Streptococcus mutans - Lactobacilli"},{"label":3,"text":"Lactobacilli - streptococcus mutans"},{"label":4,"text":"streptococcus mutans - streptococcus sanguis"},{"label":5,"text":"streptococcus mutans - streptococcus mitis"}],"answer_raw":"2","explanation":"","images":[]},{"id":"q004","number":4,"question":"staphan curve 에서 법랑질의 임계 ph는?","choices":[{"label":1,"text":"4.0"},{"label":2,"text":"4.5"},{"label":3,"text":"5.0"},{"label":4,"text":"5.5"},{"label":5,"text":"6.0"}],"answer_raw":"4","explanation":"","images":[]},{"id":"q005","number":5,"question":"1996년 pashley의 Archs oral biol.에서의 논문 \"fluid shifts across human dentine in vitro in response to\nhydrodynamic stimuli\" 에서 상아세관액의 inward를 유발하는 자극은?","choices":[{"label":1,"text":"air blast"},{"label":2,"text":"56도 hot water"},{"label":3,"text":"2도 cold water"},{"label":4,"text":"osmotic stimuli"},{"label":5,"text":"4.9mol/l solution of calcium chloride"}],"answer_raw":"2","explanation":"/ 필독 A 1-1-2","images":[],"source_page":39},{"id":"q006","number":6,"question":"재생 근관치료에서 자연적 스캐폴드는?","choices":[{"label":1,"text":"hydroxyapatite"},{"label":2,"text":"hyaluronic acid"},{"label":3,"text":"polyglycolic acid"},{"label":4,"text":"polylactic acid"},{"label":5,"text":"tricalcium phosphate"}],"answer_raw":"2","explanation":"한글판 651p 왼쪽 하단에 나와 있습니다","images":[]},{"id":"q007","number":7,"question":"치주인대 내 마취에 대해 옳은 것은?","choices":[{"label":1,"text":"치주인대 내 마취는 압력마취이다."},{"label":2,"text":"치주인대 내 마취에서 마취의 발현은 즉각적이다."},{"label":3,"text":"가는 굵기의 바늘은 마취의 효과를 증진시킨다."},{"label":4,"text":"혈관수축제는 치주인대 내 자입의 효과에 영향을 주지 않는다."},{"label":5,"text":"마취용액을 치주인대강으로 밀어넣는다."}],"answer_raw":"2","explanation":")\n해설 : pathway 10ed. p. 760-761","images":[]},{"id":"q008","number":8,"question":"환자가 좌측 구치부의 통증을 주소로 내원하였다. 통증의 상, 하악 구분이 어려울 때 정확한 진단을 위\n해 사용할 수 있는 방법은?","choices":[{"label":1,"text":"저작 검사"},{"label":2,"text":"냉자극 검사"},{"label":3,"text":"열자극 검사"},{"label":4,"text":"선택적 마취"},{"label":5,"text":"염색법과 광투과법"}],"answer_raw":"4","explanation":")\n해설 : pathway 10ed. p. 21","images":[]},{"id":"q009","number":9,"question":"Waleed et al. Regeneration Endodontics: A Systematic Analysis of the Failed Cases에서 실패의 가장 큰\n원인은?","choices":[{"label":1,"text":"coronal fracture"},{"label":2,"text":"root fracture"},{"label":3,"text":"coronal leakage"},{"label":4,"text":"persistent infection"},{"label":5,"text":"tooth discoloration"}],"answer_raw":"4","explanation":")\n해설 : 최신저널 근관 2019-2분기 첫 번째 논문\n실패한 증례의 79%에서 persistent infection이 관찰됨.","images":[]},{"id":"q010","number":10,"question":"다음에 해당되는 술식으로 알맞은 것은?\n 치관부 치수를 일부 제거한다.\n 치관부, 치근부 치수를 보존적으로 유지 가능\n 생활력 있는 치관부 치수 통하여 생활력 검사가 가능","choices":[{"label":1,"text":"Apexification"},{"label":2,"text":"Revascularization"},{"label":3,"text":"Shallow pulpotomy"},{"label":4,"text":"Direct pulp capping"},{"label":5,"text":"Indirect pulp capping"}],"answer_raw":"3","explanation":") Shallow;얕은 (=Cvek, Partial) pulpotomy\n해설 :\npathway 한글판 p. 675:\n- 부분 치수절단술(partial pulpotomy)이란 건강한 치수 부위 까지 치관부 치수를 제거하는 것을 의미 한다. 치관부에 치수조직이 잔\n존하기 때문에 다음 내원 때에 생활력검사가 가능하다.\n- 치수 복조술(pulp capping)은 노출된 치수조직을 제거하지 않고 노출된 치수에 직접적으로 약제를 도포하는 것을 의미 한다.\npathway 한글판 p. 911-916:\n Apexification: 개방근침에서 hard barrier를 형성하게 하는 치료. 실활 치수를 가진 미성숙 영구치가 적응증.\n Revascularization: 치수가 없었던 치아에서 치근형성이 계속되게 하는 치수 재생이 예상된다. 줄기세포가 풍부 한 apical papilla\n가 있는 미성숙 실활 영구치가 적응증.","images":[]},{"id":"q011","number":11,"question":"다음 그림의 술식이 필요한 경우는?","choices":[{"label":1,"text":"자발통이 있는 경우"},{"label":2,"text":"치수노출이 있는 경우"},{"label":3,"text":"치수생활력검사에 음성반응을 보이는 경우"},{"label":4,"text":"최종수복물을 통해 영구 밀폐가 불가능한 경우"},{"label":5,"text":"와동의 형성 과정에서 치수와 근접한 우식상아질을 남겨야하는 경우"}],"answer_raw":"5","explanation":")\n해설 : 치과보존학 4판 152,153p.\n<간접치수복조술>\n- 방사선 사진상 치수에 근접한 깊은 우식을 지니나 자발통이 없고 치수검사에 정상적으로 반응할 때 고려될 수 있으며 치수노출이\n없어야 한다.\n- 최종 수복물을 위한 와동을 형성하며 이때 치수와 매우 근접한 부위의 우식 상아질을 남겨둔다.","images":["images/2020/q011_img1.jpeg"],"source_page":4},{"id":"q012","number":12,"question":"다음 사진과 같이 레진인레이가 탈락하여 재합착을 시행해야할 때 올바른 설명은?","choices":[{"label":1,"text":"sandblast 처리가 필요 없다."},{"label":2,"text":"합착 전에 교합조정을 시행해야 한다."},{"label":3,"text":"conventional GI cement가 추천된다."},{"label":4,"text":"치아에 접착제를 도포시 두껍게 도포해야 한다."},{"label":5,"text":"레진 시멘트 합착 후 잉여 시멘트 제거 시 약간 경화되고 나서 제거하는 것이 용이하다."}],"answer_raw":"5","explanation":")\n해설 : 치과보존학 4판 411-413p.\n1) 수복물의 표면을 샌드블라스트로 처리한 후, 실레인(silane)을 도포한다.\n2) 레진시멘트를 이용하여 인레이를 완전히 치아에 붙인 후에 교합조정을 해야 한다는 점에 유의해야 한다.\n3) 레진 시멘트를 사용하는 것이 바람직하다.\n4) 접착제는 이원중합형 또는 광중합형을 권하고 있는데, 치아표면에 되도록 얇게 도포되도록 주의한다. 그렇지 않을 경우 접착제의\n두께 때문에 수복물의 장착이 방해를 받을 수 있다.\n5) 기구 조작이 적절치 않은 부위는 복합레진이 약간 경화한 상태에서 제거하는 것이 임상적으로 편리한 경우가 많다.","images":["images/2020/q012_img1.jpeg"],"source_page":5},{"id":"q013","number":13,"question":"다음 과정에 대한 설명 중 옳은 것은?","choices":[{"label":1,"text":"교원섬유망이 한번 수축되면 재팽창이 불가능하다."},{"label":2,"text":"self-etch 접착제 사용시 자주 발생한다."},{"label":3,"text":"교원섬유망의 팽창 정도는 결합강도에 영향을 주지 ,"source_page":12},{"id":"q031","number":31,"question":"Simplified 1-step self-etching adhesive의 접착계면에서 수분투과성이 나타나는 이유는?","choices":[{"label":1,"text":"접착제의 친수성"},{"label":2,"text":"접착제의 소수성"},{"label":3,"text":"접착제의 높은 pH"},{"label":4,"text":"접착제의 보관온도"},{"label":5,"text":"중합 후 표면에 발생하는 oxygen inhibition layer"}],"answer_raw":"1","explanation":"해설: 치과보존학 제4개정판 276페이지 ( 특히 프라이머와 접착레진이 혼합된 simplified-step adhesives에서 일어나기 쉬운데,\n접착제의 친수성 성분이 많아질수록 산성을 띄게 되는 데서 기인한다.)","images":[]},{"id":"q032","number":32,"question":"환자와 술자의 자세와 위치에 관한 설명으로 옳은 것은?","choices":[{"label":1,"text":"술자 손목은 수평이거나 약간 낮은 위치로 한다."},{"label":2,"text":"이상적인 기구 교환 위치는 턱 아래와 가슴 상부 사이이다."},{"label":3,"text":"시야를 확보하기 위해서 100,000 lux 이상 밝기의 조명이 필요하다."},{"label":4,"text":"수평위로 환자를 위치시킬 경우 상악의 교합평면이 수평면에 45도가 되도록 한다."},{"label":5,"text":"Four hand dentistry에서 원칙적으로 보조자의 움직임이 일정하고 거기에 맞추어 술자 직이게 된다."}],"answer_raw":"2","explanation":"해설) 『치과보존학』 4판 기준 p.156-159\n① 술자 손목은 수평이거나 약간 높은 위치로 한다.\n③ 일반적으로 치과 치료 시 10,000 lux 이상 밝기의 조명이 필요하다.\n④ 수평위로 환자를 위치시킬 경우 상악의 교합평면이 바닥면에 수직으로 되도록 하며, 하악궁을 치료할 때에는 하악의 교합평면이\n수평면에 45도가 되도록 한다.\n⑤ Four hand dentistry에서 원칙적으로 술자의 움직임이 일정하고 거기에 맞추어 보조자가 움직이게 된다.","images":[]},{"id":"q033","number":33,"question":"(치과보존학 4판 p.348 그림 15-4) 다음 사진처럼 상악 좌측 중절치를 수복한 직후 변색이 발견된 이\n유로 가장 적절한 것은 무엇인가?","choices":[{"label":1,"text":"구강 내 타액으로 오염"},{"label":2,"text":"이장재로 인한 변색"},{"label":3,"text":"변연 누출로 인한 변색"},{"label":4,"text":"순측 접근으로 인해 색상 부조화가 생김."},{"label":5,"text":"설측 접근으로 인해 제거하지 못 한 우식이 남음.\n해설) 『치과보존학』 4판 그림 15-4"}],"answer_raw":"5","explanation":"","images":["images/2020/q033_img1.jpeg","images/2020/q033_img2.jpeg"],"source_page":13},{"id":"q034","number":34,"question":"복합레진 색조 선택에 대한 설명 중 옳은 것은?","choices":[{"label":1,"text":"상아질 색조는 치아 중앙을 기준으로 정한다."},{"label":2,"text":"검정색 판을 배경에 대면 주변 색상으로 인한 영향을 줄일 수 있다."},{"label":3,"text":"법랑질 탈수에 걸리는 시간이 재수화에 필요한 시간보다 길다."},{"label":4,"text":"법랑질 세척 후 10초간 air dry 후 색조 선택 한다."},{"label":5,"text":"색조선택은 첫인상이 매우 중요하고, 젊은 여자의 안목이 정확할 때가 많다."}],"answer_raw":"5","explanation":"해설) 『치과보존학』 4판 p.346-347\n①상아질 색조는 치아의 치경부1/3을 기준으로 한다. → 여기가 enamel layer 얇기 때문\n②neutral gray card를 배경으로 사용해야, 어두운 구강은 치아를 밝게 보이게 함\n③약 10초간 탈수된 법랑질이 재수화 되려면 30분정도 소요됨\n④법랑질이 젖어있는 상태에서 색조 선택. 법랑질이 건조되면 투명도는 감소하고, 명도는 증가하므로\n⑤정답","images":[]},{"id":"q035","number":35,"question":"치아 경조직 손상 및 치아우식 진단 및 치료에 관한 설명 중 옳은 것은?","choices":[{"label":1,"text":"예방과 치료를 동시에 생각해야 한다."},{"label":2,"text":"급속히 진행되는 우식은 어두운 색상을 보인다."},{"label":3,"text":"비우식성 치경부 병소는 나이들수록 감소하는 경향을 보인다."},{"label":4,"text":"타액분비 증가하면 침식증이나 마모증에 이환될 가능성 증가한다."},{"label":5,"text":"접촉점 하방의 갈색으로 변색된 단단한 법랑질은 우식활성도 높은 소아 환자에서 발견된다."}],"answer_raw":"1","explanation":"해설)\n①정답\n②p.59 급속히 진행되는 우식은 색상이 밝은 편\n③p.388 비우식성 치경부 병소는 연령의 증가에 따라 증가하는 양상\n④p.392 타액의 분비가 감소되면 치아 경조직의 침식성, 교모성, 마모성 상실의 가능성은 보다 높아짐\n⑤p.58-59 우식활성도가 낮은 나이가 많은 환자에서 관찰됨.","images":[]},{"id":"q036","number":36,"question":"광중합 방법 중 중합 수축응력이 높은 것은?","choices":[{"label":1,"text":"Ramp cure"},{"label":2,"text":"step cure"},{"label":3,"text":"pulse delay"},{"label":4,"text":"slow start"},{"label":5,"text":"uniform continuous cure"}],"answer_raw":"5","explanation":"해설) 『치과보존학』 4판 p.335 서술 및 p.336 [그림 14-31]\n급속한 광중합에 의해 과도한 중합수축응력이 발생하므로, 조사되는 전체 에너지의 총합은 일정한 범위 내에서 가급적 천천히 중합\n하기를 권하는 연구 결과가 보고되고 있음. 여기에는\n two-step cure / pulse-delay cure / low-intensity cure / moderate intensity cure / exponential cure / oscilating cure / ramped cure\n따라서 처음부터 일정한 광도로 중합하는 ⑤번이 중합수축응력이 높음.","images":[]},{"id":"q037","number":37,"question":"다음 중 옳은 것은?","choices":[{"label":1,"text":"중합률은 광강도와 시간이 증가할수록 증가한다."},{"label":2,"text":"할로겐 중합기는 사용함에 따라서 강도가 유지되어 영구적이다."},{"label":3,"text":"광중합 복합레진은 기시제로 Camphorquinone이 들어있고, 이는 약 420nm에서 활성화된다."},{"label":4,"text":"겔화점에 이르는 시간을 최대한 늦추면 응력을 해소하기 어려워진다."},{"label":5,"text":"plasma과 laser는 높은 광 강도로 빠른 중합 수축이 가능하고 중학 수축을 감소시킨다."}],"answer_raw":"1","explanation":"?\n해설) 『치과보존학』 4판 p.335\n①중합률은 광도와 조사 시간이 증가할수록 증가되는 것으로 알려져 있어 그 동안 제조회사에서는 보다 높은 광도의 광 조사기를\n개발하기 위해 노력해왔다.\n②할로겐 램프의 경우에는 시간이 지남에 따라 효율이 크게 감소되는 경우가 많다\n③교과서에 camphoroquinone의 흡수파장은 정확하게 나와 있지는 않습니다. 다만 halogen 중합기는 450-500nm 파장, LED는\n470nm의 blue light을 방출한다고 서술된 것을 보았을 때, 420nm는 너무 짧은 파장대인 것 같습니다. 구글 검색해보면\ncamphoroquinone은 400-500nm 파장을 흡수하는데, 468nm에서 peak라고 합니다.\n④겔화점에 이르는 시간을 최대한 늦추어 중합체 내의 소성 흐름에 의한 수축응력 해소를 도모할 수 있음.\n⑤laser나 plasma arc를 이용한 중합기는 높은 에너지를 발생하여 복합레진을 신속하고 깊게 중합시킬 수 있으나, 중합수축을 감소\n시킬 수는 없다.","images":[]},{"id":"q038","number":38,"question":"수복용 GI에 대한 것으로 옳은 것은?","choices":[{"label":1,"text":"미반응 단량체가 많아 생체적합성이 떨어진다."},{"label":2,"text":"열팽창계수가 크다."},{"label":3,"text":"Conventional type은 복합레진보다 조작성이 쉽다."},{"label":4,"text":"Conventional type은 수분에 덜 민감하다."},{"label":5,"text":"복합레진보다 접착성은 떨어지나 불소유리로 이차우식에 좋다."}],"answer_raw":"5","explanation":"해설) GI는 생체적합성이 좋은 편이며, CTE가 치아와 비슷해 변연적합성 좋음. conventional GI는 경화시 수분민감성이 큼.","images":[]},{"id":"q039","number":39,"question":"다음 그림에서 gap을 없애기 위한 방법은?","choices":[{"label":1,"text":"역사면"},{"label":2,"text":"유지구"},{"label":3,"text":"이차플레어"},{"label":4,"text":"교합면사면"},{"label":5,"text":"치은측사면"}],"answer_raw":"5","explanation":"","images":["images/2020/q039_img1.jpeg"],"source_page":16},{"id":"q040","number":40,"question":"다음의 구조를 가짐으로써 얻는 효과는?","choices":[{"label":1,"text":"저항이 감소한다."},{"label":2,"text":"유지가 증가한다."},{"label":3,"text":"대합치의 교합력을 분산시킨다."},{"label":4,"text":"교합측 1/3의 치질을 보호한다."},{"label":5,"text":"Transitional line angle의 치질을 보호한다."}],"answer_raw":"2","explanation":"해설) 『치과보존학』 4판 p.239\nskirt는 보존적으로 유지, 저항형태를 증진시키는 방법","images":["images/2020/q040_img1.jpeg"],"source_page":16},{"id":"q041","number":41,"question":"치과용 시멘트의 특징으로 옳은 것은?","choices":[{"label":1,"text":"점도가 높을수록 좋다."},{"label":2,"text":"작업시간 짧을수록 좋다"},{"label":3,"text":"젖음성은 중요하지 않다."},{"label":4,"text":"구강내 용해도는 상관없다."},{"label":5,"text":"치수와 치주조직에 유해하지 않아야한다."}],"answer_raw":"5","explanation":"","images":[]},{"id":"q042","number":42,"question":"2009년 Vrochari 등의 “Curing efficiency of four self-etching, self-adhesive resin cements”에서 옳은 것\n은?","c "q068","number":68,"question":"Andressen 등은 1967년에 수평치근파절의 치유양상을 4가지로 분류하였다. 이 중 석회화된 조직으로\n치유된 경우를 아래 보기 사진에서 고르시오.","choices":[{"label":1,"text":"A"},{"label":2,"text":"B"},{"label":3,"text":"C"},{"label":4,"text":"D"},{"label":5,"text":"없음"}],"answer_raw":"1","explanation":"ref. pathways of the pulp 10판 한글판 685쪽 그림17-24\nABCD 차례대로 석회화된 조직으로 치유된 겨우, 결합조직으로 치유된 경우, 골조직과 결합조직으로 치유된 경우, 파절된 부위에 육\n아조직이 채워진 치유되지 않은 경우","images":["images/2020/q068_img1.jpeg"],"source_page":28},{"id":"q069","number":69,"question":"2012, International Association of Dental Traumatology guidelines for the management of traumatic\ndental injuries:","choices":[{"label":1,"text":"Fractures and luxations of permanent teeth 논문에서 제시한 성숙한 치아 치근 중앙에서\n파절되었을때 스플린트 기간으로 적절한것은?"},{"label":1,"text":"1주"},{"label":2,"text":"2주"},{"label":3,"text":"4주"},{"label":4,"text":"8주 8. 16주"}],"answer_raw":"3","explanation":". 4주\nC-2-2-1","images":[]},{"id":"q070","number":70,"question":"미성숙근첨 avulsion시 재혈관화 위해 다음의 사진과 같이 치근에 처리하는 약제는?","choices":[{"label":1,"text":"비타펙스"},{"label":2,"text":"콜라겐"},{"label":3,"text":"미노사이클린"},{"label":4,"text":"calcium phosphate"}],"answer_raw":"3","explanation":". 미노사이클린 pathways of the pulp 10판 그림 17-43","images":["images/2020/q070_img1.jpeg"],"source_page":29},{"id":"q071","number":71,"question":"근관 형성시 발생하는 문제점 가운데에 다음의 설명은 무엇인가?\n- 파일이 원래의 형태인 직선으로 복원되려는 경향으로 인해 치근의 1/2 부위에서 근관의 바깥쪽이 더\n많이 삭제되는 근관 형성의 오류","choices":[{"label":1,"text":"Zipping"},{"label":2,"text":"Ledge"},{"label":3,"text":"Perforation"},{"label":4,"text":"Blockage"},{"label":5,"text":"Canal transportation"}],"answer_raw":"5","explanation":"Pathway of the pulp 11th edition p.733\nCanal transportation is defined as “the removal of canal wall structure on the outside curve in the radicular half of the canal due to\nthe tendency of files to restore themselves to their original linear shape during canal preparation.","images":[]},{"id":"q072","number":72,"question":"2017년 Oliveira 등의 논문 ‘Determination of the accuracy of 5 electronic apex locators in the function\nof different employment protocols’에 대하 설명 중 옳은 것은 무엇인가?","choices":[{"label":1,"text":"치근단공까지 (0.0) 측정이 제일 정확하다."},{"label":2,"text":"치근단공까지 갔다가 –1.0으로 후최하여 측정하는 것이 정확하다."},{"label":3,"text":"치근단공 너머까지 갔다가 치근단공까지 후퇴하는 것이 제일 정확하다."},{"label":4,"text":"치근단공보다 짧은 측정(-1.0)이 정확하다."},{"label":5,"text":"프로토콜에 따라 정확도의 차이가 없다."}],"answer_raw":"1","explanation":". 장비와 무관하게 치근단공에서 멈춘 경우가 가장 우수한 결과를 보였다.\n(Results : Considering the tested variations, the statistical analysis pointed out that, regardless of the EAL, the best results were\nobserved when the devices had their penetration interrupted in the AF and in this position, had their measurement determined.)","images":[]},{"id":"q073","number":73,"question":"다음의 치근단 형태학에 대한 설명 중 옳은 것은?","choices":[{"label":1,"text":"Constriction은 여러 개가 존재하기도 한다."},{"label":2,"text":"백악상아경계는 방사선사진 상에서 볼 수 있다."},{"label":3,"text":"근첨협착부를 major apical diameter라고 한다."},{"label":4,"text":"근첨협착부는 CDJ와 항상 일치한다."},{"label":5,"text":"증령에 따라 근첨협착부와 치근단공 사이 거리가 멀어지는 것은 상아질 침착에 의한 것이다."}],"answer_raw":"1","explanation":"Pathway of the pulp 11th edition p.144\nThe existence of an AC may be more conceptual than real. Several studies have reported that a traditional single AC was present less\nthan half the time, particularly when apical root resorption and periradicular pathosis were factors. The apical portion of the root canal\noften is tapered, or the walls are parallel to each other, or the canal has multiple constrictions.","images":[]},{"id":"q074","number":74,"question":"근관성형과정에서 다음에 해당하는 에러는?\n-\n 기구의 강직성에 의해 직선적으로 펼쳐지면 서 상아질로 파고들면서 생기는 현상이다. 점차 큰\n파일 을 사용함에 따라 강직성이 증가하여 나타나기 쉬우며， 원래의 길이보다 짧은 곳까지만\n진입이 되고 더 깊이 파 일이 들어가지 않으면 이것이 만들어진 것으로 생각할 수 있다.","choices":[{"label":1,"text":"ledge"},{"label":2,"text":"zipping"},{"label":3,"text":"transporation"},{"label":4,"text":"perforation"}],"answer_raw":"1","explanation":". ledge\n근관치료학 p327 Ledge 설명.","images":[]},{"id":"q075","number":75,"question":"천 ering\n해설을 보면 손가락 모양이 reticular nanoleakage / 화살표가 hybrid layer 삼각형이 spotted nanoleakage","choices":[{"label":1,"text":"레진"},{"label":2,"text":"치아"},{"label":3,"text":"reticular nanoleakage"},{"label":4,"text":"nanoleakage"},{"label":5,"text":"nano layering"}],"answer_raw":"미복원","explanation":"해설을 보면 손가락 모양이 reticular nanoleakage / 화살표가 hybrid layer / 삼각형이 spotted nanoleakage로 표시됩니다.","images":["images/2021/q016_fig1.jpg","images/2021/q016_fig2.jpg"],"answer_only":true,"answer_display":"정답 미복원"},{"id":"q017","number":17,"question":"표시된 부분에서 일어나는 변화는?\nZir 상전이 그림 (crack tip에 응력집중된 그림. 그림은 못찾겠어요ㅠ)","choices":[],"answer_raw":"tetragonal → monoclinic","explanation":"tetragonal → monoclinic (보존 96p)","images":[],"answer_only":true,"answer_display":"tetragonal → monoclinic"},{"id":"q018","number":18,"question":"다음은 하중시 재료에 나타나는 기계적 양상을 나타낸 그림이다. A가 의미하는 것은??","choices":[{"label":1,"text":"Resilience"},{"label":2,"text":"Loading energy"},{"label":3,"text":"Total deformation"},{"label":4,"text":"Plastic deformation"},{"label":5,"text":"Fracture deformation"}],"answer_raw":"1","explanation":". Resilience (ref. 치과보존학 4판 그림 5-5)","images":["images/2021/q016_img3.jpg"]},{"id":"q019","number":19,"question":"2009년 Robert, Charlton 의 ‘The release of mercury from amalgam restorations and its health effects: A review’ 에 대한 내용으로 옳은 것은?","choices":[{"label":1,"text":"Mercury vapor 는 치조점막을 통과할 수 없어 혈액에 흡수될 수 없다."},{"label":2,"text":"Elemental mercury 는 아주 독성이 강하며, 위장관의 점막을 손실시킬 수 있다."},{"label":3,"text":"Methyl mercury 는 먹이사슬 과정에서 농축되며 배아 형성에 특히 위험하다."},{"label":4,"text":"Mercury vapor 는 Blood brain barrier 를 통과할 수 없어 중추신경에 영향을 끼치지 못한다."},{"label":5,"text":"Inorganic mercury 는 HgCl2 와 같은 수은염 상태로 위장관을 통해 문제없이 배설되고, 거의 흡수되지 않는다."}],"answer_raw":"3","explanation":"(ref. 필독저널 B-2-1-2 내용중에 Methylmercury is particularly damaging to embryos. 라는 문장 있습니다.)","images":[]},{"id":"q020","number":20,"question":"아말감 관련 설명. 틀린 것을 고르시오.","choices":[{"label":1,"text":"치과 아말감은 안정성이 확인된 수복 재료이다."},{"label":2,"text":"아말감 수복과 제거에 러버댐을 사용하지않는다."},{"label":3,"text":"아말감의 수은은 와동 충전과정과 제거하는 과정에서 증기형태로 방출된다."},{"label":4,"text":"아말감 사용 결정은 환자에게 충분히 정보를 주고 동의를 얻은 후 이루어져야 한다."},{"label":5,"text":"미세한 양의 수은에 영향을 받는 환자로는 임산부, 신장기능이상환자, 과민 반응 환자 등이 있다."}],"answer_raw":"2","explanation":"(ref. 모든 보기는 치과보존학 177p. 대한 치과보존학회(KACD,2015) 관련 내용.\n아말감 수복 또는 제거하는 데 있어서 치과의사는 수은 관리에 대해 많은 주의를 기울여야 한다. 다음과 같은 관리 지침을 추천한다.\n-치료 시 항상 러버댐을 사용한다.\n-강한 흡인기를 사용한다.\n-다량의 물로 입을 여러 번 헹구게 한다.\n-오래된 수복물을 제거할 때는 충분한 주수하에 시행한다. )","images":[]},{"id":"q021","number":21,"question":"아말감 상(phase) 기호와 분자식 조합이 잘못된 것을 고르시오.","choices":[{"label":1,"text":"γ(Ag3Sn)"},{"label":2,"text":"γ1(Ag2Hg3)"},{"label":3,"text":"γ2(Sn7-8Hg)"},{"label":4,"text":"Θ(Cu6Sn5)"},{"label":5,"text":"ε(Cu3Sn)"}],"answer_raw":"4","explanation":"(ref. 치과보존학 182p. 표 10-2. 아말감 상(phase)의 성질에 5가지 기호와 분자식 나와 있으며\n보기 4번 분자식에 맞는 상 기호는 η’입니다. Θ는 관련 내용 없는 기호입니다.)","images":[]},{"id":"q022","number":22,"question":"ANSI/ADA No.1규격","choices":[{"label":1,"text":"구리 함량은 43%이다."},{"label":2,"text":"최대 허용 크리프는 3% 이다."},{"label":3,"text":"체적변화는 5분뒤 +-20㎛/cm 이다."},{"label":4,"text":"체적변화는 24시간후 +-20㎛/cm 이다."},{"label":5,"text":"압축 강도는 80 MPa이다."}],"answer_raw":"1","explanation":"(치과보존학 4판 182-183p. 2~4번 보기는 책에 있는 그대로)","images":[]},{"id":"q023","number":23,"question":"2급 아말감 와동 형성에 대한 내용중 아닌 것은?","choices":[{"label":1,"text":"와동의 외형은 모든 우식부위와 소와 열구를 포함한다."},{"label":2,"text":"와동의 변연은 건전한 치질상에 위치하여야 한다."},{"label":3,"text":"인접면 와동의 치은측 위치는 치은정 하방에 위치한다."},{"label":4,"text":"인접치와 접촉되는 면을 제거 하여 아말감 변연이 자정작용이 일어나는 부위까지 ㅡ연장되어야 한다."},{"label":5,"text":"와동의 외형은 각진부분 없이 연속적인 곡선으로 이루어져야 한다."}],"answer_raw":"","explanation":"; 3번 (치과보존학 4판 185p. 1,2,4,5 맞는 답. 보기 순서는 다를 수 있습니다.)","images":[]},{"id":"q024","number":24,"question":"일차저항형태인것은?","choices":[{"label":1,"text":"탈락에저항한다."},{"label":2,"text":"dovetail"},{"label":3,"text":"우식부위에 쉽게 접근할 수 있다"},{"label":4,"text":"치수보호를 해야한다."},{"label":5,"text":"파절에 저항한다"}],"answer_raw":"5","explanation":", 치과보존학 4판, p.126 :"Sectional matrix","explanation":"치과보존학 4판 10장 p.201","images":["images/2021/q005_img11.png"],"answer_only":true,"answer_display":"Sectional matrix"},{"id":"q036","number":36,"question":"굴곡파절(abfraction)에 대한 설명으로 맞는 것은?","choices":[{"label":1,"text":"부적절한 잇솔질에 의해 유발된다."},{"label":2,"text":"인접면 간의 접촉점에 발생되는 경조직 손상이다."},{"label":3,"text":"내인성 산에 의한 치면 손상이다."},{"label":4,"text":"비정상적인 교합력이 치아에 가해진 결과로 유발된다."},{"label":5,"text":"넓은 U-shape 형태의 함몰이 특징이다."}],"answer_raw":"4","explanation":"해설: ① 마모에 대한 설명\n② 교모에 대한 설명\n③ 부식에 대한 설명\n④ 굴곡파절에 대한 설명\n⑤ 마모에 대한 설명\n(ref.치과보존학 4판 17장 p.388~392)","images":[]},{"id":"q037","number":37,"question":"러버댐 클램프 각 구성요소에 대해 연결이 틀린 것은?","choices":[{"label":1,"text":"A - bow"},{"label":2,"text":"B - notch"},{"label":3,"text":"C - jaw"},{"label":4,"text":"D - wing"},{"label":5,"text":"E - hole"}],"answer_raw":"2","explanation":"B - notch\n해설: notch가 아니고 prong 또는 point 또는 beak라고 불립니다.\nnotch는 전치부용 클랩프에서 러버댐 포셉 거는 부위입니다.\n(그림은 Fundamental 4판 p.188 Fig.8-13 a 그림 그대로 출제되었습니다.)","images":["images/2021/q005_img12.jpg"]},{"id":"q038","number":38,"question":"다음은 착시현상을 이용하여 주변치아와 조화롭게 하기위한 방법이다. A는 기준으로, B-E에 대한 효과로 알맞은 것은?","choices":[{"label":1,"text":"Shortening, lengthening, Narrow, widening"},{"label":2,"text":"lengthening, shortening, widening, narrow"},{"label":3,"text":"Narrow, lengthening, shortening, widening"},{"label":4,"text":"Narrow,widening, shortening, lengthening"},{"label":5,"text":"Narrow, widening, lengthening, shortening"}],"answer_raw":"4","explanation":"A&S fig 9.3 / 9.4","images":["images/2021/q005_img13.jpg"]},{"id":"q039","number":39,"question":"다음 상악 우측 중절치에 대한 설명으로 옳은 것은?","choices":[{"label":1,"text":"레진의 색상 결정"},{"label":2,"text":"레진의 texture 결정"},{"label":3,"text":"사용할 레진의 양 결정"},{"label":4,"text":"중합 정도 확인"},{"label":5,"text":"연마 정도 확인"}],"answer_raw":"1","explanation":"Art and science 7판 fig 7.18","images":["images/2021/q005_img14.jpg"]},{"id":"q040","number":40,"question":"다음 기구의 용도는 무엇인가?","choices":[{"label":1,"text":"광중합"},{"label":2,"text":"치면연마"},{"label":3,"text":"균열검사"},{"label":4,"text":"복합레진외형형성"},{"label":5,"text":"복합레진충전"}],"answer_raw":"2","explanation":"아트앤사이언스 p274 fig10-28","images":["images/2021/q005_img15.png"]},{"id":"q041","number":41,"question":"최신수복논문(18-3-2) 'In-vitro transdentinal diffusion of monomers from adhesives'에서 dentine disk를 통해 release되는 monomer는 HEMA,TEGDMA, BisGMA이다. 다음 표에 들어갈 순서로 알맞은 것을 고르시오.","choices":[{"label":1,"text":"TEGDMA-HEMA-BisGMA"},{"label":2,"text":"BisGMA-TEGDMA-HEMA"},{"label":3,"text":"HEMA-BisGMA-TEGDMA"},{"label":4,"text":"HEMA-TEGDMA-BisGMA"},{"label":5,"text":"BisGMA-HEMA-TEGDMA"}],"answer_raw":"4","explanation":"보기순서 다를 수 있습니다","images":["images/2021/q005_img16.png"]},{"id":"q042","number":42,"question":"최신수복논문 (20-1-4)'A randomized controlled 10 years follow up of a glass ionomer restorative material in class I and class II cavities' 중 bravo score가 가장 높은 항목은?","choices":[{"label":1,"text":"Retention"},{"label":2,"text":"Secondary caries"},{"label":3,"text":"Anatomical form"},{"label":4,"text":"Surface texture"},{"label":5,"text":"Marginal discoloration"}],"answer_raw":"5","explanation":"","images":["images/2021/q005_img17.png"]},{"id":"q043","number":43,"question":"넓게 확대된 치아형성으로 인해 유지력이 약해진 경우 추가적으로 부여하는 것은","choices":[{"label":1,"text":"skirt"},{"label":2,"text":"Cusp capping"},{"label":3,"text":"pin"},{"label":4,"text":"occlusal bevel"},{"label":5,"text":"gingiva bevel"}],"answer_raw":"1","explanation":". skirt는 2차 플레어로부터 협측면 또는 설측면 방향의 tranisitional line angle을 지난 점까지 주조금 온레이의 협, 설측 인접면 변연을 얇게 연장한 것으로, 치아에 대해 보존적으로 유지, 저항형태를 증진시키는 방법이다.","images":[]},{"id":"q044","number":44,"question":"다음 수용성 기구에 대한 설명으로 틀린것은?\n(13-95-8-14)\n8\n95\n14\n이 기구의 이름은 아말감 캐리어다","choices":[],"answer_raw":"5","explanation":"","images":["images/2021/q005_img18.png"]},{"id":"q045","number":45,"question":"1986년 CP Owen이 제시한 resistance 증가 방법이 아닌것은?","choices":[{"label":1,"text":"isthums"},{"label":2,"text":"proximal box"},{"label":3,"text":"shoulder prep"},{"label":4,"text":"crown lengthening"},{"label":5,"text":"rounding of sharp occlusal surface.."}],"answer_raw":"5","explanation":"…?( 3번도 답아닌가요?...) occlusal surface -> internal angle…? 잘 모르겠어요\n필독 B 5-1-1 Factors influencing the retention and resistance of preparations for cast intracoronal restorations\n<전국보존과정리본>\n- Retention은 단일 삽입로와 관련이 있으며, path가 클수록, retention도 커짐\n- Rounded internal angle은 stress를 줄일 것이고, cusp는 가능한 피개되어야 함\n- slice는 lingual entrant angle에서 약하므로, gold bulk 증가를 위해 삭제되어야 함\n- box와 isthmus는 유지력에 도움을 줌\n- 치과내수복물은 축방향이 아닌 탈락하는 힘에 저항력을 제공하고, isthmus, box, groove 같은 특성도 이런 저항력을 명백히 증가시킴","images":[]},{"id":"q046","number":46,"question":"복합레진 간접수복물에 대해 옳은 설명은?","choices":[{"label":1,"text":"반드시 교두피개는 하지 않아야 한다"},{"label":2,"text":"방습이 되지 않는 부위에서도 사용 가능하다"},{"label":3,"text":"중합수축에 의한 접착면 형성이 용이하지 않다."},{"label":4,"text":"평이한 보기였어요"},{"label":5,"text":"구치부에서도 인레이 온레이로 사용할 수 있다"}],"answer_raw":"5","explanation":"405쪽, 과도한 교합면/법랑질 마모를 통해 교합력이 크거나 악습관이 있는 환자를 식별 가능하며, 이런 환자의 경우 cusp coverage 하는것이 좋다\n405쪽, 복합 진 인레이 수복은 접착 술식을 포함하기 때문에 방습과 격리는 필수적 .\n중합수축응력 효과의 감소 .13) : 중합수축과 그로인한 응력은 직접복합레진 수복의 주요한 문제점으로, 변연누출, 이차우식, 술후 민감증의 문제 등을 야기하는 주 원인이다.\n평이한 틀린말\n404쪽, 전통적으로 1급 수복은 직/간접방식의 급속수복물이 많았으나, 환자들의 심미적 요구가 증가함에 따라 구치부에 복합레진을 이용한 인레이, 온레이 수복을 시행할 수 있다.","images":[]},{"id":"q047","number":47,"question":"CAD/CAM에 대해서 다음 중 옳은 것은?\n2) CAD/CAM이란 computer-aided design/computer-aided milling의 약자이다.\n4) 변연은 예각이 있게 마무리한다.","choices":[{"label":1,"text":"모든 CAD/CAM은 스캐너, 소프트웨어, 생산장비로 구성된다."},{"label":2,"text":"CAD/CAM이란 computer-aided design/computer-aided milling의 약자이다."},{"label":3,"text":"기공실 내 CAD/CAM 중 ceramic system들은 주로 건식 블록을 사용한다."},{"label":4,"text":"변연은 예각이 있게 마무리한다."},{"label":5,"text":"green stage 지르코니아는 no pre-sintered 상태로 가공하며, 지금도 꾸준히 사용하는 블록이다."}],"answer_raw":"1","explanation":"1) 모든 치과용 CAD/CAM 시스템은 다음의 세가지 구성 요소로 이루어진다. 1) 지대치의 외형을 디지털 데이터로 전환할 수 있는 스캐너 장비 2) 제작 공정을 위해 데이터를 조작할 수 있는 소프트웨어 3) 완성된 데이터에 따라 가공할 수 있는 생산 장비. 치과보존학 4판 p.432\n2) computer-aided design/computer-aided manufacturing 치과보존학 4판 p.432\n3) 치과보존학 4판 p.441,445\n=> Green stage processing은 liquid cooling 없이 사용하는데, 더 이상 사용하지 않는 블락이라, 틀린 보기라고 생각됩니다!\n4) 변연을 제외한 치아의 모든 외형과 각각의 선각에 있어서 예각이 없이 둥근 형태의 마무리를 함으로써 CAM의 가공 한계를 보완하며 수복후의 교합력의 집중으로 인한 파절을 줄일 수 있다. 치과보존학 4판 p.441\n5) Green stage processing – No pre-sintered 상태의 chalk하고 soft한 상태를 liquid cooling없이 carbide metal bur로 가공할 수 있지만 porosity와 25% linear shrinkage로 현재 시장에서는 더 이상 사용되지 않고 있다. 치과보존학 4판 p.445","images":[]},{"id":"q048","number":48,"question":"복합레진 및 세라믹 인레이 접착에 대한 내용 중 옳은 것은?","choices":[{"label":1,"text":"방사선 투과성 레진 시멘트를 사용한다."},{"label":2,"text":"복합레진 인레이와 세라믹 인레이 모두 불산에칭 후 실레인 처리한다."},{"label":3,"text":"알루미나 강화형 세라믹과 지르코니아는 불산에칭이 되지 않는다."},{"label":4,"text":"인레이 및 온레이 레진시멘트는 점도가 높아서, 흐르지 않는 것이 좋다."},{"label":5,"text":"장석형 세라믹은 lithium disilicate 세라믹보다 불산 에칭 시간이 짧다."}],"answer_raw":"3","explanation":".\n(보기 순서는 잘 기억이 안납니다…)\n1) 방사선 불투과성 성질을 가지고 있어서, 방사선 사진을 통하여 남아있는 레진시멘트를 쉽게 발견할 수 있어야 한다. 치과보존학 4판 p.412\n2) 포세린의 경우 불산을 이용하고, 복합레진의 경우 sandblast를 이용한다는 점 이외에는 차이가 없음을 알 수 있다. 치과보존학 4판 p.411\n3) 단, 알루미나 강화형 세라믹 제품(Inceram, ProceraAllCeram) 같은 경우는 불산의 효과가 없어서, 특수한샌드블라스트(Rocatec system)처리 후 실레인과 접합접착을 시행하는 방법이 추천되기도 한다. 지르코니아는 불산에 대한 효과는 없으며, 최근에 특수한 샌드블라스트(Rocatec system)나 MDP 계열의 레진시멘트가 지르코니아의 접착에 도움을 준다고 알려지고 있다. 치과보존학 4판 p.417\n4) 복합레진 또는 세라믹 인레이 용도로는 되도록 점도가 높아서 잘 흐르지 않는 레진시멘트가 사용하기가편하고 일반적인 물리적 성질도 우수하다. 반면에 온레이, 크라운 용도로는 충분히 흐름성이 있어서 수복물이 완전히 장착될 수 있어야 한다. 치과보존학 4판 p.412\n=> 4번 보기가 ‘인레이 및 온레이’여서 틀린 것입니다. ‘인레이’만 있었다면 4번 보기도 맞을 것 같아요.\n5) 불산은 4~10% 이내의 것들이 상품화되어 시판되고 있으며, 불산처리 시간은 불산의 농도와 사용하는 세라믹의 종류에 따라 달라진다. 예를 들면 4~5%의 불산을 이용하는 경우 Empress는 60초, e.max는 20초를 궈장하고 있으며, 장석형의 경우에는 1~5분을 권장되고 있다. 치과보존학 4판 p.417","images":[]},{"id":"q049","number":49,"question":"최신 2019년-OKADA 논문. 그래프. 변화시킨 조건과 변화된 것으로 옳은 것은? (그림에 t peak는 표시되어 있음)","choices":[{"label":1,"text":"pressure, tetragonal phase"},{"label":2,"text":"pressure, monoclinic phase"},{"label":3,"text":"particle size, cubic phase"},{"label":4,"text":"particle size, monoclinic phase"},{"label":5,"text":"particlesize, tetragonal phase"}],"answer_raw":"2","explanation":"","images":["images/2021/q001_img3.png"]},{"id":"q050","number":50,"question":"laminate preparation design 4가지 사진. 순서대로 맞는 것은?\na. partial veneer\nb. window\nc. butt-joint\nd. overlap","choices":[],"answer_raw":"미복원","explanation":"laminate preparation design 4가지 사진의 순서를 맞추는 문제였습니다. 원문에 제시된 항목은 partial veneer, window, butt-joint, overlap입니다.","images":["images/2021/q001_img4.png"],"answer_only":true,"answer_display":"정답 미복원"},{"id":"q051","number":51,"question":"교과서 그림 19-3. 다음 그림은 무엇을 위한 용도인가?\n순면의 삭제량 확인","choices":[],"answer_raw":"미복원","explanation":"교과서 그림 19-3. 순면의 삭제량 확인을 위한 용도입니다.","images":["images/2021/q001_img5.png"],"answer_only":true,"answer_display":"정답 미복원"},{"id":"q052","number":52,"question":"","choices":[],"answer_raw":"4","explanation":"중합율을 높이기 위해 광중합 시간을 길게 조사한다.\n광중합기를 가까이 위치시켜 중합율을 높일 수 있다.\n중합율 증가를 위해 SARC 보다 conventional resin cement를 사용한다.\nSARC에서 sodium aryl sufate 또는 aryl-borate salt를 제거한다.\nacidic monomer와 반응할 수 있는 amine을 제거한다.","images":["images/2021/q001_img6.png"]},{"id":"q053","number":53,"question":"","choices":[],"answer_raw":"2","explanation":"4-META를 포함하는 레진시멘트는 금속과 결합한다.\npolyadenyl acid를 포함하는 GI 시멘트는 광중합이 가능하다.\npolyHEMA 를 포함하는 RMGI 시멘트는 수화팽창을 일으킨다.\nMDP를 포함하는 레진시멘트는 지르코니아와 결합한다.\nBenzoyl peroxide를 포함하는 레진시멘트는 자가중합이 가능하다.","images":[]},{"id":"q054","number":54,"question":"(최신논문) 다음 중 근단부에서 porosity가 가장 적은 조합은?","choices":[{"label":1,"text":"Handmix"},{"label":2,"text":"Handmix/endo file"},{"label":3,"text":"Handmix/centrix"},{"label":4,"text":"Automix/conventional tip"},{"label":5,"text":"Automix/endo tip"}],"answer_raw":"5","explanation":"(보기 순서는 다를수있습니다)P","images":[]},{"id":"q055","number":55,"question":"다음 사진에 대한 것으로 상관 없는 것은?","choices":[{"label":1,"text":"구강내 황화물의 양"},{"label":2,"text":"테트라사이클린 복용량"},{"label":3,"text":"테트라사이클린 복용 기간"},{"label":4,"text":"테트라사이클린 종류"},{"label":5,"text":"테트라사이클린 복용 연령"}],"answer_raw":"1","explanation":"(보기순서 다를수있습니다)","images":["images/2021/q055_img1.jpg"]},{"id":"q056","number":56,"question":"1984년 Vertucci의 Root canal anatomy of the human permanent teeth에 따르면 근관이 치근 시작점에서부터 치근단까지 2개로 이어지는 Type IV 근관이 가장 높은 빈도로 나타나는 상악 치근은 무엇인가?","choices":[{"label":1,"text":"측절치"},{"label":2,"text":"제1소구치"},{"label":3,"text":"제2소구치"},{"label":4,"text":"제1대구치 근심협측"},{"label":5,"text":"제2대구치 근심협측"}],"answer_raw":"2","explanation":"해설 : 문제 양식으로 봤을 때 출처가 클래식인줄 알았는데 Pathways of the pulp입니다\n패스웨이 10판 p.156 / 11판 p.139 vertucci 표\n측절치 0%, 제1소구치 62%, 제2소구치 11%, 제1대구치 근심협측 18%, 제2대구치 근심협측 12%","images":["images/2021/q055_img2.png"]},{"id":"q057","number":57,"question":"1994년 Morfis 등의 Study of the apices of human permanent teeth with the use of a scanning electron microscope에 따르면 치근단공의 크기가 가장 큰 것은?","choices":[{"label":1,"text":"상악 중절치"},{"label":2,"text":"상악 측절치"},{"label":3,"text":"하악 소구치"},{"label":4,"text":"상악 대구치 구개측 치근"},{"label":5,"text":"하악 대구치 원심측 치근"}],"answer_raw":"5","explanation":"해설 : 이것도 Pathways of the pulp네요\n패스웨이 10판 p.160 / 11판 p. 143","images":["images/2021/q055_img3.png"]},{"id":"q058","number":58,"question":"Fan의 2004년 C-shape 근관의 분류에서 근관의 모양이 아래그림과 같이 C형태가 끊기면서 semicolon의 모양과 유사하고, α와 β각 중 하나가 60도보다 큰 경우 어떤 type인가?","choices":[{"label":1,"text":"Type I"},{"label":2,"text":"Type II"},{"label":3,"text":"Type III"},{"label":4,"text":"Type IV"},{"label":5,"text":"Type V"}],"answer_raw":"2","explanation":"(근관치료학 p. 196 Fan’s classification - Category II(C2))","images":["images/2021/q055_img4.png"]},{"id":"q059","number":59,"question":"다음 중 치수의 역할로 옳지 않은 것은?","choices":[{"label":1,"text":"치아발생"},{"label":2,"text":"치아교합"},{"label":3,"text":"감각수용"},{"label":4,"text":"혈류순환"},{"label":5,"text":"조직재생"}],"answer_raw":"2","explanation":"해설 : 근관치료학 p.15\n치수는 기능적으로 ①치수를 둘러싸는 상아질을 형성하는 기능, ②무혈관성인 상아질에 영양을 공급하는 기능, ③상아질에 감각을 부여하는 보호 기능, ④치아가 외상이나 질병에 의해 손상된 것을 보상해주는 재생 기능 등을 가지고 있다.\n①이 치아 발생, ②가 혈류 순환, ③이 감각 수용, ④가 조직 재생에 해당할 것 같습니다.","images":[]},{"id":"q060","number":60,"question":"위 그림에서, 두꺼운 화살표가 표시된 부분에 대한 설명으로 옳은것은?","choices":[{"label":1,"text":"소구치가 감염의 원인이다."},{"label":2,"text":"Buccal space abscess이다."},{"label":3,"text":"안면부 농양은 하악에 국한되므로 기도 폐쇄의 가능성은 없다."},{"label":4,"text":"원인치의 치근단은 악설골근 상방에 있다."},{"label":5,"text":"해당 부위와 함께 submental space, sublingual space가 같이 이환되는 것을 Ludwig angina라고 한다."}],"answer_raw":"5","explanation":"해설 : 패스웨이 10판 p.635 / 11판 p.714\n감염의 근원은 화농성 삼출물이 설측 피질골판을 뚫고 나오는 대구치부\nSubmandibular space abscess에 대한 내용입니다.\nLudwig angina 같이 이러한 생명을 위협하는 봉와직염은 pharyngeal과 cervical space로 퍼질 수 있으며, 기도폐쇄를 초래할 수 있다.\n치근첨들이 악설골근 부착 하부에 위치한다.\n맞는 설명","images":["images/2021/q055_img5.png"]},{"id":"q061","number":61,"question":"원발성 근관 내 감염에 대해 옳지 않은 것은?","choices":[{"label":1,"text":"괴사된 근관의 감염이다"},{"label":2,"text":"감염 세균의 40~55%는 아직까지 배양되지 않는 세균 종이다."},{"label":3,"text":"혐기성 세균이 뚜렷하게 우세한 혼합된 집합으로 특정지어진다."},{"label":4,"text":"질병에 따라 가장 많이 발견되는 세균 종은 잘 수행된 연구에서도 결과가 다르다."},{"label":5,"text":"치근단치주염 크기는 세균 종과 근관 내 세포 수와 비례한다."}],"answer_raw":"4","explanation":"(pathway p.614 가장 많이 발견되는 종들은 가장 잘 수행된 연구에서는 동일하게 나타난다.)","images":[]},{"id":"q062","number":62,"question":"2005 Portenier, The susceptibility of starved, stationary phase, and growing cells of Enterococcus faecalis to endodontic medicaments' 에서 E. faecalis가 가장 강한 항균 면역반응을 보이면서, 10분간 medication 후에도 생존하는 상태는 무엇인가?","choices":[{"label":1,"text":"biofilm phase"},{"label":2,"text":"starvation phase"},{"label":3,"text":"stationary phase"},{"label":4,"text":"planktonic phase"},{"label":5,"text":"exponential phase"}],"answer_raw":"2","explanation":"(C-1-1-3)","images":[]},{"id":"q063","number":63,"question":"2019년 IEJ에 게재된 Ordinola-Zapata 등의 Micro-CT analysis of danger zone thickness in the mesiobuccal roots of maxillary first molars에서, 발거된 상악 제1대구치의 MB root furcation 부분으로부터 2mm, 3mm 위치에서 얻은 내용으로 옳은 것을 고르시오.","choices":[{"label":1,"text":"MB2의 협측설측 근관벽은 MB1보다 얇다."},{"label":2,"text":"MB2의 가장 얇은 부위는 근심설측 근관벽이다."},{"label":3,"text":"Isthmus의 유무에 상관없이, MB2의 danger zone은 MB1보다 얇다."},{"label":4,"text":"MB2의 danger zone의 50%는 0.3mm이하이다."},{"label":5,"text":"Isthmus 있을 경우 MB2의 danger zone이 MB1보다 두껍다."}],"answer_raw":"3","explanation":"해설 : E-19-2-2\n애초에 Mesial, distal만 조사한 논문입니다. 근원심측 근관벽이라면 맞는 지문.\nDanger zone쪽이 더 얇은데 근심이 아니라 원심측입니다. 또한 어느 부위가 제일 얇은지는 조사하지 않았습니다.\n맞는 말입니다.\nMB2의 danger zone의 50%는 1mm 이하입니다.\nIsthmus의 유무와 관계 없이 MB2의 상아질 두께가 얇습니다.","images":[]},{"id":"q064","number":64,"question":"2018년 Patel 등의 (European Society of Endodontology position statement : External cervical resorption) 에 의한 내용으로 옳은 것은?","choices":[{"label":1,"text":"Heithersay의 External cervical resorption(이하 ECR) 분류는 CBCT를 근거로 한 3차원적인 ECR의 분류이다."},{"label":2,"text":"ECR에 대한 치료와 예후는 흡수 정도, 양상, 접근도에 따라 결정된다."},{"label":3,"text":"Patel에 의한 ECR 분류는, ECT의 Height, Circumferential spread, Proximity to the apical foramen 이 세 가지에 따라 분류하였다."},{"label":4,"text":"ECR은 치주조직보다 치수조직에 퍼지는 양상을 보인다."},{"label":5,"text":"ECR에서 CBCT 촬영 시 얻는 정보가 별로 없어, CBCT 촬영은 지양해야 한다."}],"answer_raw":"2","explanation":"해설 : E-18-4-3\nHeithersay 분류는 2차원 image에 기반한 것\n정답\nPatel의 분류는 Height, Circumferential spread, Proximity to the root canal로 apical foramen이 틀린 내용입니다.\n정확히 언급하고 있는 내용은 없는데 치수로 퍼지는 건 PRRS에 의해 제한되기 때문에 틀린 것 같습니다.\nCBCT는 진단이 불확실하거나 ECR의 치료계획을 수립할 때 있어 촬영하는게 권장됩니다.","images":[]},{"id":"q065","number":65,"question":"현미경에서 동일한 평면을 관찰할 때 술자용 스코프와 카메라에서의 초점을 일치시키는 과정을 무슨 과정이라고 하는가?","choices":[{"label":1,"text":"Interpupillary distance adjustment"},{"label":2,"text":"Parfocal adjustment"},{"label":3,"text":"Eyepiece adjustment"},{"label":4,"text":"Binocular adjustment"},{"label":5,"text":"Objective lens adjustment"}],"answer_raw":"2","explanation":"(근관치료학 p.259)","images":[]},{"id":"q066","number":66,"question":"1997년 IEJ에 실린 Fava와 Dummer의 Periapical radiographic techniques during endodontic diagnosis and treatment에 따르면 방사선 촬영에서 다음 중 속성이 다른 것은?","choices":[{"label":1,"text":"치근단 협설만곡 구분 위해 각도 달리하여 촬영"},{"label":2,"text":"상악 대구치 촬영시 필름에 cotton 넣고 촬영"},{"label":3,"text":"상악전치 수평치근파절 확인 위해 각도 달리하여 촬영"},{"label":4,"text":"하악 대구치 근단 하치조 신경과 근접도 파악 위해 각도 달리하여 촬영"},{"label":5,"text":"하악 소구치 하악 신경관 입구 수직관계 구분"}],"answer_raw":"1","explanation":"해설 : C-1-3-1 Fava&Dummer, Periapical radiographic techniques during endodontic diagnosis and treatment\nAlteration in vertical angulation : 2,3,4,5번 보기\n2,4번은 해당 항목에 딱 나와있지만, 3,5번은 유추해야 할 듯 합니다.\n2 : zygomatic process의 영향을 줄이기 위해 수직각을 변화 시키는 것\n3 : 각도 변화시켜 촬영하는 것의 예시로는 나와있는데 수직각 변화인지에 대해서는\n유추해야 하는 것 같습니다.\n4 : 정상 구조물과 치근단 병소의 구별\n5 : 역시 유추해야 할 듯 합니다.\nAlteration in horizontal angulation : 1번 보기\n수평각 변화 : 1번 보기 / 수직각 변화 : 2,3,4,5번 보기로 생각하시면 될 듯 합니다.","images":[]},{"id":"q067","number":67,"question":"1988년 J Endod에 실린 Torabinejad의 Factors associated with endodontic interappointment emergencies of teeth with necrotic pulp에 따르면 옳지 않은 것을 고르시오.","choices":[{"label":1,"text":"재근관치료시 interappointment emergency의 발생이 유의미하게 높다."},{"label":2,"text":"Sinus tract이 있는 경우 interappointment emergency의 발생이 유의미하게 낮다."},{"label":3,"text":"Factor를 host, operating factor로 나눠서 분석했다."},{"label":4,"text":"술전 pain, swelling 둘 다 있을 경우 interappointment emergency가 유의미하게 발생 높다."},{"label":5,"text":"치근단병소 크기 10mm*10mm 이상이면 유의미하게 interappointment emergency 발생율 높다."}],"answer_raw":"5","explanation":"해설 : C-2-1-2 클래식 요약본 내용\n표6 재근관치료한 환자의 IAE 발생율이 현저히 높았다.\n표5 sinus tract의 존재는 IAE의 빈도를 현저히 줄임.\n숙주 요인(Host factor) / 술적 요소(Operating factor)로 분석하고 있습니다.\n그림 3. 술전 종창+동통 호소하면 IAE 발생율 높습니다.\n그림 4. 방사선 투과상의 크기와 IAE의 빈도 사이에는 역의 관계가 관찰","images":[]},{"id":"q068","number":68,"question":"다음 그림에서 관찰되는 치근 파절 치유 양상은?","choices":[{"label":1,"text":"Healing with calcified tissue"},{"label":2,"text":"Healing with interproximal connective tissue"},{"label":3,"text":"Healing with interproximal bone and connective tissue"},{"label":4,"text":"Healing with interproximal inflammatory tissue without healing"},{"label":5,"text":"No healing"}],"answer_raw":"3","explanation":"(사진 출처 : 최신 19-4-1 - diagnosis and management of transverse root fractures)","images":["images/2021/q055_img6.png"]},{"id":"q069","number":69,"question":"다음 중 치근파절의 예후에 대한 설명으로 틀린 것은?","choices":[{"label":1,"text":"근첨 형성 되지 않은 치아의 예후는 좋다"},{"label":2,"text":"2~4주간의 semirigid splinting은 예후를 좋게 한다."},{"label":3,"text":"파절편을 최대한 빨리, 근접시키면 예후가 좋다."},{"label":4,"text":"동요도가 있거나 변위가 있는 경우 예후가 좋지 않다."},{"label":5,"text":"치조정에서 파절되어도 잘 고정만 되면 예후 좋다."}],"answer_raw":"5","explanation":"해설 : [pathway of pulp - chapter 20]\n5번 : if the fracture occurs at the level of or coronal to the crest of the alveolar bone, the prognosis is extremely poor.\n나머지 보기들 :\nfollowing factors influence repair :\nthe degree of dislocation and mobility of the coronal fragment are extremly important in determining outcome. Increased dislocation and coronal fragment mobility result in a poorer prognosis.\nImmature teeth are seldom involved in root fractures, the prognosis is good.\nThe prognosis improves with quick treatment, close reduction of the root segments, and semirigid splinting for 2 to 4 weeks.","images":[]},{"id":"q070","number":70,"question":"다음 2020년 ‘ Survival of Replanted Permanent Teeth after traumatic Avulsion’ 저널에 대한 내용으로 옳지 않은 것은?","choices":[{"label":1,"text":"성별은 예후에 유의하게 영향을 주는 요인이다."},{"label":2,"text":"재식 후 발치된 치아의 발치 원인으로는 외흡수, 치근파절 등이 있다."},{"label":3,"text":"발치된 치아는 대부분 치수생활력을 상실한 치아들이었다."},{"label":4,"text":"storage medium은 예후에 유의하게 영향을 주는 요인이다."},{"label":5,"text":"환자의 연령, root development stage는 예후와 밀접한 연관이 있다."}],"answer_raw":"1","explanation":"해설 : [최신 20-1-2]\n1 번 : The univariate analysis showed that gender, prescription of SAT, tooth group, concomitant crown fractures in the avulsed tooth, length of extraalveolar period, timing of pulpectomy, obturation, and splinting were not significant.","images":[]},{"id":"q071","number":71,"question":"다음은 외상받은 후 치아의 치수생활력 검사에 대한 설명이다. 옳은 것은?\nEPT 는 혈류를 측정하는 장치이다.\n외상 후에는 전기치수검사는 부정확하므로 시행할 필요가 없다.\n전기치수검사를 2번 시행하여 모두 음성이 나오면 회복하지 못할 것으로 간주한다.\n외상 직후 전기치수검사시 양성이면 이후에 생활력은 괜찮을 것으로 사료된다.","choices":[{"label":1,"text":"외상 직후에는 음성이었으나 추후 재검사 시 양성이면 치수생활력은 회복된 것으로 간주한다."},{"label":2,"text":"[Pathway of pulp p.668] 5"},{"label":3,"text":"사실상 생활력 검사는 신경기능을 검사하는 것으로 치수 내 혈류 공급의 유무를 판단하지는 못한다."},{"label":4,"text":"계속해서 음성반응을 보이는 경우에는 치수가 비가역적인 손상을 받았음을 의미하나 반드시 그렇지는 않다."},{"label":5,"text":"처음 검사에서 양성반응을 보였던 치아가 건강하다고 추측할 수 없으며 시간이 경과된 후에도 계속해서 양성반응을 보인다고 추측할 수는 없다."}],"answer_raw":"","explanation":"","images":[]},{"id":"q072","number":72,"question":"다음 중 옳은 것을 고르시오.\n해부학적 치근첨과 근단공의 위치는 동일하다.\n나이가 들수록 근첨과 근단공의 거리는 짧아진다.\n치근흡수는 치근의 형태에 영향을 미치나 치근협착부에는 영향을 끼치지 않는다.\n치근협착부와과 주근단공의 위치는 평균적으로 1mm이다.\n치근협착부는 약 46%에서만 정상적이며 나머지는 경사진 협착부, 여러개의 협착부가 존재한다.","choices":[{"label":1,"text":"[Pathway of pulp p.159, 최신근관치료학 p.322] 5"},{"label":2,"text":"동일하지 않음."},{"label":3,"text":"나이가 들수록 백악질 침착 때문에 더 커진다."},{"label":4,"text":"치근 흡수는 흔히 치수 괴사, 근단부 골 흡수와 동반발생하여 협착부의 소실을 초래할 수 있다."},{"label":5,"text":"CDJ와 주근단공간의 거리가 약 1mm"}],"answer_raw":"","explanation":"","images":[]},{"id":"q073","number":73,"question":"다음은 파절된 NiTi file 의 단면이다 옳은 것은?\n[fibrous dimples, abrasive marks 등이 관찰된다\n최신 근관치료학 파일 파절 그림 우측 -]","choices":[{"label":1,"text":"Cylic fracture"},{"label":2,"text":"Torsional fracture"},{"label":3,"text":"Fatigue fracture"},{"label":4,"text":"Plastic deformation"},{"label":5,"text":"Crack propagation"}],"answer_raw":"2","explanation":"Torsional fracture -최신근치 330page","images":["images/2021/q055_img7.jpg"]},{"id":"q074","number":74,"question":"석회화된 근관 입구를 찾는데 도움이 되는 재료 혹은 기계로 옳지 않은 것은 ?","choices":[{"label":1,"text":"Ultrasonic tip"},{"label":2,"text":"Sharp explorer"},{"label":3,"text":"Methlyene blue dye"},{"label":4,"text":"Sodium hypochloride"},{"label":5,"text":"Champagne"}],"answer_raw":"5","explanation":"샴페인…","images":[]},{"id":"q075","number":75,"question":"다음 중 소독기구에 대한 설명으로 옳은 것을 고르시오.","choices":[{"label":1,"text":"고온증기법은 옷이나 면을 손상시킨다."},{"label":2,"text":"거타퍼챠의 경우 70% 에틸알콜용액에 1분간 담가 소독하면 가장 효율적이다."},{"label":3,"text":"Ethylene oxide 멸균법의 소독시간은 고온증기법보다 적다."},{"label":4,"text":"Glutaraldehyde 화학증기법은 spore를 제외한 모든 미생물을 박멸한다."},{"label":5,"text":"열전달법은 버와 같은 기구들을 소독할 때 쓰이며 일상에서 쉽게 사용가능하다."}],"answer_raw":"","explanation":"답이 없는 것 같습니다.(교수님은 4번 의도하신 것 같으나 역시 틀린 내용입니다.)\n해설 : 근관치료학 p.249-252, 패스웨이 10판 p.138-141 / 11판 기준으로는 내용이 많이 축소되었고 그마저도 온라인판(p.182)에 있어서 본 문제 풀 수 없습니다.\n고압증기멸균 장점 3번에 면이나 의류의 손상이 없다고 나와있네요.\n거타퍼챠의 멸균은 5.25% NaOCl 용액에 1분 담가두는 것으로 되어있습니다.\nEthylene oxide는 12시간 정도, 고압증기멸균은 15~40분 진행합니다.\n패스웨이 10판 p141 표 6-1 기준 Glutaraldehyde 방법이 spore를 제외한 모든 미생물을 박멸하는 high level disinfectant의 예로 들어가 있으나 표 밑에 보시면 High-level disinfectants are used as room-temperature sterilizing solutions with extended contact times.라고 써있고, 이 내용의 reference인 CDC guideline 들어가보면 10시간 담글시 sterilization, 12-30분 담글시 high-level disinfectant로 사용된다고 나와있습니다.그리고 11판 패스웨이에는 해당 내용 없습니다.\n열전달법은 bur와 같이 작은 기구나 file, paper point 등 근관치료 기구를 짧은 시간 내에 간단히 멸균시키는데 사용되나, 일상의 멸균법으로 사용하기에는 부적당하다.","images":[]},{"id":"q076","number":76,"question":"다음의 근관내 기구의 명칭은?","choices":[{"label":1,"text":"K-file"},{"label":2,"text":"H-file"},{"label":3,"text":"Apexum"},{"label":4,"text":"Brassler removal tip"},{"label":5,"text":"Wire and loop"}],"answer_raw":"3","explanation":"해설 : 패스웨이 10판 p.257-8 / 11판에서는 삭제된 내용입니다.\n(요거 이의제기 해주세요 ㅠㅠ 11판으로 공부했는데…)","images":["images/2021/q055_img8.png"]},{"id":"q077","number":77,"question":"근관성형 방법 중 모든 크기의 파일이 근관장까지 들어가는 방법으로 만곡근관에 사용할 시 근관부위가 넓어져 통상적으로 사용하지 않는 방법은?","choices":[{"label":1,"text":"Standardized technique"},{"label":2,"text":"Step-down"},{"label":3,"text":"Crown-down"},{"label":4,"text":"Step-back"},{"label":5,"text":"Balanced force technique"}],"answer_raw":"1","explanation":"(근관치료학 p.311)","images":[]},{"id":"q078","number":78,"question":"다음 중 올바른 것은?\n2.Reaming은 근관내에 끼일때까지 진입한 후 파일을 당겨서 제거하는 것을 의미한다\n4. K file은 시계방향으로 회전하는 것이 시계 반대 방향으로 회전하는 것보다 파일 파절 가능성이 더 높다","choices":[{"label":1,"text":"Smooth broach를 근관 개방성과 근관내 상태를 확인하기 위해 사용한다"},{"label":2,"text":"Reaming은 근관내에 끼일때까지 진입한 후 파일을 당겨서 제거하는 것을 의미한다"},{"label":3,"text":"Barbed broach는 날카로운 가시가 있어 근관을 어느정도 삭제 할 수 있다"},{"label":4,"text":"K file은 시계방향으로 회전하는 것이 시계 반대 방향으로 회전하는 것보다 파일 파절 가능성이 더 높다"},{"label":5,"text":"Filing은 근관에 끼일때까지 진행 후 한 바퀴 이상 회전 후 당겨서 제거하는 것을 의미한다"}],"answer_raw":"1","explanation":"근치 p.221\nReaming은 기구를 근관에서 약간 끼는 느낌이 들 때 까지 넣은 다음 손잡이를 한 바퀴 이상 돌리는 것이다. (근치 p.227)\nBarbed broach는 상아질을 삭제하거나 정밀하게 형성하지 않는다 (Pathway 10판 p.246)\n반시계 방향으로 회전시키면 시계 방향으로 회전시킨 경우보다 파절이 더 잘 일어나므로 주의해야 한다 (근치 p.227)\nFiling은 기구를 근관에서 약간 끼는 느낌 이 들 때까지 넣은 다음 손잡이를 약간 회전시키거나 또는 전혀 회전시커지 않고 근관 벽에 대고 삭제한 후 기구를 제거하는 것이다 (근치 p.227)","images":[]},{"id":"q079","number":79,"question":"가장 빠른 속도로 사용 하는 Niti file은?\n2.Race\n4.Waveone","choices":[{"label":1,"text":"Flexmaster"},{"label":2,"text":"Race"},{"label":3,"text":"Protaper Next"},{"label":4,"text":"Waveone"},{"label":5,"text":"Lightspeed"}],"answer_raw":"5","explanation":"추천되는 작업 스피드는 LS1은 1,500~2,000rpm이고, LSX는 2,500rpm이다. (Pathway 10판 p.318)","images":[]},{"id":"q080","number":80,"question":"다음 기구와 함께 쓰는 기구는?\n2.reciproc\n4.safety irrigation","choices":[{"label":1,"text":"apexum"},{"label":2,"text":"reciproc"},{"label":3,"text":"endo activator"},{"label":4,"text":"safety irrigation"},{"label":5,"text":"SAF"}],"answer_raw":"5","explanation":"고형석\n오전 12:00 1월 8일\n제 기억엔 2번 보기가 '함께 사용하면' 보다는 '번갈아' 또는 '교대로' 사용하면 이었던 것 같습니다. 그래서","images":["images/2021/q005_img19.jpg"]},{"id":"q081","number":81,"question":"Naocl에 대한 설명중 옳지 않은것은?\n2. Naocl은 EDTA와 함께 사용하면 화학적작용으로 시너지효과유발하여 항세균효과 가진다\n4.세균과 biofilm에 대해 항세균효과 가지며 특히 actinomyces,candida에도 효과가 있다","choices":[{"label":1,"text":"NaOCl은 상아질과 도말층을 제거하지 못한다"},{"label":2,"text":"NaOCl은 EDTA와 함께 사용하면 화학적작용으로 시너지효과 유발하여 항세균효과 가진다"},{"label":3,"text":"초음파로 세척할 경우 주근관에서 NaOCl의 온도가 상승하여 소독작용을 가진다"},{"label":4,"text":"세균과 biofilm에 대해 항세균효과 가지며 특히 actinomyces,candida에도 효과가 있다"},{"label":5,"text":"낮은 농도에서는 괴사조직을 용해하며 고농도에서는 괴사조직과 생활조직을 용해시킨다"}],"answer_raw":"1","explanation":"(2번도 답이 될 수 있다고 생각합니다. 복수정답?)\npathway p.334에 ‘“NaOCl은 상아질과 도말층을 거의 제거하지 못한다” (->거의 제거하지 못한다는 뜻은 조금은 제거한다는 의미가 들어있을까요? 그래서 1번 지문도 애매한 것 같습니다.)\npathway p.337에 “화학적 분석에서 NaOCl의 효과를 나타내는 성분인 염소가 EDTA에 의해 비활성화 된다고 밝혀졌다”\npathway p.270 \"NaOCl과 EDTA를 교대로 사용하는 세정방법은 NaOCl을 단독으로 사용하는 방법보다 근관내 미생물수를 감소시키는데 더 효과적일 수 있다\"\npathway p.270 <EDTA와 NaOCl의 상호작용>에서 “EDTA는 NaOCl의 조직용해능을 잃어버리게 한다. … 임상적으로 EDTA와 NaOCl은 반드시 개별적으로 사용되는 것이 제안된다.” 라는 내용이 있습니다. 따라서 2번 답지에서 “함께 사용”이라는 말이 잘못된 내용일 수도 있다고 생각합니다. “개별적으로 사용”이라고 고쳐야 완전히 맞는 문장이 될 것 같습니다.\n####81번 문제\n보기1번 '거의 제거하지 못한다(본문일치)'\n보기2번 '번갈아 사용하면'이었습니다.","images":[]},{"id":"q082","number":82,"question":"근관치료중 갑작스런 동통 부종 나타내는 것은?","choices":[],"answer_raw":"Flare-up","explanation":"Flare-up","images":[],"answer_only":true,"answer_display":"Flare-up"},{"id":"q083","number":83,"question":"(이 사진과는 약간 달랐으나 상악 우측 중절치 근관중간에 내흡수 사진)\n상악 우측 중절치에 다음과 같은 소견이 관찰되는 경우에 적절한 근관충전 방법은?","choices":[],"answer_raw":"Thermoplastic technique","explanation":"사진은 원문과 약간 달랐으나, 상악 우측 중절치 근관 중간의 내흡수에 적절한 근관충전 방법은 Thermoplastic technique입니다.","images":["images/2021/q083_img1.png"],"answer_only":true,"answer_display":"Thermoplastic technique"},{"id":"q084","number":84,"question":"AH26 vd AH plus 설명 중 틀린것?","choices":[{"label":1,"text":"AH 26의 경화시간은 4시간이다."},{"label":2,"text":"AH 26과 AH plus의 밀폐능력은 비슷하다."},{"label":3,"text":"(평이한지문)"},{"label":4,"text":"AH26에서는 포름알데히드가 유리되지않는다."},{"label":5,"text":"AH plus는 epoxy bis phenol계열로 두개 튜브내의 재료를 혼합해서 사용한다."}],"answer_raw":"4","explanation":"","images":[]},{"id":"q085","number":85,"question":"thermafil에 대한 설명으로 옳지않은것","choices":[{"label":1,"text":"1-beta phase GP로 코팅되어있다"},{"label":2,"text":"2- 도말층제거하는 것은 sealing능력을 향상시킨다"},{"label":3,"text":"3- 빠른삽입속도가 충전을 향상시킨다"},{"label":4,"text":"4- 거타퍼차가 캐리어에서 벗겨져 근관의 치근단부위에 충전재료로 캐리어만 남아있을수 있다"},{"label":5,"text":"5- ..평이했던지문.."}],"answer_raw":"1","explanation":"","images":[]},{"id":"q086","number":86,"question":"옳은것?","choices":[{"label":1,"text":"1-Halothane은 클로로포름보다 효과가 낮다"},{"label":2,"text":"2- 클로르포름은 발암유발해 금지됬다"},{"label":3,"text":"3- Xylene은 가열시 클로르포름과 비슷하다"},{"label":4,"text":"4- 재근관치료시 gp제거잘되지않아도 전기근관장측정기 측정이 잘된다"},{"label":5,"text":"5- 300-1500rpm으로 gp제거시 나이타이파절유발을잘시킨다."}],"answer_raw":"3","explanation":"","images":[]},{"id":"q087","number":87,"question":"Tawil의 2018년 논문 Periapical Microsurgery: Do Root Canal–retreated Teeth Have More Dentinal Defects?에 대한 설명으로 맞는 것은?\n⑤ 재치료에서 1차 치료보다 dentinal defect가 더 많았다.","choices":[{"label":1,"text":"치근단 재수술의 경우 dentinal defect가 더 많았다."},{"label":2,"text":"재치료에서 1차 치료보다 dentinal defect가 더 많았다."}],"answer_raw":"5","explanation":"문제, 답 문장 정확하지 않습니다. 보기는 ③,⑤번같은 내용 반복이었습니다.\n최신 2018-4분기 근관 논문이었고, ③번은 이 논문이 primary periapical surgery 치아 대상으로 하고 있어 틀리고 ⑤번은 abstract의 “The proportion of retreated teeth with dentinal defects compared with primary treatment was statistically significant (P < .001) with a higher proportion of retreated teeth having dentinal defects.” 과 위의 그래프 보고 유추할 수 있었습니다.","images":["images/2021/q083_img2.png"]},{"id":"q088","number":88,"question":"MTA 이용 치근 수리에 대해 옳은 것은?","choices":[{"label":1,"text":"MTA는 생체적합성이 낮다."},{"label":2,"text":"치근 천공 시 즉시 수리해 주는 것이 좋다."},{"label":3,"text":"치근 천공이 치근단에 가까울수록 예후가 나쁘다."},{"label":4,"text":"치근 천공 수리에 제일 좋은 것은 IRM 이다."},{"label":5,"text":"치조정 가까운 치근 천공시 (천천히 경화되는 재료/Ca(OH)2 둘 중 하나)가 좋다."}],"answer_raw":"2","explanation":"문제, 답 문장 정확하지 않습니다.\n① 생체적합성 좋음.\n② Pathway 10판 한글판 1009p. 처치를 지연시키는 것보다 즉시 처치하는 것이 좋은데~~\n③ Pathway 10판 한글판 1009p. 천공 부위가 치근단에 가까울수록 예후는 좋다.\n④ Pathway 10판 한글판 1009p. MTA는 천공의 처치 시에 사용될 경우 다른 수복 물질에 비해 많은 이점이 있다.\n⑤ 문장이 잘 기억이 안 납니다... 어쨌든 괄호 안의 두 내용 모두 틀린 내용.","images":[]},{"id":"q089","number":89,"question":"(C-5-1-2) Treatment Outcome in Endodontics: The Toronto Study—Phase 4: Initial Treatment 다음 중 틀린 것은?","choices":[{"label":1,"text":"술전 치근단 병소가 없을 때 치유율은 75%이다."},{"label":2,"text":"치근의 수가 치유율에 영향을 미친다."},{"label":3,"text":"술전 치근단 병소가 치유율에 영향을 미친다."},{"label":4,"text":"술전 치근단 병소가 있을 때, 충전 방법이 치유율에 영향을 미친다."},{"label":5,"text":"술전 치근단 병소가 있을 때, 술식 중 합병증 유무가 치유율에 영향을 미친다."}],"answer_raw":"1","explanation":"","images":[]  세라믹\n--- 1번 보기도 복수정답 되지 않나요 pop 10판 854쪽에 비접착성 금속포스트는 근관 길이의 ⅔ 이라는 내용 있어요\nPop10판 854쪽 중간에 보면 포스트는 치관부 누출이 생긴 경우에 세균오염으로 부터 근단부 밀봉을 보호함으로써 생물학적 기계적 기능 모두를 수행한다 라는 문장이 있어요.5번은 답이 아닌것 같아요","images":[]},{"id":"q100","number":100,"question":"1989년 Moeller의 “Sensory changes in the elderly”에 따른 내용 중 옳은 것은?","choices":[{"label":1,"text":"노화가 진행될 수록 동공은 확장된다."},{"label":2,"text":"미각의 변화는 40대부터 발생한다."},{"label":3,"text":"나이가 들수록 안구의 불투명성이 증가한다."},{"label":4,"text":"나이가 들수록 높은톤으로 이야기해야 잘 들린다."},{"label":5,"text":"나이가 들수록 차가운 색 계열이 따뜻한 색 계열보다 잘 보인다."}],"answer_raw":"3","explanation":"(C-7-1-1)","images":[]}]},"2022":{"year":2022,"title":"2022 치과보존과 전문의시험 1차","questions":[{"id":"q001","number":1,"question":"다음은 스테판 커브이다. 법랑질이 탈회되는 pH는?","choices":[{"label":1,"text":"4.0"},{"label":2,"text":"4.5"},{"label":3,"text":"5.0"},{"label":4,"text":"5.5"},{"label":5,"text":"6.0"}],"answer_raw":"4","explanation":"(치과보존학 4판 p.29)\n치면 세균막의 pH가 법랑질을 용해시킬 수 있는 산도인 5.5 정도로 떨어지면 수산화인회석을 탈\n회시키는 환경을 제공하게 된다.","images":["images/2022/q001_img1.png"],"source_page":1},{"id":"q002","number":2,"question":"다음 그림에 따라 치면세균막\n기전은?","choices":[{"label":1,"text":"Lysosome system"},{"label":2,"text":"Lactoferrin system"},{"label":3,"text":"Lactoglycose system"},{"label":4,"text":"Phosphate system"},{"label":5,"text":"Carbonate/bicarbonate"}],"answer_raw":"5","explanation":"(치과보존학 4판 p31)\n타액에 의한 완충작용 중 가장\n을 중화시키는 작용을 한다.\n막에서 생성된 산을 중화시키는데 중요한 역할을\ne system\n중요한 것은 탄산/중탄산염 기전으로 치면 세\n을 하는 타액의 완충\n세균막에서 생성된 산","images":[]},{"id":"q003","number":3,"question":"법랑질 우식 조직학적 구조 A, B에 들어갈 단어 고르시오.","choices":[{"label":1,"text":"dark zone / body zone"},{"label":2,"text":"body zone / dark zone"},{"label":3,"text":"contaminated zone / dark zone"},{"label":4,"text":"contaminated zone / demineralized zone"},{"label":5,"text":"contaminated zone / necrotic zone"}],"answer_raw":"2","explanation":"답 2 (Art&Science, 2014년(영문판), 59p)\nBody zone, Dark zone이 A, B로 빈칸되어 있었습니다.","images":["images/2022/q003_img1.jpeg"],"source_page":3,"answer_only":false},{"id":"q004","number":4,"question":"치수내 가장 많은 세포는?","choices":[{"label":1,"text":"조상아세포"},{"label":2,"text":"조섬유세포"},{"label":3,"text":"대식세포"},{"label":4,"text":"형질세포"},{"label":5,"text":"미분화간엽세포"}],"answer_raw":"2","explanation":"(최신 근관치료학 p.17)\n조섬유세포는 치수에서 가장 많은 세포이다.","images":[]},{"id":"q005","number":5,"question":"다음 그림의 A, B, C에 들어갈 말은?","choices":[{"label":1,"text":"A: Acidogenic\nB: Dynamic stability\nC: Aciduric"},{"label":2,"text":"A: Dynamic stability\nB: Aciduric\nC: Acidogenic"},{"label":3,"text":"A: Aciduric\nB: Dynamic stability\nC: Acidogenic"},{"label":4,"text":"A: Dynamic stability\nB: Acidogenic\nC: Aciduric"},{"label":5,"text":"A: Acidogenic\nB: Mild acidic\nC: Acidurc"}],"answer_raw":"4","explanation":"(Art and science 7th기준, p.42)\n보기 조합은 정확하지 않음. Dynamic-Acidogenic-Aciduric","images":["images/2022/q005_img1.jpeg"],"source_page":5},{"id":"q006","number":6,"question":"다음 중 급성 치근단 치주염에 대한 설명으로 옳지 않은 것은?","choices":[{"label":1,"text":"급성 치근단 치주염은 치수생활력이 있을 때에도 발생할 수 있다."},{"label":2,"text":"치근단 부위의 염증세포 침윤은 피골세포의 수를 증가시키며, 전체 치수괴사가 일어나기\n전에 골의 파괴가 현저하게 일어날 수 있다."},{"label":3,"text":"치근단 치주염은 근관 감염으로 인한 완전한 치수괴사 이후 치근단 조직으로 확장된다."},{"label":4,"text":"급성 치근단 치주염 병소에서 일반적으로 세균은 존재하지 않는다."},{"label":5,"text":"급성 치근단 치주염의 특징은 전형적인 급성 염증반응과 유사하며, 혈관확장, 증가된 혈\n관 투과성, 혈관에서 혈관 주위 조직으로의 백혈구의 이주로 이루어진다"}],"answer_raw":"3","explanation":"(Pathways of the pulp 10th 기준, p. 573)","images":[]},{"id":"q007","number":7,"question":"다음중 치수내 신경에 대한 설명으로 옳은 것은?","choices":[{"label":1,"text":"1차 구심신경섬유는 A beta, C fiber이다."},{"label":2,"text":"치수에서 가장 많은 신경 섬유는 C fiber이다."},{"label":3,"text":"약한 접촉에 반응하며 빠르게 전달하는 유수 신경은 A delta이다."},{"label":4,"text":"A delta는 무수신경으로 느린 반응을 보인다."},{"label":5,"text":"C fiber는 예통을 나타내며 유수 신경이다."}],"answer_raw":"2","explanation":"(Pathway of the pulp 10th 한글판 54, 55p.)\n1번 1차 구심신경섬유는 A beta, A delta, C 섬유이다.\n2번 정답\n3번 A beta에 대한 설명임.\n4번 보기가 부정확하나 비교적 명확하게 틀린 지문이었습니다.\n5번 A delta에 대한 설명임.","images":[]},{"id":"q008","number":8,"question":"Heyeraas, 1994, Effect of electrical tooth stimulation on blood flow, interstitial fluid pressure and\nsubstance P and CGRF-immunoreactive nerve fibers in the low compliant cat dental pulp에 대한\n설명으로 옳지 않은 것은?","choices":[{"label":1,"text":"CGRP, Substance P가 유리되어 Vasodilation이 일어난다."},{"label":2,"text":"Vasodilation이 일어나면 IFP는 즉각적으로 증가한다."},{"label":3,"text":"Vasodilation이 일어나면 치수 주위 혈관이 압착된다."},{"label":4,"text":"Vasodilation이 일어나면 IFP의 증가 이후 감소가 일어난다."},{"label":5,"text":"Vasodilation이 일어날 때 치수에는 Fluid를 조절하는 기전이 있다."}],"answer_raw":"3","explanation":"(필독 A 2-2-3, Pathway of the pulp 10th 한글판 519)\n논문 원본 가장 마지막 To summarize로 시작하는단락\nAccordingly, transmural pressure is only transitorily reduced and compression of vessels does not\ntake place.","images":[]},{"id":"q009","number":9,"question":"치주인대 내 마취에 대한 설명으로 옳은 것은?","choices":[{"label":1,"text":"압력 아니라 골 내 자입이다."},{"label":2,"text":"발현은 10분 뒤 시작한다."},{"label":3,"text":"30분뒤에도 계속 지속된다."},{"label":4,"text":"굵은 굵기 바늘 마취효과 증진시킨다."},{"label":5,"text":"자입 후 통증은 용액 주입 시 압력 때문에 술 후 교합이 달라져서이다."}],"answer_raw":"1","explanation":"(pathway of pulp 근관치료학에서의 국소마취 치주인대 내 마취 p.707)\n1.맞음 2.3 x 발현 즉각 효과도 20분정도 4.x 굵기 상관없다\n5. 압력이 아니고 바늘 삽입으로 인한 손상으로 40%는 교합이 높아진다고 느껴질 수 있다.","images":[]},{"id":"q010","number":10,"question":"1978 Linde 논문 관련 치주질환으로 인한 치수염 설명으로 옳은 것은?","choices":[{"label":1,"text":"염증반응 및 변화가 관찰 안된다."},{"label":2,"text":"2차 상아질 관찰 안된다."},{"label":3,"text":"이개부에서 치주염 심한 경우 극심한 치수 염증 발견된다.."},{"label":4,"text":"노출 치근에서 미약하게 치수염 반응이 존재한다."},{"label":5,"text":"치근에서의 치수염이 심한 이유는 치수에서의 상아세관이 치근보다 더 좁기 때문이다."}],"answer_raw":"4","explanation":"(pathway of pulp 근관과 치주 상호관계 치주조직 염증 치수 영향 p.653), linde 1978\n전체적으로 이해는\n- 치주 치수 병적반응 일으키지않는다.\n- 염증변화는 극심하게 관찰되지 않고 mild로 관찰 (3차상아질 등)\n- 치근쪽에서 염증이 더 심한 이유는 바깥쪽에서 상아세관이 더 좁고 간격이 넓어서 안쪽으로 들\n어가기가 어렵기 때문(치수에서 넓고 밀도도 크다), 들어가면 염증 반응 생길 수 있음","images":[]},{"id":"q011","number":11,"question":"다음 그림이 나타내는 병소의 명칭은?","choices":[{"label":1,"text":"cracked tooth"},{"label":2,"text":"attrition"},{"label":3,"text":"vertical root fracture"},{"label":4,"text":"abrasion"},{"label":5,"text":"abfraction"}],"answer_raw":"5","explanation":"abfraction (치과 보존학 390p)","images":["images/2022/q011_img1.jpeg"],"source_page":11},{"id":"q012","number":12,"question":"A-E에 연결된 명칭이 옳지 않은 것은?","choices":[{"label":1,"text":"A : 탄성계수"},{"label":2,"text":"B : 탄성한도(비례한도)"},{"label":3,"text":"C : 최대강도(파절강도)"},{"label":4,"text":"D : 응력이완(stress relaxation)"},{"label":5,"text":"E : 탄성에너지율(Resilience)"}],"answer_raw":"4","explanation":"인성(Toughness)\n치과보존학 83p","images":["images/2022/q012_img1.png"],"source_page":12},{"id":"q013","number":13,"question":"2020. Mohammad 등의 Extra Bonding Layer Compensates Universal Adhesive’s Thin Film Thickness에 대한 다음 보기의 내용 중 옳지 않은 것은?","choices":[{"label":1,"text":"Extra bonding layer를 사용할 경우 술식이 한 단계 증가하지만 접착력이 유의하게 증가하는 결과를 보였다."},{"label":2,"text":"1개월 후 C-SE2_ar보다 Opti-FL_ar이 더 우수한 결과를 나타내었다."},{"label":3,"text":"50,000 cycle 후 C-SE2_ar보다 Opti-FL_ar이 더 우수한 결과를 나타내었다."},{"label":4,"text":"Opti-FL_ar이 C-SE2_ar보다 더 좋은 결과를 나타낸 이유를 실리카 필러의 높은 함량과 adhesive의 두께가 두껍기 때문으로 설명하였다."},{"label":5,"text":"실험에 사용된 UA는 10μm 이하, Opti-FL_ar은 50μm 이상의 두께를 나타내었다."}],"answer_raw":"2","explanation":"답 2 (20-4-1. Mohammad, Extra Bonding Layer Compensates Universal Adhesive’s Thin Film Thickness)\n1번, 3번은 맞는 말이고, 2번은 1개월 후에는 유사한 결과라고 설명하고 있습니다.\n4번은 conclusion에 나와있습니다.","images":["images/2022/q013_img1.jpeg","images/2022/q013_img2.jpeg"],"source_page":13,"answer_only":false},{"id":"q014","number":14,"question":"복합레진 중합수축의 생역학에 대한 설명으로 옳은 것은?","choices":[{"label":1,"text":"중합수축 반응이 진행될수록 중합수축 응력은 증가하고 탄성계수는 감소한다."},{"label":2,"text":"겔화점(gel point)이 되기 전에는 수축 응력을 어느정도 해소 가능하다."},{"label":3,"text":"복합레진에 포함된 필러의 양이 증가할수록 수축 응력이 증가한다."},{"label":4,"text":"1급 와동의 잔존벽은 높은 compliance를 가진다."},{"label":5,"text":"와동의 기하학적 형태는 복합레진의 중합수축에 미미한 영향만을 준다."}],"answer_raw":"2","explanation":"(치과보존학 p.321-323)\n1번 탄성계수는 증가합니다.\n3번 필러의 양이 증가할수록 수축 응력은 감소합니다.\n4번 1급와동의 compliance는 매우 낮다.(교과서 문장)\n5번 수복될 와동의 기하학적 형태에 의해서도 중합수축응력은 큰 영향을 받는다.(교과서 문장)","images":[]},{"id":"q015","number":15,"question":"다음 중 수복재의 광학적 성질로 옳지 않은 것은?","choices":[{"label":1,"text":"눈에 보이는 치과용 수복재의 양상은 표면반사, 흡수, 내부산란 현상의 총체적 결과이다."},{"label":2,"text":"치아를 격리시키면 수분이 증가되면서 내부산란이 증가되어 관찰자에게 더 많은 빛이 반\n사된다."},{"label":3,"text":"색 측정은 Munsell 표색계를 이용하여 측정하는데, 이는 색상, 명도, 채도의 항목으로 구\n성되어 있으며 각각 색의 파장, 강도, 순도를 표현해준다."},{"label":4,"text":"산란은 빛 투과시 빛의 경로의 일부를 단순히 편향시키는 것일 수도 있고, 다양한 깊이\n에서 빛을 반사하여 관찰자에게 돌아오는 것일 수도 있다."},{"label":5,"text":"광학적 성질이란 전자기장 방사선과의 반사, 굴절, 흡수, 투과 등의 상호반응을 말하며\n입사광의 반사, 내부산란, 흡수, 투과 등에 의하여 재료의 최종 색이 결정된다."}],"answer_raw":"2","explanation":"(치과보존학 제4개정판 p.82)\n수분 증가가 아니라 감소\n다른 보기는 교과서 문장과 동일","images":[]},{"id":"q016","number":16,"question":"다음은 transformation toug\n가진 재료는 무엇인가?","choices":[{"label":1,"text":"Gold"},{"label":2,"text":"Feldspathic porcelain"},{"label":3,"text":"Lithium disilicate"},{"label":4,"text":"Alumina"},{"label":5,"text":"Zirconia"}],"answer_raw":"5","explanation":"(치과보존학 제4 개정판 p\nghening에 의해 crack의 전파를 방지하는 기전\n.96)\n이다. 이러한 성질을","images":["images/2022/q016_img1.jpeg"],"source_page":17},{"id":"q017","number":17,"question":"아말감 합금에 대한 설명으로 옳지 않은 것은?","choices":[{"label":1,"text":"γ상은 수은과 반응하지 않고 남아있는 상이다."},{"label":2,"text":"구리를 일정 비율 이상 함유하면 γ2상의 형성을 억제할 수 있다."},{"label":3,"text":"아연을 0.01% 이상 함유한 아말감을 아연함유 아말감이라고 한다."},{"label":4,"text":"구상 아말감은 응축시에 절삭형 아말감보다 적은 힘으로 응축할 수 있다."},{"label":5,"text":"γ1상은 물리적 성질이 가장 떨어지는 합금상이다."}],"answer_raw":"5","explanation":"(치과보존학 제4개정판 p.179-181)","images":[]},{"id":"q018","number":18,"question":"2004년에 Dent Clin North Am에 M. Harry Parker가 개재한 ‘Resistance form of tooth\npreparation’에서 AC의 resistance form을 평가하는 방법 중 (a)에 해당하는 것은?","choices":[{"label":1,"text":"Weed"},{"label":2,"text":"Lewis"},{"label":3,"text":"Zuckerman"},{"label":4,"text":"Summit"},{"label":5,"text":"Sturdevant"}],"answer_raw":"1","explanation":"(Classic B-5-3-1)","images":["images/2022/q018_img1.p ces in bond strengths within the same tooth.(O)\n④ It results in fewer defects occurring in the small-area specimens, as relected in higher\nbond strengths. (O)\n⑤ the results of the micro tensile bond strength methodology vary in function of several\ntesting parameters, including storagetime, the cross-sectional shape of the micro\nspecimen, remaining dentin thickness, and jig design.(X)","images":["images/2022/q026_img1.jpeg"],"source_page":27},{"id":"q027","number":27,"question":"레진 수복 후 발생할 수 있는 다음의 문제는?","choices":[{"label":1,"text":"Abrasion-attrition"},{"label":2,"text":"Corrosion-abrasion"},{"label":3,"text":"Attrition-abrasion"},{"label":4,"text":"Abrasion-corrosion"},{"label":5,"text":"Corrosion-attrition"}],"answer_raw":"1","explanation":"(Fundamental Fig11-6,7 동일그림)","images":["images/2022/q027_img1.jpeg"],"source_page":28},{"id":"q028","number":28,"question":"각 그림에 맞는 test는?","choices":[{"label":1,"text":"Microshearbond-Microtensile-Pushout"},{"label":2,"text":"Microshearbond-pushout-tensilebond"},{"label":3,"text":"Microtensilebond-shearbond-pushout"},{"label":4,"text":"Microtensilebond-pushout-shearbond"}],"answer_raw":"1","explanation":"답 1 (Fundamental Fig 9-16 동일그림)\n그림에는 6가지 정도의 bond test가 제시되고, 그중 문제의 빈칸은 Micro shear bond test, tensile bond test, push out test에 해당합니다.","images":["images/2022/q028_img1.jpeg"],"source_page":29,"answer_only":false},{"id":"q029","number":29,"question":"치질의 Ca와 지르코니아의\n접착 기능성 단량체 중 해당하는 것을 고르시오.","choices":[{"label":1,"text":"","image":"images/2022/q029_img1.png"},{"label":2,"text":"","image":"images/2022/q029_img2.jpeg"},{"label":3,"text":"","image":"images/2022/q029_img3.png"},{"label":4,"text":"","image":"images/2022/q029_img4.png"},{"label":5,"text":"","image":"images/2022/q029_img5.png"}],"answer_raw":"2","explanation":"해설)\n①4-META, ②10-MDP, ③ PENTA\n- 이는 10-MDP가 치질의 Ca와\n- 접착 기능성 단량체 인 10-m\n레진 시멘트는 MDP의 phosph\n기때문에 지르코니아 수복물에\nOH와 화학적으로 결합하는 접착 기능성 단량체\nA, ④Bis-GMA, ⑤ HEMA (치과보존학 4th, p.271,4\n와 결합함으로써 ~ (치과보존학 4th, p.271)\nmethacryloyloxydecyldihydrogenphosphate (MDP\nhate ester 단량체와 지르코니아의 hydroxyl기가\n추천된다 (치과보존학 4th, p.489).\n체는?\n488)\nP)를 포함한 접 착형\n가 화학적 결합을 하","images":[],"source_page":30},{"id":"q030","number":30,"question":"다음중 photoinitiator에 대해 옳지 않은 것은?","choices":[{"label":1,"text":"Type I photoinitiator는 Type II보다 강하고 효율적이다."},{"label":2,"text":"Type II photoinitiator는 추가적인 electron transfer pathway가 필요하다."},{"label":3,"text":"Camphoquinone은 Lucirin TPO보다 낮은 파장에서 활성화 된다."},{"label":4,"text":"UV, violet light보다 blue light가 레진을 더 깊이 중합한다."},{"label":5,"text":"Camphoquinone은 Type II형 photoinitiator이다."}],"answer_raw":"3","explanation":"해설) A/S 7th, p.174\n① Type I photoinitiators have a high quantum yield, meaning they require fewer photons to\ngenerate a free radical than do Type II initiators. (O)\n② Type II photoinitiators (e.g., camphorquinone [CQ] and 1-phenyl-1,2-propanedione [PPD]) also\nrequire an additional secondary electron transfer agent (this is typically an amine electron\naccepting agent) to generate a free radical. (O)\n③ It can be seen that CQ is best activated by light in the blue region close to 470 nm, whereas\nLucirin TPO absorbs light only within the violet region below 420 nm, with a maximum absorption\nnear 385 nm.(X, Lucirin TPO가 더 낮은 파장에서 활성화됨.)\n④ This blue light can penetrate deeper into the resin than UV or violet light, such that some\n“blue light–cured” restorations can now be adequately light cured in increments that are up to 5-\nmm thick. (O)\n⑤ (O, 보기② 해설 참고)","images":[]},{"id":"q031","number":31,"question":"Photoinitiator의 absorption profile 연결 하는 문제\nA,B,C,D의 순서로 옳은 것은?","choices":[],"answer_raw":"CQ - Lucirin TPO – Ivocerin - PPD","explanation":"CQ - Lucirin TPO – Ivocerin - PPD\n그래프에는 그냥 TPO인데 보기에는 Lucirin TPO였습니다.\nArt&Science (7판 영문판) p.174 Fig 6.7","images":["images/2022/q031_img1.jpeg"],"source_page":32,"answer_only":true,"answer_display":"CQ - Lucirin TPO – Ivocerin - PPD"},{"id":"q032","number":32,"question":"J Wong 등이 2020 Oper Dent에 발표한 “Enamel etching for universal adhesive: examination\nof enamel protocols for optimization of bonding effectiveness” 내용 중 틀린 것은?","choices":[{"label":1,"text":"G-Premio Bond의 경우 PPA를 적용한 경우 시간에 관계없이 bond fatigue strength가 대조군\n보다 유의미하게 증가하였다"},{"label":2,"text":"G-Premio Bond의 경우 PLA를 15초 적용한 경우 bond fatigue strength가 대조군 보다 유의\n미하게 증가하였다"},{"label":3,"text":"G-Premio Bond의 경우 PPM을 15초 적용한 경우 bond fatigue strength가 대조군 보다 유의\n미하게 증가하였다"},{"label":4,"text":"PPA를 적용한 경우 PLA와 PPM보다 surface roughness가 유의미하게 높았다"},{"label":5,"text":"PLA를 적용한 경우 대조군보다 surface roughness가 유의미하게 높았다"}],"answer_raw":"3","explanation":"해설: 2020 최신수복 1-5 논문에서 각각 Table 4의 G-Premio Bond 부분, Table 5의 surface\nroughness 부분만 제시하였습니다. PPM으로 에칭한 경우 대조군에 비하여 bond fatigue strength\n는 에칭 시간에 관계 없이 증가하지 않았습니다.","images":["images/2022/q032_img1.png","images/2022/q032_img2.png"],"source_page":33},{"id":"q033","number":33,"question":"글라스 아이오노머에 대한 설명 중 옳지 않은 것은?","choices":[{"label":1,"text":"불소 젤과 같은 고농도의 불소 국소도포는 글라스 아이오노머 수복물에 불소를 재충전시\n킨다."},{"label":2,"text":"초기에 포화된 기질에서 불소이온이 빠르게 방출된다"},{"label":3,"text":"초기 이후에 분말입자에서 불소이온이 서서히 방출된다"},{"label":4,"text":"수복 직후 높은 농도의 불소방출은 시간이 지나도 유지된다."},{"label":5,"text":"치면에 불소를 유리하여 항우식 작용을 한다."}],"answer_raw":"4","explanation":"(치과보존학 4판P90-91)","images":[]},{"id":"q034","number":34,"question":"글라스 아이오노머를 이용한 5급 와동 수복 시 적절하지 않은 것은?","choices":[{"label":1,"text":"글라스 아이오노머는 변연 강도가 약하므로 사면 형성 없이 와동을 형성한다."},{"label":2,"text":"글라스 아이오노머는 치아에 접착되지 않으므로 반드시 유지구를 형성해야한다"},{"label":3,"text":"광중합형 레진 강화형 글라스아이오노머는 광조사 후 곧바로 마무리와 연마를 시행할 수\n있다."},{"label":4,"text":"레진 강화형 글라스 아이오노머의 경우는 conditioner로 와동을 전 처리하면 치질 결합\n력이 향상된다."},{"label":5,"text":"레진 강화형 글라스 아이오노머는 와동이 깊을 경우 적층법에 의해 충전 후 중합하여야\n한다."}],"answer_raw":"2","explanation":"(치과보존학 4판 P396-397)","images":[]},{"id":"q035","number":35,"question":"2019년 Ahmed Sleibi의 A comparative evaluation of ion release characteristics of three\ndifferent dental varnishes containing fluoride either with CPP-
