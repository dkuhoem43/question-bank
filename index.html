<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#111827">
<title>Question Bank</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:#111827;color:#fff;padding:12px}
.title{font-weight:800}.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
button{border:0;border-radius:10px;padding:9px 11px;font-size:14px;background:#fff;color:#111827}
main{max-width:850px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 12px #0001}
.meta{color:#6b7280;font-size:13px;margin-bottom:8px}.q{font-size:17px;font-weight:650;line-height:1.65;white-space:pre-wrap}
.choice{width:100%;text-align:left;margin-top:9px;border:1px solid #e5e7eb;background:#fafafa}
.choice.correct{background:#dcfce7;border-color:#22c55e}.choice.wrong{background:#fee2e2;border-color:#ef4444}
.figure{margin-top:14px;text-align:center}.figure img{max-width:100%;height:auto;border-radius:10px;border:1px solid #ddd;cursor:zoom-in}
.explain{margin-top:14px;padding:13px;border-radius:12px;background:#f3f4f6;line-height:1.6;white-space:pre-wrap}
.nav{display:flex;gap:8px;margin-top:12px}.nav button{flex:1;background:#111827;color:#fff}
.book{float:right;background:none;font-size:20px;padding:0;cursor:pointer}.book.active{filter:drop-shadow(0 0 3px #f59e0b)}
.mode-modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:40;padding:18px}.mode-modal.show{display:flex}.mode-box{max-width:860px;background:#fff;border-radius:18px;padding:20px;max-width:380px;width:100%;box-shadow:0 8px 30px #0004}.mode-box h3{margin:0 0 8px}.mode-box p{color:#6b7280;font-size:14px;line-height:1.5}.mode-actions{display:flex;gap:8px;margin-top:14px}.mode-actions button{flex:1;background:#111827;color:#fff}.mode-actions .cancel{background:#e5e7eb;color:#111827}.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{padding:9px 12px;background:#f3f4f6;border-radius:10px}
.overlay{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;z-index:50;padding:10px}
.overlay.show{display:flex}.overlay img{max-width:100%;max-height:100%;object-fit:contain}
.close{position:absolute;right:14px;top:14px;border-radius:50%;width:42px;height:42px;font-size:22px}
.retry-btn{width:100%;margin-top:12px;background:#f3f4f6;color:#111827;border:1px solid #d1d5db;font-weight:800}.explanation-figure{margin-top:14px}.question-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:12px}.preview-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:55vh;overflow:auto;margin-top:8px}.preview-item{display:flex;gap:9px;align-items:flex-start;text-align:left;padding:10px;border:1px solid #e5e7eb;background:#fff;border-radius:10px;cursor:pointer}.preview-item:hover{background:#f3f4f6}.preview-num{min-width:34px;height:34px;border-radius:8px;background:#f3f4f6;display:flex;align-items:center;justify-content:center;font-weight:800}.preview-text{font-size:13px;line-height:1.45;color:#374151}.preview-item.current{border:2px solid #111827;padding:9px}.preview-item.done{border-color:#22c55e}.preview-item.wrong{border-color:#ef4444;background:#fff7f7}.preview-item.bookmark{box-shadow:inset 0 0 0 2px #f59e0b}@media(max-width:700px){.preview-grid{grid-template-columns:1fr}}.qnum-btn{padding:10px 4px;border:1px solid #e5e7eb;background:#fff;border-radius:10px;font-weight:700}.qnum-btn.current{background:#111827;color:#fff}.qnum-btn.done{border-color:#22c55e}.qnum-btn.wrong{border-color:#ef4444;background:#fee2e2}.qnum-btn.bookmark{box-shadow:inset 0 0 0 2px #f59e0b}.list-card{margin-top:12px;padding:14px;background:#f9fafb;border-radius:14px}.list-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.list-note{font-size:12px;color:#6b7280;margin-top:6px}.explanation-figure img{max-width:100%;height:auto;display:block;margin:0 auto;cursor:zoom-in}.year-tabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0}.year-tab{background:#f3f4f6;min-width:58px}.year-tab.active{background:#111827;color:#fff;font-weight:800}</style></head><body>
<header><div class="title">🦷 치과보존과 Question Bank</div>
<div class="toolbar"><button onclick="goHome()">🏠 첫 화면</button><button onclick="openGoto()">🔢 번호 이동</button><button onclick="setMode('all')">전체</button><button onclick="setMode('wrong')">❌ 오답</button><button onclick="setMode('bookmark')">🔖 북마크</button><button onclick="setMode('stats')">📊 통계</button><button onclick="openReset()">⚙️ 초기화</button><button onclick="openInfo('manual')">📖 사용설명서</button><button onclick="openInfo('updates')">🆕 업데이트</button></div></header>
<main id="app"></main>
</div>
<div class="mode-modal" id="modeModal"><div class="mode-box"><h3 id="modeTitle">학습 위치</h3><p id="modeDesc">어디서 시작할까요?</p><div class="mode-actions"><button onclick="confirmModeChange('start')">처음부터</button><button onclick="confirmModeChange('last')">마지막 위치</button><button class="cancel" onclick="cancelModeChange()">취소</button></div></div></div>
<div class="mode-modal" id="gotoModal"><div class="mode-box"><h3>🔢 문제 번호 이동</h3><p id="gotoDesc">번호를 입력하거나 아래 문제 미리보기에서 선택하세요.</p><div style="display:flex;gap:8px;margin:8px 0 12px"><input id="gotoInput" type="number" min="1" max="100" placeholder="문제 번호" style="flex:1;padding:11px;border:1px solid #d1d5db;border-radius:10px;font-size:16px" onkeydown="if(event.key==='Enter')goToNumber()"><button onclick="goToNumber()">이동</button></div><input id="previewSearch" type="text" placeholder="🔎 문제 내용 검색" style="width:100%;box-sizing:border-box;padding:10px;border:1px solid #d1d5db;border-radius:10px;margin-bottom:8px" oninput="renderGotoGrid()"><div class="preview-filters" id="previewFilters"></div><div class="list-note">문제 번호와 문제 첫 부분을 미리 볼 수 있습니다. 클릭하면 바로 이동합니다.</div><div class="preview-grid" id="previewGrid"></div><div class="mode-actions" style="margin-top:12px"><button class="cancel" onclick="closeGoto()">닫기</button></div></div></div>
<div class="mode-modal" id="resetModal"><div class="mode-box"><h3>⚙️ 초기화</h3><p>무엇을 초기화할까요?</p><div class="mode-actions" style="flex-direction:column"><button onclick="resetStudy()">🔄 전체 문제 풀이기록 초기화</button><button onclick="resetWrong()">❌ 오답 목록 초기화</button><button onclick="resetBooks()">🔖 북마크 목록 초기화</button><button onclick="resetAll()">🗑️ 전체 학습기록 초기화</button><button class="cancel" onclick="closeReset()">취소</button></div></div></div>
<div class="mode-modal" id="infoModal"><div class="mode-box" style="max-width:620px;max-height:85vh;overflow:auto"><h3 id="infoTitle">📖 사용설명서</h3><div id="infoContent" style="line-height:1.7;font-size:14px"></div><div class="mode-actions"><button class="cancel" onclick="closeInfo()">닫기</button></div></div></div>
<div class="overlay" id="ov" onclick="if(event.target.id==='ov')closeZoom()"><button class="close" onclick="closeZoom()">×</button><img id="zi"></div>
<script>
const YEARS=[2020,2021,2022,2023,2024,2025];
const KEY_PREFIX="QB_FINAL_V7_";
const OLD_KEY="QB_FINAL_V6";
const CURRENT_YEAR_KEY="QB_CURRENT_YEAR";
let DATA=null, YEAR=Number(localStorage.getItem(CURRENT_YEAR_KEY))||2025;
if(!YEARS.includes(YEAR)) YEAR=2025;
let mode="home",idx=0,answers={},books={},positions={},wrongIds=[];
let pendingMode=null,pendingCurrentId=null,previewFilter="all";

function key(y=YEAR){return KEY_PREFIX+y}
function defaultState(){return {mode:"all",idx:0,answers:{},books:{},positions:{},wrongIds:[],lastUsed:0}}
function loadState(y){
  let raw=localStorage.getItem(key(y));
  // Existing v12 data is preserved and migrated to the new year-specific 2025 store.
  if(!raw && y===2025){
    const old=localStorage.getItem(OLD_KEY);
    if(old){localStorage.setItem(key(y),old);raw=old;}
  }
  let s=raw?JSON.parse(raw):defaultState();
  answers=s.answers||{}; books=s.books||{}; positions=s.positions||{};
  wrongIds=s.wrongIds||Object.keys(answers).filter(id=>answers[id]?.lastCorrect===false);
  mode=s.mode&&["all","wrong","bookmark"].includes(s.mode)?s.mode:"all";
  idx=Number.isInteger(s.idx)?s.idx:0;
  if(!positions[mode]) positions[mode]=idx;
}
function save(){
  if(!DATA)return;
  positions[mode]=idx;
  localStorage.setItem(key(YEAR),JSON.stringify({mode,idx,answers,books,positions,wrongIds,lastUsed:Date.now()}));
  localStorage.setItem(CURRENT_YEAR_KEY,String(YEAR));
}
async function loadYear(y,showHome=false){
  if(!YEARS.includes(y))return;
  if(DATA)save();
  const app=document.getElementById("app");
  app.innerHTML='<div class="card"><p style="text-align:center">📚 '+y+'년 문제를 불러오는 중...</p></div>';
  try{
    const r=await fetch(`questions-${y}.json`,{cache:"no-cache"});
    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    DATA=await r.json(); YEAR=y; loadState(y); localStorage.setItem(CURRENT_YEAR_KEY,String(y));
    mode=showHome?"home":mode;
    render();
  }catch(e){
    app.innerHTML=`<div class="card"><h3>⚠️ ${y}년 문제를 불러오지 못했습니다.</h3><p style="color:#6b7280">questions-${y}.json 파일이 같은 폴더에 있는지 확인해주세요.</p><p style="font-size:12px;color:#9ca3af">${esc(e.message)}</p></div>`;
  }
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function arr(m=mode){if(!DATA)return[];if(m==="wrong")return DATA.questions.filter(q=>wrongIds.includes(q.id));if(m==="bookmark")return DATA.questions.filter(q=>books[q.id]);return DATA.questions}
function ans(q){return q.answer_raw?[Number(q.answer_raw)]:[]}
function modeName(m){return m==="all"?"전체":m==="wrong"?"오답":"북마크"}
function goHome(){save();mode="home";render()}
function changeYear(y){loadYear(Number(y),true)}
function openInfo(type){
  const title=document.getElementById("infoTitle"),box=document.getElementById("infoContent");
  if(type==="manual"){
    title.textContent="📖 사용설명서";
    box.innerHTML=`<h4>🦷 기본 사용법</h4><p><b>전체</b> · 모든 문제를 풉니다.<br><b>❌ 오답</b> · 현재 연도에서 오답으로 기록된 문제만 풉니다.<br><b>🔖 북마크</b> · 북마크한 문제만 모아 풉니다.</p><h4>▶️ 시작 위치</h4><p>전체·오답·북마크를 누르면 <b>처음부터 / 마지막 위치</b>를 선택할 수 있습니다. 마지막 위치는 각 모드별로 따로 저장됩니다.</p><h4>📝 문제 풀이</h4><p>답을 선택하면 정답과 해설이 표시됩니다. 답보기 문제는 <b>📖 답보기</b>를 누르면 답과 해설을 확인할 수 있습니다.</p><h4>🔄 이 문제 다시 풀기</h4><p>해설 아래의 <b>🔄 이 문제 다시 풀기</b>를 누르면 해당 문제만 다시 미풀이 상태로 돌아갑니다. 북마크는 유지됩니다.</p><h4>🔢 번호 이동</h4><p>문제 번호를 직접 입력하거나 문제 목록에서 원하는 문제를 눌러 바로 이동할 수 있습니다.</p><h4>📊 학습 통계</h4><p>현재 연도의 풀이·정답·오답·북마크 현황을 확인합니다. 연도별 학습기록은 서로 별도로 저장됩니다.</p><h4>⚙️ 초기화</h4><p>풀이기록, 오답 목록, 북마크, 전체 학습기록을 각각 선택해서 초기화할 수 있습니다.</p><h4>💾 데이터 보존</h4><p>풀이기록과 북마크는 이 브라우저의 로컬 저장공간에 저장됩니다. 앱 파일을 업데이트해도 같은 브라우저 저장공간을 사용하면 기존 기록이 유지됩니다.</p>`;
  }else{
    title.textContent="🆕 업데이트 내용";
    box.innerHTML=`<h4>v29</h4><ul><li>🔍 <b>2020~2025 전체 문제 데이터 전수 구조 점검</b></li><li>📝 2023년 3번 불필요한 사진 제거</li><li>📝 2023년 10번 보기 1~4를 문제에 포함하고 A/B 답보기 형식으로 정리, 추가 그림은 풀이로 이동</li><li>📝 2023년 12번은 그림의 1~5 순서를 기준으로 정리하고 풀이에 각 이름 표시</li><li>📝 2023년 86번도 답보기 후 정답/해설이 보이도록 수정</li><li>📝 2023년 10번을 <b>A/B 답보기(객관식)</b> 형식으로 정리</li><li>📝 2023년 21번의 누락된 2·4번 보기 복구</li><li>📝 2023년 86번의 '정답 미복원' 상태와 숫자 정답 불일치 수정</li><li>📝 2024년 84번 해설에 <b>1? 2?</b> 반영</li><li>🧹 패키지에 실제 존재하지 않는 깨진 이미지 경로 제거</li><li>📚 전체 / ❌ 오답 / 🔖 북마크의 <b>처음부터 / 마지막 위치</b> 선택 기능 통일</li><li>🔄 문제별 <b>이 문제 다시 풀기</b> 기능 유지</li><li>📖 사용설명서 및 업데이트 내용 메뉴 유지</li></ul><p style="color:#6b7280;font-size:12px">※ 이후 버전의 변경사항은 이 메뉴에 계속 추가합니다.</p>`;
  }
  document.getElementById("infoModal").classList.add("show");
}
function closeInfo(){document.getElementById("infoModal").classList.remove("show")}

function openGoto(){
  document.getElementById("gotoDesc").textContent=`${YEAR}년 문제 번호를 입력하거나 문제 미리보기에서 선택하세요.`;
  document.getElementById("gotoModal").classList.add("show");
  previewFilter="all";
  const inp=document.getElementById("gotoInput");inp.value="";const ps=document.getElementById("previewSearch");if(ps)ps.value="";setTimeout(()=>inp.focus(),50);
  renderGotoGrid();
}
function closeGoto(){document.getElementById("gotoModal").classList.remove("show")}
function setPreviewFilter(f){previewFilter=f;renderGotoGrid()}
function renderGotoGrid(){
  const box=document.getElementById('previewGrid'); if(!box||!DATA)return;
  const filterBox=document.getElementById('previewFilters');
  const all=DATA.questions;
  const wrong=all.filter(q=>wrongIds.includes(q.id));
  const bookmark=all.filter(q=>books[q.id]);
  if(filterBox)filterBox.innerHTML=[['all','전체',all.length],['wrong','❌ 오답',wrong.length],['bookmark','🔖 북마크',bookmark.length]].map(([k,label,n])=>`<button class="preview-filter ${previewFilter===k?'active':''}" onclick="setPreviewFilter('${k}')">${label} ${n}</button>`).join('');
  const base=previewFilter==='wrong'?wrong:previewFilter==='bookmark'?bookmark:all;
  const keyword=(document.getElementById('previewSearch')?.value||'').trim().toLowerCase();
  const filtered=keyword?base.filter(q=>String(q.number).includes(keyword)||String(q.question||'').toLowerCase().includes(keyword)):base;
  const A=arr();
  box.innerHTML=filtered.map((q)=>{
    const i=A.findIndex(x=>x.id===q.id); const s=answers[q.id];
    let c='preview-item'; if(i===idx && i>=0)c+=' current'; if(s?.selected!=null)c+=s.lastCorrect?' done':' wrong'; if(books[q.id])c+=' bookmark';
    const clean=String(q.question||'').replace(/\s+/g,' ').trim();
    const preview=clean.length>110?clean.slice(0,110)+'…':clean;
    const marks=[s?.selected!=null?(s.lastCorrect?'🟢':'❌'):'',books[q.id]?'🔖':''].filter(Boolean).join(' ');
    return `<button class="${c}" onclick="gotoId('${q.id}')"><span class="preview-num">${q.number}</span><span class="preview-text">${esc(preview)}${marks?`<br><span>${marks}</span>`:''}</span></button>`;
  }).join('') || '<div style="grid-column:1/-1;color:#6b7280;padding:20px;text-align:center">해당하는 문제가 없습니다.</div>';
}
function gotoId(id){
  // 첫 화면/통계 화면에서 번호 목록을 처음 클릭해도 바로 문제로 이동하도록 전체 모드로 전환
  if(mode==="home"||mode==="stats") mode="all";
  let A=arr(),i=A.findIndex(q=>q.id===id);
  if(i<0){mode='all';A=arr();i=A.findIndex(q=>q.id===id);}
  if(i<0)return;
  idx=i;positions[mode]=idx;closeGoto();save();render();
}
function goToNumber(){
  const n=Number(document.getElementById("gotoInput").value),A=arr();
  if(!Number.isInteger(n)||n<1||n>DATA.questions.length){alert(`1번부터 ${DATA.questions.length}번까지 입력해주세요.`);return}
  if(mode==="home"||mode==="stats")mode="all";
  const target=A.findIndex(q=>Number(q.number)===n);
  if(target<0){alert(`${n}번 문제는 현재 ${modeName(mode)} 목록에 없습니다.\n전체 문제에서 이동하려면 '전체'를 선택해주세요.`);return}
  idx=target;positions[mode]=idx;closeGoto();save();render();
}
function startAll(){
  save();
  pendingMode="all";
  pendingCurrentId=arr()[idx]?.id||null;
  document.getElementById("modeTitle").textContent="전체 문제로 이동";
  document.getElementById("modeDesc").textContent="전체 문제를 처음부터 볼까요, 마지막 위치로 돌아갈까요?";
  document.getElementById("modeModal").classList.add("show");
}
function setMode(m){
  save();
  if(m==="stats"){mode="stats";idx=0;render();return}
  pendingMode=m;
  pendingCurrentId=arr()[idx]?.id||null;
  document.getElementById("modeTitle").textContent=`${modeName(m)}로 이동`;
  document.getElementById("modeDesc").textContent=`${modeName(m)} 문제를 처음부터 볼까요, 이 모드의 마지막 위치로 돌아갈까요?`;
  document.getElementById("modeModal").classList.add("show");
}
function confirmModeChange(kind){
  if(!pendingMode)return;
  const m=pendingMode,A=arr(m);let target=0;
  if(A.length&&kind==="last")target=Number.isInteger(positions[m])?positions[m]:0;
  mode=m;idx=A.length?Math.max(0,Math.min(A.length-1,target)):0;positions[m]=idx;
  pendingMode=null;pendingCurrentId=null;document.getElementById("modeModal").classList.remove("show");save();render();
}
function cancelModeChange(){pendingMode=null;pendingCurrentId=null;document.getElementById("modeModal").classList.remove("show")}
function openReset(){document.getElementById("resetModal").classList.add("show")}
function closeReset(){document.getElementById("resetModal").classList.remove("show")}
function resetWrong(){if(!confirm("${YEAR}년 오답 목록을 초기화할까요?"))return;Object.keys(answers).forEach(id=>{if(answers[id]?.lastCorrect===false)delete answers[id]});wrongIds=[];positions.wrong=0;if(mode==="wrong")idx=0;closeReset();save();render()}
function resetBooks(){if(!confirm("${YEAR}년 북마크 목록을 모두 초기화할까요?"))return;books={};positions.bookmark=0;if(mode==="bookmark")idx=0;closeReset();save();render()}
function resetStudy(){if(!confirm("${YEAR}년 문제 풀이기록을 초기화할까요?\n북마크와 오답목록은 유지됩니다."))return;answers={};positions={};idx=0;mode="all";closeReset();save();render()}
function resetAll(){if(!confirm("${YEAR}년 학습기록을 전체 초기화할까요?"))return;answers={};books={};wrongIds=[];positions={};idx=0;mode="all";closeReset();save();render()}
function zoom(s){document.getElementById("zi").src=s;document.getElementById("ov").classList.add("show")}
function closeZoom(){document.getElementById("ov").classList.remove("show")}
function revealAnswer(id){answers[id]={...(answers[id]||{}),revealed:true};save();render()}
function choose(id,n){
  if(answers[id]?.selected!=null)return;
  const q=DATA.questions.find(x=>x.id===id),a=ans(q),ok=a.includes(n);
  answers[id]={selected:n,lastCorrect:ok,wrongCount:(answers[id]?.wrongCount||0)+(ok?0:1),lastDate:new Date().toISOString()};
  if(!ok&&!wrongIds.includes(id))wrongIds.push(id);
  save();render();
}
function resetQuestion(id){
  if(!answers[id] && !wrongIds.includes(id))return;
  delete answers[id];
  wrongIds=wrongIds.filter(x=>x!==id);
  save();
  render();
}
function toggleBook(id){books[id]=!books[id];save();render()}
function move(d){const A=arr();idx=Math.max(0,Math.min(A.length-1,idx+d));save();render()}
function yearStats(y){
  let raw=localStorage.getItem(key(y));if(y===2025&&!raw)raw=localStorage.getItem(OLD_KEY);let s=raw?JSON.parse(raw):{};let a=s.answers||{},b=s.books||{};
  return {attempted:Object.keys(a).length,correct:Object.values(a).filter(x=>x.lastCorrect).length,wrong:Object.values(a).filter(x=>x.lastCorrect===false).length,book:Object.values(b).filter(Boolean).length};
}
function home(){
  const st=yearStats(YEAR), total=DATA?.questions?.length||0;
  document.getElementById("app").innerHTML=`<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h2 style="margin:4px 0">🦷 치과보존과 Question Bank</h2><select onchange="changeYear(this.value)" style="padding:9px;border:1px solid #d1d5db;border-radius:10px;font-size:15px">${YEARS.map(y=>`<option value="${y}" ${y===YEAR?'selected':''}>${y}년</option>`).join('')}</select></div>
    <div class="year-tabs">${YEARS.map(y=>`<button class="year-tab ${y===YEAR?'active':''}" onclick="changeYear(${y})">${y}</button>`).join('')}</div>
    <p style="color:#6b7280">${YEAR}년 문제 · 총 ${total}문제</p>
    <div class="stats"><div class="stat">푼 문제 ${st.attempted}</div><div class="stat">⭕ 정답 ${st.correct}</div><div class="stat">❌ 오답 ${st.wrong}</div><div class="stat">🔖 북마크 ${st.book}</div></div>
    <div class="nav" style="flex-direction:column;margin-top:18px">
      <button onclick="startAll()" style="background:#111827;color:#fff;font-weight:800">📚 ${YEAR}년 전체 문제 풀기</button>
      <button onclick="setMode('wrong')">❌ ${YEAR}년 오답 문제</button>
      <button onclick="setMode('bookmark')">🔖 ${YEAR}년 북마크 문제</button>
      <button onclick="setMode('stats')">📊 학습 통계</button>
    </div>
  </div>`;
}
function stats(){
  const st=yearStats(YEAR),total=DATA.questions.length;
  document.getElementById("app").innerHTML=`<div class="card"><h2>📊 ${YEAR}년 학습 통계</h2><div class="stats"><div class="stat">전체 ${total}</div><div class="stat">푼 문제 ${st.attempted}</div><div class="stat">최근 정답 ${st.correct}</div><div class="stat">최근 오답 ${st.wrong}</div><div class="stat">북마크 ${st.book}</div></div><p style="color:#6b7280">학습기록은 ${YEAR}년에만 별도로 저장됩니다.</p><p><button onclick="setMode('all')">문제 풀기</button></p></div>`;
}
function render(){
  if(!DATA)return;
  if(mode==="home")return home();
  if(mode==="stats")return stats();
  const A=arr();
  if(!A.length){document.getElementById("app").innerHTML='<div class="card"><h3>현재 모드에 문제가 없습니다.</h3><p style="color:#6b7280">문제 화면의 🔖 버튼을 눌러 북마크를 추가하거나 문제를 풀어주세요.</p></div>';save();return;}
  idx=Math.max(0,Math.min(A.length-1,idx));const q=A[idx],a=ans(q),st=answers[q.id],marked=!!books[q.id];
  const validChoices=(q.choices||[]).filter(c=>String(c.text||'').trim()||c.image);
  const answerOnly=!!q.answer_only || validChoices.length===0;
  const cs=answerOnly
  ? (q.answer_raw ? `<button class="choice" onclick="revealAnswer('${q.id}')" ${st?.revealed?"disabled":""}><b>📖 답보기(객관식)</b></button>` : ``)
  : validChoices.map(c=>{let cl="choice";if(st?.selected!=null){if(a.includes(c.label))cl+=" correct";else if(st.selected===c.label)cl+=" wrong"}const ci=c.image?`<div class="choice-image"><img src="${c.image}" onclick="event.stopPropagation();zoom(this.src)"></div>`:"";return `<button class="${cl}" onclick="choose('${q.id}',${c.label})" ${st?.selected!=null?"disabled":""}><b>${c.label}.</b> ${esc(c.text)}${ci}</button>`}).join("");
  const result=answerOnly&&st?.revealed?`<div style="margin-top:12px;font-weight:800">${q.answer_display?`⭕ 답: ${esc(q.answer_display)}`:'❌ 정답 미복원'}</div>`:(st&&!answerOnly?`<div style="margin-top:12px;font-weight:800">${a.length&&a.includes(st.selected)?"⭕ 정답":"❌ 오답"} · ${a.length?`정답: ${a.join(", ")}`:"정답 미복원"}</div>`:"");
  const fig=q.images?.length?`<div class="figure">${q.images.map(src=>`<img src="${src}" onclick="zoom(this.src)">`).join('')}</div>`:"";
  const efig=q.explanationImages?.length?q.explanationImages.map(src=>`<div class="figure explanation-figure"><img src="${src}" onclick="zoom(this.src)"></div>`).join(""):"";
  document.getElementById("app").innerHTML=`<div class="card"><div class="meta">${YEAR}년 · 제 ${q.number}번 · ${idx+1} / ${A.length} <button class="book ${marked?'active':''}" title="북마크" onclick="toggleBook('${q.id}');event.stopPropagation()">🔖</button></div><div class="q">${esc(q.question||"(원문에서 문제 문장이 확인되지 않습니다.)")}</div>${fig}<div>${cs}</div>${result}${st?`<div class="explain"><b>해설</b><br>${esc(q.explanation||"원문 해설 없음")}${efig}</div><button class="retry-btn" onclick="resetQuestion('${q.id}')">🔄 이 문제 다시 풀기</button>`:""}<div class="nav"><button onclick="move(-1)">← 이전</button><button onclick="move(1)">다음 →</button></div><div class="list-card"><div class="list-head"><b>📋 문제 목록</b><button onclick="openGoto()">전체 번호 보기</button></div><div class="list-note">번호를 누르면 바로 이동합니다 · 🟢 풀이함 · ❌ 오답 · 🔖 북마크</div></div><div style="font-size:12px;color:#6b7280;margin-top:8px">오답 횟수: ${st?.wrongCount||0} · ${marked?'🔖 북마크됨 · ':''}${q.source_page?`원문 p.${q.source_page}`:''}</div></div>`;
  save();
}
loadYear(YEAR,true);
</script>
</body></html>
