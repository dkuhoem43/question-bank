43},{"id":"q043","number":43,"question":".F.R. Tay의 2002년 논문 “Single-step adhesives are permeable membranes” 에서 다음 그림에\n관련된 설명 중 옳은 것은?","choices":[{"label":1,"text":"즉시 광중합할 경우 나타난다."},{"label":2,"text":"U는 hybrid layer 이다."},{"label":3,"text":"TEM 이미지이다."},{"label":4,"text":"G는 레진 중합체이다."},{"label":5,"text":"Resin globule, void, honey comb가 관찰되면 결합력이 증가한다."}],"answer_raw":"3","explanation":"(필독저널 B-1-1)","images":["images/2022/q043_img1.png","images/2022/q043_img2.png"],"source_page":45},{"id":"q044","number":44,"question":"2019년 M. Kelch의 “Impact of different pretreatments and aging procedures on the flexural\nstrength and phase structure of zirconia ceramics” 논문에 대한 설명 중 옳지 않은 것\n은?","choices":[{"label":1,"text":"Air abrasion 시행 시 monoclinic phase가 증가한다."},{"label":2,"text":"105μm alumina에서 더 monoclinic phase가 증가한다."},{"label":3,"text":"Hydrothermal aging 시행 시 monoclinic phase가 증가한다."},{"label":4,"text":"5 years storage 후에 monoclinic phase가 증가한다."},{"label":5,"text":"결과적으로 압력과는 관계없이 30μm silica-coated alumina powder가 가장 크게 강\n화시킨다."}],"answer_raw":"5","explanation":"(2019-4분기 수복 최신저널)\n가장 높은 상 전환은 105 alumina particle에서 관찰됩니다.","images":["images/2022/q044_img1.png"],"source_page":46},{"id":"q045","number":45,"question":"레진 강화형 글래스 아이오노머 시멘트에 대해 알맞은 설명은?","choices":[{"label":1,"text":"재래형 글래스 아이오노머에 레진을 첨가하여 강도와 용해도가 증가하였다."},{"label":2,"text":"재래형 글래스 아이오노머와 달리 불소 방출하지 않는다."},{"label":3,"text":"복합레진과 접착하지 않는다."},{"label":4,"text":"hygroscopic expansion을 한다."},{"label":5,"text":"재래형 글래스아이오노머 시멘트보다 경화 시 수분에 취약하다."}],"answer_raw":"4","explanation":"(치과보존학 4판 p. 484~485)\n④ 레진 강화형 글라스 아이오노머의 단점은 polyHEMA의 친수성으로 인해 수분을 흡수하여\nhygroscopic expansion을 한다는 것이다.","images":[]},{"id":"q046","number":46,"question":"레진 시멘트에 관한 설명으로 옳지 않은 것은?","choices":[{"label":1,"text":"복합레진 시멘트는 일반적으로 dimethacrylate monomer기반으로 이루어져 있다."},{"label":2,"text":"미반응 단량체로 인한 치수 자극의 가능성이 있다."},{"label":3,"text":"이중 중합형 레진 시멘트는 두 개의 연고 형태로 제공되는데 일반적으로 photoinitiator\n와 benzoyl peroxide는 반드시 같이 넣어야 한다."},{"label":4,"text":"10-MDP를 포함한 접착형 레진 시멘트는 지르코니아 수복물에 추천된다."},{"label":5,"text":"접착 시 1-step self-etch system을 사용할 경우 acidic monomer가 레진 시멘트의 tertiary\namine과 산-염기 반응을 일으키기 때문에 중합과정이 방해받게 된다."}],"answer_raw":"3","explanation":"(치과보존학 4판 p.485~489)\n③ photoinitiator와 benzoyl peroxide는 서로 분리되어 있다.","images":[]},{"id":"q047","number":47,"question":"(A)를 포함한 접착형 레진시멘트는 상아질과 금속 수복물에 접착강도가 크며 길고 유연한 고\n분자 사슬을 갖고 있어 연성이 좋으며 충격을 흡수하는 성향이 있다. 다음 중 (A)에 해당하는 것\n은?\n②\n④","choices":[],"answer_raw":"3","explanation":"(치과보존학 p.489)\n4-META를 포함한 접착형 레진 시멘트는 상아질과 금속 수복물에 접착강도가 크며 길고 유연한\n고분자 사슬을 갖고 있어 연성이 좋으며 충격을 흡수하는 성향이 있다.","images":["images/2022/q047_img1.jpeg","images/2022/q047_img2.jpeg","images/2022/q047_img3.jpeg","images/2022/q047_img4.jpeg","images/2022/q047_img5.jpeg"],"source_page":49},{"id":"q048","number":48,"question":"미백술에 대한 설명으로 옳지 않은 것은?","choices":[{"label":1,"text":"미백 직후 복합레진 수복은 접착강도를 감소시킨다."},{"label":2,"text":"실활치의 경우 치수조직의 괴사, 외상, 근관 충전물이 변색을 발생시킬 수 있다."},{"label":3,"text":"접착강도를 보상하기 위해 미백 종료 후 1~2주 기다렸다가 최종수복할 것을 권장한\n다."},{"label":4,"text":"치료 시 일어나는 부작용은 일시적인 냉각과민증, 치은자극 등이다."},{"label":5,"text":"모든 미백술의 미백효과는 영구적이다."}],"answer_raw":"5","explanation":"(치과보존학 p.509)\n미세 연마술을 제외한 모든 미백술의 미백 효과가 영구적이지 못합니다.","images":[]},{"id":"q049","number":49,"question":"근관치료 후 수복에 관한 설명 중 옳지 않은 것은?","choices":[{"label":1,"text":"근관치료 후 상아질 변성, 와동 형성으로 인한 치질 손상으로 파절 저항성 낮아진다."},{"label":2,"text":"포스트 길이가 길수록 fulcrum이 치경부에 집중되어 파절 가능성 높아진다."},{"label":3,"text":"근관 치료 후 수복 늦어지면 치관부 미세 누출로 인해 실패 가능성 커진다."},{"label":4,"text":"근관치료 시작 전 진단, 치료계획 수립 단계에서부터 수복 가능성, 치주치료 보철치\n료 등도 고려해야한다."},{"label":5,"text":"간접 수복 시행 시 임시재료로 인한 치관부 미세누출 가능성 있다."}],"answer_raw":"","explanation":"(2)\n해설) 근관치료학 p440 그림 12-8\n포스트의 길이가 “짧을수록” 회전축이 치경부 가까이 형성되고, 부적절한 응력 분산으로 인해 치\n근 파절이 일어남.","images":[]},{"id":"q050","number":50,"question":"테트라사이클린 변색에서 옳은 것은?","choices":[{"label":1,"text":"생후 3개월-7세에서는 영구전치 변색 일어난다."},{"label":2,"text":"복용량과 상관 없다."},{"label":3,"text":"복용 기간과 상관 없다."},{"label":4,"text":"테트라사이클린 종류와 상관 없다."},{"label":5,"text":"좌우 비대칭이다."}],"answer_raw":"1","explanation":"해설) 치과보존학 p494 왼쪽 문단","images":[]},{"id":"q051","number":51,"question":"2018년 von stein-lausnitz의\ncentral incisors with class III de\n하여 가장 높은 fracture load 값","choices":[{"label":1,"text":"CP"},{"label":2,"text":"V"},{"label":3,"text":"VP"},{"label":4,"text":"Cr"},{"label":5,"text":"CrP"}],"answer_raw":"2","explanation":"(최신저널 2018-4-3)\nResult Group V showed highes\nlowest mean fracture load(Fmax\n의 direct or indirect restoration of endodonitca\nfect? composite vs veneer or crown restoration\n값을 가지는 것은?\nst mean fracture load (Fmax=908N), while gro\nx=483N)\nally treated maxillary\nn에서 C 그룹과 비교\noup C presented the","images":["images/2022/q051_img1.jpeg"],"source_page":53},{"id":"q052","number":52,"question":"심미수복 시 상악 전치부를 고려할 사항으로 틀린 것은?","choices":[{"label":1,"text":"나이가 들수록 상순선 하방으로 치아가 덜 보인다."},{"label":2,"text":"유년기 때에는 상순선보다 2~3mm 길게 보인다."},{"label":3,"text":"여자보다 남자가 상순선 아래 치아가 더 많이 보인다."},{"label":4,"text":"미소선을 치은측 경계로 사용한다."},{"label":5,"text":"상악 전치의 폭/길이 비율은 85%이며 측절치와 견치는 80%이다."}],"answer_raw":"3","explanation":"(치과보존학 4판 285p)\n유년기에는 상악 전치의 절단연은 상순선에 비해 약 2~3mm 길고, 나이가 증가됨에 따라 절단연\n이 상순선 아래로 보이는 양이 적어지게 된다. 또한 남성(1.91mm)에 비해 여성(3.40mm)의 경우\n에 있어 전치가 상순선 아래로 많이 보인다. 미소선은 전치의 치은측 경계를 설정하는 기준으로\n이용할 수 있다. 치아의 폭/길이의 비가 80% 내외인 측절치와 견치에 비해 치아의 폭이 넓은 중\n절치는 85% 내외의 비율을 보인다.\n나머지는 문장은 교과서 그대로 동일한 문장.","images":[]},{"id":"q053","number":53,"question":"Munsell 색도계 그림(L, a, b 축만 표시되어 있는 흑백 그림)주어지고, 다음 중 옳은 것은?","choices":[{"label":1,"text":"L값이 높을수록 어두운 색을 나타낸다."},{"label":2,"text":"a+값은 파란색을 나타낸다."},{"label":3,"text":"a-값은 빨간색을 나타낸다."},{"label":4,"text":"b+값은 노란색을 나타낸다"},{"label":5,"text":"b-값은 초록색을 나타낸다."}],"answer_raw":"4","explanation":"L은 명도를 나타내며 + 일수록 밝은 색, - 일수록 어두운 색을 나타낸다\na*는 +는 빨간색, -는 초록색\nb*는 +는 노란색, -는 파란색을 나타낸다","images":[]},{"id":"q054","number":54,"question":"Perez의 2020년 Does background color influence visual threshold? 논문에서 수복물과 주위\n치아구조간 색의 mismatch가 발생하기 쉬운 배경색은?","choices":[{"label":1,"text":"white"},{"label":2,"text":"gray"},{"label":3,"text":"black"},{"label":4,"text":"yellow"},{"label":5,"text":"green"}],"answer_raw":"1","explanation":"white\n“As of clinical implications, the present study suggests that a color mismatch between a\nrestoration and the adjacent dental structure is more difficult to be accepted over a white\nbackground (e.g. opposing teeth in maximum intercuspation), which has a high reflectance value,\nthan over a black background (e.g. intra-oral darkness in maximum opening) that enhances\nperception of color differences, which should help on challenging dental shade matching.”","images":["images/2022/q054_img1.jpeg"],"source_page":56},{"id":"q055","number":55,"question":"2019년 operative dentistry\nSurface Roughness and Wear\nglazed ceramic의 wear test (120","choices":[{"label":1,"text":"VITABlocs Mark II"},{"label":2,"text":"IPS e.max CAD"},{"label":3,"text":"VITA Suprinity"},{"label":4,"text":"VITA Enamic"},{"label":5,"text":"Lava Ultimate"}],"answer_raw":"1","explanation":"(최신저널 2019-1-2)\ny에 발표된 Daryakenari의 'Effect of Simulated\nof Machinable Ceramics and Opposing Denta\n0,000 cycle)후 가장 높은 opposite enamel wear\nMastication on the\nal Enamel'에 따르면\nr가 발생한 재료는?","images":["images/2022/q055_img1.jpeg"],"source_page":57},{"id":"q056","number":56,"question":"다음 근관 형성 방법은?","choices":[{"label":1,"text":"Ohio state technique"},{"label":2,"text":"Southern California technique"},{"label":3,"text":"Step back technique"},{"label":4,"text":"Step down technique"},{"label":5,"text":"Crown down technique"}],"answer_raw":"3","explanation":"(근관치료학 Ch 9. 근관 성형 및 세정 p. 311)\n시험 문제는 위 그림으로 나왔고, step-back technique 과정에 대한 모식도입니다.","images":["images/2022/q056_img1.jpeg"],"source_page":58},{"id":"q057","number":57,"question":"2020년 Silva가 IEJ에 게재한 “Current status on minimal access cavity preparations: a critical\nanalysis and a proposal for a universal nomenclature”에서 근관 와동 형태 및 명칭으로 맞는 것은?","choices":[{"label":1,"text":"(a) conservative access cavity with divergent walls"},{"label":2,"text":"(b) ultra-conservatice access cavity"},{"label":3,"text":"(c) caries-driven access cavity"},{"label":4,"text":"(d) truss access cavity"},{"label":5,"text":"(e) restorative-driven access cavity"}],"answer_raw":"4","explanation":"(최신 논문 E-20-4)\n(a) conservative access cavity / (b) conservative access cavity with divergent walls / (c) ultra-\nconservative access cavity / (d) truss access cavity / (e) caries-driven access cavity","images":["images/2022/q057_img1.jpeg"],"source_page":59},{"id":"q058","number":58,"question":"미성숙 영구치에서 화살표 하방의 조직에서 유래되는 줄기세포는?","choices":[{"label":1,"text":"Dental pulp stem cell (DPSC)"},{"label":2,"text":"Stem cell of human exfoliated deciduous teeth (SHED)"},{"label":3,"text":"Stem cell of apical papilla (SCAP)"},{"label":4,"text":"Periodontal ligament stem cell (PDLSC)"},{"label":5,"text":"Bone marrow stem cell (BMSC)"}],"answer_raw":"3","explanation":"(Pathway 10판 (한글판) p657 그림 16.4)","images":["images/2022/q058_img1.jpeg"],"source_page":60},{"id":"q059","number":59,"question":"다음 근관 내 미생물 연구내용과 연구자 간에 옳게 짝지어진 것은?","choices":[{"label":1,"text":"Anthony van leew – 근관 내 세균이 치관부, 중간부, 치근부 분포가 다르다"},{"label":2,"text":"Miller - 괴사된 치수에 세균이 존재함"},{"label":3,"text":"Kakehashi - 무균 쥐와 일반쥐에 인위적으로 치수를 노출했을 때 세균이 없다면 치수 및\n치근단 질환이 생기지 않음을 검증함"},{"label":4,"text":"Moller – 모든 질환의 원인은 세균이며 괴사된 치수의 세균이 전신으로 퍼져 심각한 전\n신질환을 일으킨다"},{"label":5,"text":"Hunter - 괴사된 치수더라도 세균이 없으면 치근단 염증이 발생하지 않는다"}],"answer_raw":"3","explanation":"(근관치료학 p.107-108)\nAntony Van Leeuwenhoek: 17세기에 괴사된 치수에서 세균을 처음으로 발견.\nMiller: Antony가 세균을 발견하고 200년 뒤 세균이 치근단 치주염의 원인이라는 가설을 제시. 광\n학 현미경으로 근관 내 세균을 관찰한 후 근관의 치관부와 중간부 그리고 치근단부에 세균이 다\n르게 분포함을 보고.\nMoller: 세균에 의한 감염이 치근단 치주염의 발생에 얼마나 중요한지 보여줌. 치수를 인위적으로\n괴사시킨 후 한쪽 군은 세균감염을 시켰고 다른 군은 감염이 안 되게 한 후 치근단 조직의 반응\n을 관찰\nHunter: 내과의사로 많은 질병의 원인이 세균이라고 주장하며, 이러한 세균은 좋지 않은 구강 상\n태와 치과 치료에서 기원하는 경우가 많다고 주장. 소위 \"Focal infection theory\" 주장.","images":[]},{"id":"q060","number":60,"question":"치수혈류를 측정하는 방법?","choices":[{"label":1,"text":"EPT"},{"label":2,"text":"Cold"},{"label":3,"text":"Laser doppler flowmetry"},{"label":4,"text":"Hot"},{"label":5,"text":"Cavity test"}],"answer_raw":"3","explanation":"(근관치료학 p.141)\n치수 생활력 검사 시 한랭검사, 온열검사, 전기 치수검사, 와동형성 검사는 상아질을 직접 자극시\n키는 검사이며, 그 외 pulpal blood flow를 재는 방법 (laser doppler flowmetry, pulse oximetry,\ndual wavelength spectrophotometry등)이 있다.","images":[]},{"id":"q061","number":61,"question":"E.faecalis가 근관 내에서 지속적으로 존재할 수 있는 원인이 아닌 것은?","choices":[{"label":1,"text":"수산화칼슘에 저항성이 커서 pH 11.5까지 견딜 수 있다."},{"label":2,"text":"근관 내에서 다른 세균의 도움없이 혼자 생존할 수 있다."},{"label":3,"text":"치근주위조직에서 독립적으로 군락을 이루어 증식할 수 있다."},{"label":4,"text":"오랜 시간 영양분 없이 살 수 있다."},{"label":5,"text":"상아세관 깊숙이 존재할 수 있다."}],"answer_raw":"3","explanation":"(패쓰웨이 10판 p.625)\n3번은 치근 외 감염에 대한 설명","images":[]},{"id":"q062","number":62,"question":"세균의 리보솜 RNA를 이용하여 세균을 분석할 때 사용하는 것은?","choices":[{"label":1,"text":"5s 리보솜 RNA"},{"label":2,"text":"mRNA"},{"label":3,"text":"16s 리보솜 RNA"},{"label":4,"text":"tRNA"},{"label":5,"text":"23s 리보솜 RNA"}],"answer_raw":"3","explanation":"(패쓰웨이 10판 p.610 세균동정을 위한 방법)","images":[]},{"id":"q063","number":63,"question":"근관치료 시 러버댐 방습에 대해 옳지 않은 것은?","choices":[{"label":1,"text":"얇은 두께보다 잘 찢어지지 않고 연조직을 잘 밀어낼 수 있는 중간 두께의 러버댐이 좋\n다."},{"label":2,"text":"어두운 색상의 러버댐은 시각적으로 좋은 대조도를 보여 눈의 피로를 감소시킬 수 있다."},{"label":3,"text":"러버의 광택이 있는 면을 술자를 향하게 장착하면 눈부심과 눈의 피로를 감소시키고 대\n조를 향상시킬 수 있다."},{"label":4,"text":"플라스틱 프레임은 방사선 투과성이기 때문에 프레임을 완전히 제거하지 않아도 방사선\n촬영이 가능하다."},{"label":5,"text":"잔존치질이 얼마 없는 치아에서는 톱니 형태의 jaw를 가진 tiger 클램프가 유용하다."}],"answer_raw":"3","explanation":"(패스웨이 10판 p.122-124)\n광택이 없는 면","images":[]},{"id":"q064","number":64,"question":"치근 외 감염에 관련된 박테리아는?","choices":[{"label":1,"text":"Enterococus faecalis"},{"label":2,"text":"Treponema denticola"},{"label":3,"text":"Candida albicans"},{"label":4,"text":"Actinomycosis"},{"label":5,"text":"Porphyromonasgingivalis"}],"answer_raw":"4","explanation":"(패스웨이 10판 그림 15-30 (=Pathway 11판 fig.14-30))","images":["images/2022/q064_img1.jpeg"],"source_page":66},{"id":"q065","number":65,"question":"다음 중 근관 만곡 측정하는\nA.","choices":[],"answer_raw":"1","explanation":"(뉴저널2019년 1분기 두번\nsystemic and critical review)\n논문 사진 그대로 나왔습니다. 2\n63번 문제랑 동일합니다. Sc\n는 방법으로 Schneider 방법은?\n번째 , Measurements for measurement of roo\n2번은 Weine, 나머지는 정확히 뭐였는지 기억이\nchneider, Weine 제외하고 나머지는 중요도가 떨\nt canal curvature: a\n이 안나요. 2020년1차\n떨어져 보입니다.","images":["images/2022/q065_img1.jpeg","images/2022/q065_img2.jpeg","images/2022/q065_img3.jpeg"],"source_page":67},{"id":"q066","number":66,"question":"Fan의 C-shaped canal 분류","choices":[{"label":1,"text":"I"},{"label":2,"text":"II"},{"label":3,"text":"III"},{"label":4,"text":"IV"},{"label":5,"text":"V"}],"answer_raw":"2","explanation":"(Pathway 11판 201쪽)\nPathway 사진 그대로 나왔습니\n법에 따른 다음의 분류는?\n다","images":["images/2022/q066_img1.jpeg","images/2022/q066_img2.png"],"source_page":68},{"id":"q067","number":67,"question":"치근단 해부학에 관한 설명으로 옳지 않은 것은?","choices":[{"label":1,"text":"AC는 근첨부의 가장 좁은 부위이다."},{"label":2,"text":"AC는 AF에서 0.5mm에서 1.5mm가량 떨어져있다."},{"label":3,"text":"CDJ는 치수조직이 끝나고 치주조직이 시작되는 지점이다."},{"label":4,"text":"AC는 CDJ와 일치한다."},{"label":5,"text":"AC에서 AF로 갈수록 근관이 넓어진다."}],"answer_raw":"4","explanation":"(POP 10판 p.159)\nAC는 CDJ와 일치하지 않는다.","images":[]},{"id":"q068","number":68,"question":"방사선 사진에 대한 내용으로 옳은 것은?","choices":[{"label":1,"text":"근첨의 병소가 해면골을 파괴할 만큼 진행될 경우 방사선사진상에 나타난다."},{"label":2,"text":"방사선 사진상 골파괴가 나타나지 않아도 치근단 병소가 존재할 수 있다."},{"label":3,"text":"등각촬영은 치근단 병소 관찰에 용이하다."},{"label":4,"text":"Nielsen은 방사선 사진 해석 연구에서 관찰자 간(Inter examiner disagreement)에서 90%\n의 일치도를 보였다고 하였다."},{"label":5,"text":"Gelfand등은 관찰자 내(Intra examiner disagreement)검사 일치도가 90%라고 하였다."}],"answer_raw":"2","explanation":"(근관치료학 p.228-289)\n1) 해면골을 지나 피질골의 일부를 파괴할 만큼 진행되어야 필름상에 나타남\n2) 정답\n3) 평행촬영기법에서는 골파괴가 보여도 등각촬영에서는 보이지 않을 수 있음\n4) Inter examiner disagreement : 65~75%\n5) Intra examiner disagreement : 21.8%","images":[]},{"id":"q069","number":69,"question":"2003년 Siqueira의 논문 “Microbial causes of endodontic flare-ups”. Flare-up을 일으키는\nmicrobial mechanism으로 옳지 않은 것은?","choices":[{"label":1,"text":"감염된 잔사의 치근단 정출"},{"label":2,"text":"불충분한 근관 확대로 인한 미생물 환경의 변화"},{"label":3,"text":"내원간 이차 감염"},{"label":4,"text":"일회 근관치료"},{"label":5,"text":"산화-환원 potential의 증가"}],"answer_raw":"4","explanation":"(필독 논문 C-2-1-3)\nFlare-up을 일으키는 microbia mechanism\n1) apical extrusion of infected debris\n2) change in the endodontic microbiota and/or in environmental conditions\n3) secondary intra radicular infections\n4) Increase of the oxidation-reduction potential","images":[]},{"id":"q070","number":70,"question":"2019년 Abbott의 논문 “Diagnosis and Management of Transverse Root Fracture”. 다음 치근\n파절 중 골-결합조직에 의해 치유된 것은?\n②\n④","choices":[],"answer_raw":"4","explanation":"(근관 최신논문 19-4-1 Diagnosis and Management of Transverse Root Fracture)","images":["images/2022/q070_img1.jpeg","images/2022/q070_img2.jpeg","images/2022/q070_img3.jpeg","images/2022/q070_img4.jpeg"],"source_page":72},{"id":"q071","number":71,"question":"Andersson 등이 2012에 Dental Traumatology에 개제한 International ‘Association of Dental\nTraumatology guidelines for the management of traumatic dental injuries: 2. Avulsion of\npermanent teeth’에 따르면 외상 후 근관치료는 며칠 후에 치료해야 하는가?","choices":[{"label":1,"text":"2-3일"},{"label":2,"text":"7-10일"},{"label":3,"text":"2-3주"},{"label":4,"text":"4주"},{"label":5,"text":"2달"}],"answer_raw":"2","explanation":"(근관 필독 C-2-2-2)","images":[]},{"id":"q072","number":72,"question":"아래 사진의 하악 소구치 같이 치수 감염으로 인한 치근흡수와는 다른 감별이 필요한 질환의\n특징으로 옳지 않은 것은?","choices":[{"label":1,"text":"Pink spot이 관찰되기도 한다."},{"label":2,"text":"주변 골흡수로 골낭 같이 보이기도 한다."},{"label":3,"text":"외상이나 교정력으로 인해 발생할 수 있다."},{"label":4,"text":"치수 생활력 검사에서 (+)을 보인다."},{"label":5,"text":"근관치료로 진행을 막을 수 있다."}],"answer_raw":"5","explanation":"(POP 10판 5p.695~696)\n상피하방 치근 외흡수에 대한 문제였습니다.","images":["images/2022/q072_img1.jpeg"],"source_page":75},{"id":"q073","number":73,"question":"현미경 최종 배율을 결정하는 요인이 아닌 것은?","choices":[{"label":1,"text":"쌍안경 초점거리"},{"label":2,"text":"대물렌즈 초점"},{"label":3,"text":"광원 종류"},{"label":4,"text":"대안렌즈 배율"},{"label":5,"text":"배율변환부 인자"}],"answer_raw":"3","explanation":"(최신 근관치료학 p.257-258)","images":[]},{"id":"q074","number":74,"question":"근관 성형의 일반적인 사항으로 맞는것은?","choices":[{"label":1,"text":"근관의 특징, 형태 확인하기위해 처음 파일은 큰 것을 사용한다."},{"label":2,"text":"근단부 확대는 전동기구만 사용해야 한다. 근관장 길이는 짧아지나 파일이 쉽게 들어간\n다."},{"label":3,"text":"파일이 상아질에 꽉 끼어야 삭제가 된다. 파일이 꽉 끼게한 후에 삭제한다."},{"label":4,"text":"만곡 근관에서 직선화를 위해 과도한 삭제는 근단부 이형성을 초래한다."},{"label":5,"text":"치근 분지부에서의 과도한 기구사용은 분지부 하방의 zip perforation을 유발할 수 있다."}],"answer_raw":"4","explanation":"(최신 근관치료학 p.327, 좌측 문단에 만곡 근관의 지나친 확대는 이형성을 초래한다.)","images":[]},{"id":"q075","number":75,"question":"종창을 동반한 급성 치근단 농양의 치료방법으로 옳은 것은?","choices":[{"label":1,"text":"절개와 배농이 필수이다."},{"label":2,"text":"근관 내 배농이 이루어지지 않을 경우 apical trephination을 시도할 수 있다."},{"label":3,"text":"과량의 NaOCl을 사용한다."},{"label":4,"text":"10번 파일로만 근관 성형을 시행한다."},{"label":5,"text":"아목사실린을 필수로 처방한다."}],"answer_raw":"2","explanation":"(최신 근관치료학 p.211)\n1. 대부분의 경우 근관 내 배농이 가능하고 이 경우 종창 부위 파동성에 관계없이 추가적인 절개\n및 배농은 필요 없다.\n2. 근관 내로 배농되지 않을 경우 #10파일 같이 가는 파일로 근관장보다 2~3mm 정도를 넘겨 치\n근단조직을 자극하여 배농을 유도하기도 하는데 이를 ‘apical treprination’이라고 한다.\n3. 응급 처치 당일은 근관 내로 배농과 식염수로 근관 내를 세척한다.\n4. 최소 #25 파일 크기 정도 근관 형성을 시행한다.\n5. 적절한 배농이 이루어진다면，추가적인 항생제 처방은 불필요하다.","images":[]},{"id":"q076","number":76,"question":"Roane이 고안한 방법으로 만곡이 심한 근관에서 작용-반작용 법칙을 이용하여 삼각형 단면의\nk-file을 사용하여 근관을 성형하는 방법은 무엇인가?","choices":[{"label":1,"text":"Crown-down technique"},{"label":2,"text":"Step-back technique"},{"label":3,"text":"Step-down technique"},{"label":4,"text":"Balanced force technique"},{"label":5,"text":"Passivestep-backtechnique"}],"answer_raw":"4","explanation":"(최신 근관치료학 p.310)","images":[]},{"id":"q077","number":77,"question":"그림 1과 2는 나이타이 파일의 두가지 파절 양상의 단면을 나타내는 사진이다 그림 2의 파절\n양상에서 관찰할 수 있는 특징적인 소견이 아닌 것은?","choices":[{"label":1,"text":"concentric abrasion mark"},{"label":2,"text":"reverse winding"},{"label":3,"text":"fibrous dimple"},{"label":4,"text":"microvoid"},{"label":5,"text":"overload fast fracture zone"}],"answer_raw":"5","explanation":"(최신 근관치료학p.330)\n그림 1 cyclic fatigue fracture/ 그림 2 torsional fracture\n5번은 cyclic fatigue fracture 내용입니다.\n그림 1\n그림 2","images":["images/2022/q077_img1.jpeg","images/2022/q077_img2.jpeg"],"source_page":80},{"id":"q078","number":78,"question":"1회 내원(single-visit) 근관치료에 대한 설명으로 옳지 않은 것은?","choices":[{"label":1,"text":"생활력이 있는 경우 1회 내원 치료에 적합하다."},{"label":2,"text":"치료에 필요한 시간, 술식의 어려움 등을 고려하여 결정하여야 한다."},{"label":3,"text":"다회 내원(multi-visit)치료보다 성공률이 낮다."},{"label":4,"text":"술자의 임상적 능력 범위 내에서 신중하게 증례를 선택하여야 한다."},{"label":5,"text":"재치료의 경우 일반적으로 추천되지 않는다."}],"answer_raw":"3","explanation":"(최신 근관치료학p.156-157)\n성공률은 다회 내원과 차이가 없습니다.","images":[]},{"id":"q079","number":79,"question":"Niti-rotary instrument에 대한 설명으로 옳은 것은?","choices":[{"label":1,"text":"Helix angle은 연조직과 근관 벽에서 삭제되어 나온 상아질 조각 등을 모아 배출하는\n역할을 한다."},{"label":2,"text":"Flute의 효율은 깊이, 폭, 형태 및 표면의 마무리에 따라 결정된다."},{"label":3,"text":"Positive rake angle은 scraping action을 한다."},{"label":4,"text":"Radial land는 screw-in 현상을 증가시킨다."},{"label":5,"text":"Pitch가 작을수록 나선의 수는 더 적어지고 나선각도 커진다."}],"answer_raw":"2","explanation":"(최신 근관치료학 p.233-234)\n2번은 교과서 그대로 작성한 문장","images":[]},{"id":"q080","number":80,"question":"치근 천공의 처치에 대해 옳지 않은 것은?","choices":[{"label":1,"text":"치은변연 상방부의 치관부 천공의 경우 직접수복을 시행할 수 있다."},{"label":2,"text":"와동저 천공의 경우 근관입구에서 떨어져 있으면 복합레진 수복이 추천된다."},{"label":3,"text":"천공의 수복에는 calcium silicate cement과 같은 친수성 재료가 추천된다."},{"label":4,"text":"천공이 근관입구와 가까우면 paper point 등으로 막고 천공 수복을 시행한다."},{"label":5,"text":"치근단 부위에 천공이 존재할 때 calcium silicate cement으로 충전할 수 있다."}],"answer_raw":"2","explanation":"(최신 근관치료학 p.457-459)","images":[]},{"id":"q081","number":81,"question":"2013, M Haapasalo연구 “Evolution of nickel–titanium instruments: from past to future” 중 다\n음 사진과 관련된 내용 중 옳은 것은?","choices":[{"label":1,"text":"사진 A~C는 K3 file이다."},{"label":2,"text":"사진 D~F는 K3XFfile이다."},{"label":3,"text":"C에 나타나는 micropore는 M wire 이기 때문에 나타나는 특징이다."},{"label":4,"text":"Micropore가 crack으로 인한 파절을 방지해주는 역할을 한다"},{"label":5,"text":"A,B,D,E의 helix 방향으로 보아 reciprocation전용 파일임을 알 수 있다."}],"answer_raw":"4","explanation":"(필독 C 3-3-3)\n1,2 : Lateral-view scanning electron micrograph of a new K3XF (A–C) and K3 instrument (D–F). (C)\nHigh(사진 캡션) magnification view of the specimen showing voids on the surface of K3XF.\n3. K3XF는 R-phase wire\n4. Numerous micropores with various diameters can be seen on the surface of the instrument\nflute on K3XF instruments(Fig. 2). These small pores do not contribute to the failure, but serve as\na local stress/strain discontinuity from which the crack nucleates.\n5. 둘다 rotary instrument","images":["images/2022/q081_img1.png","images/2022/q081_img2.png"],"source_page":84},{"id":"q082","number":82,"question":"2006. Dunavant의 “Comparative evaluation of endodontic irrigants against Enterococcus\nfaecalis biofilms.” 연구에서 다음 중 E. faecalis에 가장 효과적인 소독제는?","choices":[{"label":1,"text":"1% NaOCl"},{"label":2,"text":"Smearclear"},{"label":3,"text":"2% CHX"},{"label":4,"text":"REDTA"},{"label":5,"text":"Biopure MTAD"}],"answer_raw":"1","explanation":"(필독 C 3-4-1 /기존 기출)","images":[]},{"id":"q083","number":83,"question":"2019년 OYS Lee가 발표한 Influence of apical preparation size and irrigation technique on root\ncanal debridement: a histological analysis of round and oval root canals의 일부이다. 맞는 설명은?\n되는 debris 양은 유사하다.\nextrusion 되는 debris 양이 적다.","choices":[{"label":1,"text":"Ultrasonic irrigation 시 apical size 를 #20까지 한 그룹과 #40까지 한 그룹의 extrusion"},{"label":2,"text":"Apical size #20으로 syringe irrigation시 apical size #20으로 ultrasonic irrigation 그룹보다"}],"answer_raw":"1","explanation":"(최신저널 ENDO 19-3-5)\n나머지 보기들은 보기 2번과 유사하게 두 그룹의 결과를 비교하는 문장이였고, 논문 내용 몰라도\n표 해석으로 풀 수 있는 문제로 출제되었습니다.","images":["images/2022/q083_img1.jpeg"],"source_page":86},{"id":"q084","number":84,"question":"Endoactivator의 세정방법은?","choices":[{"label":1,"text":"Negative apical pressure."},{"label":2,"text":"Syringe delivery"},{"label":3,"text":"Ultrasonic activated irrigation"},{"label":4,"text":"Sonic activated irrigation"},{"label":5,"text":"Manually activated irrigation"}],"answer_raw":"4","explanation":"(Pathway 10th 한글판 p.357)","images":[]},{"id":"q085","number":85,"question":"클로르헥시딘(CHX)에 대한 설명으로 옳지 않은 것은?","choices":[{"label":1,"text":"G(+), G(-)에 대해 모두 약효를 보이는 광범위한 항균효과를 보인다."},{"label":2,"text":"지속기간은 12주까지 지속된다."},{"label":3,"text":"Biofilm에 대해 NaOCl보다 그 효과가 약하다."},{"label":4,"text":"수산화칼슘과 같이 첩약시 그 향균 효과가 상승된다."},{"label":5,"text":"EDTA와 혼합시 색이 변하며, 침전물이 생겨 근관충전의 봉쇄가 저하된다."}],"answer_raw":"5","explanation":"(근관치료학 p.353)","images":[]},{"id":"q086","number":86,"question":"포스트에 대한 설명으로 옳은 것은?","choices":[{"label":1,"text":"포스트의 직경이 클수록 유지력이 좋아진다."},{"label":2,"text":"포스트의 길이가 길수록 응력이 잘 분산된다."},{"label":3,"text":"포스트 직경이 두꺼울수록 응력에 예방된다."},{"label":4,"text":"포스트 주변 잔존치질 2mm이상이어야 천공예방 등을 할 수 있다."},{"label":5,"text":"포스트 말단부와 치조골이 같아야 응력분산에 좋다."}],"answer_raw":"2","explanation":"(Pathway 10th p.844, 근관치료학 p.436)","images":[]},{"id":"q087","number":87,"question":"레진 실러의 특징으로 옳은 것은?","choices":[{"label":1,"text":"항세균효과가 있다."},{"label":2,"text":"수분을 흡수하여 치근에 결합하는 특징을 지닌다."},{"label":3,"text":"Ketac실러는 레진 실러에 해당한다."},{"label":4,"text":"AH plus는 AH-26과 달리 포름알데히드를 유리하는 성질이 없다."},{"label":5,"text":"생체친화적인 성질을 지닌다."}],"answer_raw":"4","explanation":"(Pathway 10판 p.286)","images":[]},{"id":"q088","number":88,"question":"3차원적으로는 잘 충전이 되었지만, 치근의 바깥으로 연장된 부분이 있는 경우를 의미하는 것\n은?","choices":[{"label":1,"text":"과연장(overextension)"},{"label":2,"text":"과충전(overfilled)"},{"label":3,"text":"저연장(underextension)"},{"label":4,"text":"저충전(underfilled)"},{"label":5,"text":"이물반응(foreign body reaction)"}],"answer_raw":"2","explanation":"(근관치료학 p.415)","images":[]},{"id":"q089","number":89,"question":"2011년 Song 등의 논문 “Analysis of the Cause of Failure in Nonsurgical Endodontic Treatment\nby Microscopic Inspection during Endodontic Microsurgery” 에 대한 내용으로 옳지 않은 것은?","choices":[{"label":1,"text":"치근단 수술시에 절제한 치근면을 현미경으로 관찰하여 평가하였다."},{"label":2,"text":"기구 파절과 같은 의원성 손상과 apical crack이 주요 실패원인이었다."},{"label":3,"text":"치아별로 주요 실패원인이 달랐다."},{"label":4,"text":"전치에서는 leaky canal이 주요 실패 원인이었다."},{"label":5,"text":"상악 소구치를 제외한 구치부에서는 missing canal이 주요 실패 원인이었다."}],"answer_raw":"2","explanation":"(필독 C 4-1-4)","images":[]},{"id":"q090","number":90,"question":"2020년 Daline 등의 논문 “3-year outcome of patients with persistent pain after root canal\ntreatment: the national dental practice-based research network” 에 대한 설명으로 옳은 것은?","choices":[{"label":1,"text":"근관치료 후 지속되는 통증에 대한 후향적 연구이다."},{"label":2,"text":"근관치료 후 지속되는 통증의 원인은 치성기원이다."},{"label":3,"text":"근관치료 후 지속되는 통증의 절반 이상은 아무런 처치없이 증상이 개선되었다."},{"label":4,"text":"근관치료 후 지속되는 통증의 개선은 없다."},{"label":5,"text":"근관치료 후 지속되는 만성통증의 강도는 중증도 이상이다."}],"answer_raw":"3","explanation":"(최신저널 ENDO20-2-5)","images":[]},{"id":"q091","number":91,"question":"2020년 Olivieri 등의 “Outcome and Survival of Endodontically Treated Cracked Posterior\nPermanent Teeth A Systematic Review and Meta-analysis” 논문에 따르면 다음 중 옳은 것은?","choices":[{"label":1,"text":"전향적 연구이다."},{"label":2,"text":"1년 생존률이 성공률보다 낮다"},{"label":3,"text":"술 전 Vital pulp인 치아가 예후가 더 좋다."},{"label":4,"text":"크랙과 연관된 치주낭이 예후를 예측하는 요소이다."},{"label":5,"text":"장기적인 예후를 고려했을 때 근관치료는 적절하지 않은 치료이다."}],"answer_raw":"4","explanation":"(최신 E 20-2-3)\nResult: periodontal pocket 만 유의한 영향,발치 11% 증가.","images":[]},{"id":"q092","number":92,"question":"치근단 수술의 마취에 대한 설명으로 옳은 것은?","choices":[{"label":1,"text":"혈관지혈제가 포함되지 않은 국소마취제가 추천된다."},{"label":2,"text":"비외과적 근관치료와 달리 지혈 효과도 기대한다."},{"label":3,"text":"1:20만 epinephrine를 포함하는 long acting 마취를 사용한다."},{"label":4,"text":"해당 치아의 순/협측 국소마취로 충분하다."},{"label":5,"text":"마취가 풀리는 경우,추가적인 침윤마취로 효과를 볼 수 있다."}],"answer_raw":"2","explanation":"(pathway 한글판 10. p794)\n치근단 수술에서 국소마취는 단순히 국소마취뿐만 아니라 국소 지혈의 필요성에서 비외과적 근관\n치료에서의 국소마취와는 차이를 둔다.","images":[]},{"id":"q093","number":93,"question":"미세 치근단 수술은 기존의 수술(conventional surgery)보다 임상적으로 우수한 부분에 해당하\n지 않는 것은?","choices":[{"label":1,"text":"고배율 현미경 사용"},{"label":2,"text":"골 와동 크기가 작아졌다"},{"label":3,"text":"치근단 절제 각도(bevel angle)가 커졌다"},{"label":4,"text":"bur 대신 초음파기구로 retropreparation시행"},{"label":5,"text":"MTA, IRM, super EBA와 같은 생체 적합성 재료로 root end filling 시행"}],"answer_raw":"3","explanation":"(근관치료학 p.525~527)\n3번 (X) : 과거에는 술자가 잘 볼 수 있도록 치근단 절제 시 약 45의 bevel을 주었다. 하지만\nbevel angle이 클수록 apical leakage가 증가하게 된다. 미세 치근단 수술에서는 현미경과 초음파\n기구의 사용으로 bevel이 필요 없어지고, 있더라도 0~10정도의 bevel만으로 충분하다.\n나머지 보기들은 교과서와 문장이 완벽하게 일치하지는 않지만 올바른 내용입니다.","images":[]},{"id":"q094","number":94,"question":"2019년 Almutairi는 J Endod에 개제된 “Regenerative endodontics a systematic analysis of the\nfailed case”에서 regenerative endodontic treatment의 실패한 증례 중에서 가장 비중이 높은 원인\n(etiology)에 해당하는 것은?","choices":[{"label":1,"text":"외상 (dental trauma)"},{"label":2,"text":"치외치(dens evaginatus)"},{"label":3,"text":"치내치(dens invaginatus)"},{"label":4,"text":"우식 (dental caries)"},{"label":5,"text":"의원성 손상"}],"answer_raw":"1","explanation":"(최신 저널 근관 2019-2-1 논문상 p.570)\n37개의 실패한 RET 증례에 대해서 etiology를 기술했다.\n원인은 dental trauma (22개, 59%), dens evaginatus (11개, 30%), dental caries (3개, 8%) 였다.\n(논문 원문) 37 failed RET cases reported the etiology resulting in the initiation\nof RET. A total of 22 (59%) of these cases were caused by dental trauma,\n11 (30%) were caused by dens evaginatus, and 3 (8%) by dental caries.","images":[]},{"id":"q095","number":95,"question":"Song 2013에서 제시한 예후에 영향을 미치는 요인은?","choices":[{"label":1,"text":"A – marginal bone loss"},{"label":2,"text":"B – height of buccal bone plate"},{"label":3,"text":"C – width of bony crypt"},{"label":4,"text":"D - height of bony crypt"},{"label":5,"text":"E – depth of bony crypt"}],"answer_raw":"2","explanation":"(최신 근관치료학 p.540-541)\n2013년 본 연구팀의 연구에서는 골와의 가로, 세로, 깊이 등은 술 후 예후에 영향을 미치지 않았\n으며 남아 있는 협측골의 길이가 예후에 영향을 미치는 인자로 밝혀졌다.","images":["images/2022/q095_img1.jpeg"],"source_page":98},{"id":"q096","number":96,"question":"자가치아이식술 중 two stage replantation에 대한 설명으로 옳지 않은 것은?","choices":[{"label":1,"text":"Andreasen 등은 치수조직의 재생은 미완성 및 완성치근에서 각각 96% 및 15%를 나타\n내 치수의 재생은 치근의 미완성도와 밀접한 관계가 있음을 보였다."},{"label":2,"text":"Tsukiboshi는 발치와에서 생존율은 100%, 비발치와에서는 71%로 피이식골 치주인대의\n중요성을 보고하였다."},{"label":3,"text":"Two-stage operation technique은 발치 후 약 2달 정도를 기다려 치유가 충분히 된 후\n골와동을 다시 형성하여 공여치를 삽입하는 술식이다."},{"label":4,"text":"Nethander는 구강 외 시간의 지연이나 수술 후 혈액 공급 등 한번에 수술할 때 발생되\n는 문제를 해결하고자 two-stage operation technique을 소개하였다."},{"label":5,"text":"Gault 등은 이식 전 치주인대의 적절한 자극이 성공에 도움이 된다고 주장하였다.."}],"answer_raw":"3","explanation":"(최신 근관치료학 p.551-552)\nTwo-stage operation은 골와동을 먼저 형성하고 약 2주일 정도를 기다려 골와동 형성 부위가 육\n아조직에 의해 어느 정도 치유되도록 유도한다. 그 후 골와동 내 육아조직을 가볍게 제거하고 공\n여치를 마치 꽃꽂이하듯이 와동 내에 삽입한다.\n=>2달(X) -> 2주(O)\n(보기 순서는 정확하지 않지만 사람 이름과 그에 해당하는 교과서 내용이었습니다)","images":[]},{"id":"q097","number":97,"question":"근관치료 후 수복 시, 포스트 유무에 따른 치아 파절 저항과 파절 양상에 대해 옳은 것은?","choices":[{"label":1,"text":"주조 포스트로 수복 된 치아는 파절 시 수리가 가능한 파절 양상이 보인다."},{"label":2,"text":"Fiber 포스트로 수복 된 치아는 파절 시 치근의 cervical 1/3 또는 코어에서 파절이 일어난다."},{"label":3,"text":"치관부의 상아질이 충분하지 않으면 주조포스트를 사용할 수 없다."},{"label":4,"text":"많은 치질이 손상되거나 치근에 overflaring이 있는 경우 Fiber post와 레진 코어가 추천된다."},{"label":5,"text":"치아의 기능 시 굴곡이 안되는 포스트가 stress 분산에 좋고 파절이 적다."}],"answer_raw":"2","explanation":"(근관치료학 p448)\n해설) Fiber post로 수복된 치아는 수리 가능한 파절 양상을 보였으며(①), 주로 치근의 cervical\n1/3 부위 혹은 core에서 파절이 일어난다(②).\n치관부 상아질이 충분이 남아있는 경우 fiber post를 사용할 수 있으며(③) 치질이 중등도에서 고\n도로 소실된 경우에는 주조 포스트를 사용해야 한다.(④)\n이론적으로는 기능 동안 치아와 같이 굴곡 되는 포스트가 stress 분산에 더 좋고 파절이 적지\n만,,,(⑤)","images":[]},{"id":"q098","number":98,"question":"포스트 제거에 이용하는 기","choices":[{"label":1,"text":"Ruddle post removal"},{"label":2,"text":"Thomas post removal"},{"label":3,"text":"Masserann kit"},{"label":4,"text":"Eggler post removal"},{"label":5,"text":"JS post extractor"}],"answer_raw":"1","explanation":"( Pathway of the pulp 한\n구는 무엇?\n한글판 p973 )","images":["images/2022/q098_img1.jpeg"],"source_page":101},{"id":"q099","number":99,"question":"2019년 Bjorndal 에 의한 Int Endod J에 개재된 논문 “Management of deep caries and the\nexposed pulp”에 대한 내용으로 옳은 것은?","choices":[{"label":1,"text":"Aguilar & Linsuwanont 에 의한 논문에 의하면 생활치수치료의 성공률은 70% 이하이다."},{"label":2,"text":"초기 실패의 증상은 비가역적 치수염인 경우가 많다."},{"label":3,"text":"초기 실패의 원인은 수복 실패로 인한 이차감염인 경우가 많다."},{"label":4,"text":"후기 실패 시 생활치수치료에 사용했던 재료의 영향으로 치근단병소는 생기지 않는다."},{"label":5,"text":"후기 실패의 원인에는 잘못된 치수 진단인 경우가 많다."}],"answer_raw":"2","explanation":"(최신저널 2019-3-1)","images":[]},{"id":"q100","number":100,"question":"다음 중 노인 환자의 근관치료 시 고려사항으로 옳지 않은 것은?","choices":[{"label":1,"text":"노인환자의 내원이나 진료실 내 이동에서 도움이 필요한 경우 1회 근관치료법을 고려할 수 있\n다."},{"label":2,"text":"보철물이나 기구의 삼킴을 예방하기 위해 러버댐을 사용하는 것이 좋다."},{"label":3,"text":"노인환자의 근관치료 시 전달마취는 잘 이루어지지 않으며 치주인대 마취 및 치수 내 마취하\n기가 용이하다."},{"label":4,"text":"노인 환자의 경우 근관와동 형성과 근관 입구 위치를 찾기 위해 현미경을 사용하는 것이 좋다."},{"label":5,"text":"노인환자의 치유 속도는 젊은 환자에 비해서 느리지만 예후는 젊은 환자와 같이 잘 치유된다."}],"answer_raw":"3","explanation":"( Pathway of the pulp 한글판 p940, 근관치료학 p.699~700 )\n노인 환자에서는 치수강 내의 석회화가 심하여 치수강 내 공간이 거의 없어 치수 내 주사를 하기\n어렵다.","images":[]}]},"2023":{"year":2023,"title":"2023 치과보존과 전문의시험 1차","questions":[{"id":"q001","number":1,"question":"다음 그림에 대한 설명으로 옳지 않은 것은?","choices":[{"label":1,"text":"(1)은 감염 상아질은 세균에 의해 상아질의 유기 성분이 대부분 용해되고 무기질이 완전히\n소실된 영역이다."},{"label":2,"text":"(2)는 탈회 상아질 역시 세균이 침입해 있는 부위로 탈회로 인해 무기질이 거의 남아 있지 않다."},{"label":3,"text":"(3)은 투명 상아질은 상아 세관 내부에 유기질이 침착되어 광학 현미경 상으로 투명하게\n보이는 부분이다."},{"label":4,"text":"(4)는 정상 상아질로서 우식의 영향을 받지 않은 부분이다."},{"label":5,"text":"(5)는 재생 상아질은 우식에 의한 자극에 대해 방어작용으로 치수강에 인접하여 형성된다."}],"answer_raw":"3","explanation":"(치과보존학 p.35)\n3) (x) 유기질 -> 무기질","images":["images/2023/q001_img1.jpeg"],"source_page":1},{"id":"q002","number":2,"question":"다음 중 옳은 것을 고르시오.","choices":[{"label":1,"text":"교정력은 치수 혈류를 감소시킨다."},{"lab jection: a physiological explanation of its efficacy.에서의 ligamental\ninjection에서 진행한 실험 결과에 대한 설명 중 옳은 것은?","choices":[{"label":1,"text":"Ligamental injection 주입 시에는 needle의 사면이 치근 방향을 향해야 한다."},{"label":2,"text":"마취액에 혈관수축제가 포함되어 있지 않아도 효과적으로 마취가 일어난다."},{"label":3,"text":"통증의 원인치를 식별하는 데 사용할 수 있다."},{"label":4,"text":"생활치수를 가진 치아에서 수복 치료를 할 때의 마취 방법으로 사용할 수 있다."},{"label":5,"text":"2% lidocaine with 1:100,000 Epi.과 같은 농도의 Saline with Epi.을 사용했을 때, PBF 감소\n양상이 비슷했다."}],"answer_raw":"5","explanation":"(필독 A-2-3-2)\n1) 치조골 방향을 향하도록 한다.\n2) 압력만으로 마취되는 것이 아니며 마취제에는 혈관수축제가 포함되어 있어야 한다.\n3) 단일치아의 마취가 불가능하기 때문에 원인치의 진단에는 심각한 한계가 있다.\n4) 20분이상 혈류(PBF)를 완전히 정지시켜 치수 괴사 가능성이 있어 자연치에는 적용하지\n않도록 함.\n5) 정답 :논문의 그림 중에는 없지만 본문 내용(혈류측정한 실험 중 하나)에 그대로 나와있는\n결과였습니다./ ‘Fig 9&10.에서 Saline (with no epi.) 치주인대 내 주입 시 혈류변화 없음’과는\n상관없음.","images":[]},{"id":"q007","number":7,"question":"타액 자체가 가지는 직접적인 항세균 작용을 하는 타액 내 효소가 아닌 것은?","choices":[{"label":1,"text":"Mucin"},{"label":2,"text":"Agglutinin"},{"label":3,"text":"Lactoferrin"},{"label":4,"text":"Lysozyme"},{"label":5,"text":"Lactoperoxidase"}],"answer_raw":"1","explanation":"(근관치료학 p.30)","images":[]},{"id":"q008","number":8,"question":"2013년 Pretty의 J.dent. ‘The caries continuum: Opportunities to detect, treat and monitor the re-\nmineralization of early caries lesions. 치아 우식의 분류 및 평가 방법에서 ICDAS, Fiber Optic Trans-\nillumination (FOTI), Electrical Caries Monitor(ECM)에 대한 설명으로 옳지 않은 것은?","choices":[{"label":1,"text":"ICDAS는 치면을 dry & clean 후 stage에 따라 우식을 분류하였다."},{"label":2,"text":"FOTI는 증가된 porosity를 빛의 분산, 흡수 등을 통해서 발생하는 drak patch로 우식을\n확인한다."},{"label":3,"text":"Diagnodent는 시진보다 false-positive가 높다."},{"label":4,"text":"Diagnodent는 655nm(red-light)의 light illumination을 평가하여 우식과 altered tooth\nsubstance를 감별한다."},{"label":5,"text":"ECM는 객관성, 민감도는 높으나 재현성은 떨어져서 우식의 진행과정 등 평가를 위한 clinical\ntrial에는 적합하지 않다."}],"answer_raw":"5","explanation":"(A-3-4-1)\nECM은 높은 민감도, 재현성을 보이는 것으로 나타났고 우식을 모니터링하는 실용적이고 객관적이며\n민감한 방법이다.","images":[]},{"id":"  경우 결합강도에는 영향을 미치지 않는 것으로 보고되고 있다.","images":[]},{"id":"q045","number":45,"question":"다음 중 레진 시멘트에 대한 설명으로 옳은 것은 ?","choices":[{"label":1,"text":"이중중합형 레진시멘트는 광중합만 해도 항상 일정한 최대 경도를 얻을 수 있다."},{"label":2,"text":"4-META를 포함한 접착형 레진시멘트는 상아질과 금속수복물에 접착강도가 좋으나, 모노머의\n길이가 짧아서 연성이 좋지 않아 충격을 잘 흡수하지 못한다."},{"label":3,"text":"MDP를 포함한 접착형 레진 시멘트는 MDP의 phospho ester 그룹과 지르코니아의 hydroxyl\n기의 화학적 결합을 기대할 수 있다."},{"label":4,"text":"이중중합형 레진 시멘트는 두 개의 연고형태로 제공되는데 일반적으로 photoinitiator와\nbenzoyl peroxide가 같은 튜브에 들어있다."},{"label":5,"text":"1-step self -etch system을 사용할 경우 adhesive layer의 외곽층에 존재하는 acidic\nmonomer와 레진시멘트의 tertiary amine의 peroxide가 결합을 하여 산-염기 반응을\n추가적으로 일으켜 결합에 도움이 된다."}],"answer_raw":"3","explanation":"(치과보존수복학 p.487-488)\n1) (X) 비록 이중중합형 레진 시멘트가 광중합이나 화학중합만으로도 중합이 되도록 의도되었으나\n광중합 여부에 따라 그리고 이중중합형 레진 시멘트의 중합개시제에 따라 레진 시멘트의 경도가\n달라진다.\n2) (X) 4-META를 포함한 접착형 레진 시멘트는 상아질과 금속수복물에 접착강도가 크며 길고 유연한\n고분자 사슬을 가지고 있어 연성이 좋으며 충격을 흡수하는 경향이 있다.\n3) (O)\n4) (X) 이중중합형 레진 시멘트는 두 개의 연고형태로 제공되는데 일반적으로 photoinitater와 benzoyl\nperoxide가 서로 분리되어 있다.\n5) (X) 1-step self -etch system을 사용할 경우 adhesive layer의 외곽층에 존재하는 acidic monomer와\n레진시멘트의 tertiary amine의 peroxide가 결합을 하여 산-염기 반응을 일으키기 때문에 중합과정이\n방해받게 된다.","images":[]},{"id":"q046","number":46,"question":"다음 중 간접심미수복재에 대한 알맞은 접착 전 기계적, 화학적 처리 방법의 조합으로 옳은 것은?","choices":[{"label":1,"text":"Composite : HF, silane"},{"label":2,"text":"Composite : sandblasting, dentin primer"},{"label":3,"text":"Ceramic : sandblasting, silane"},{"label":4,"text":"Ceramic : HF, dentin primer"},{"label":5,"text":"Zirconia : sandblasting, zirconia primer"}],"answer_raw":"3","explanation":"? 5번? (치과보존수복학 p.410 [표18-3])\n-\n문제에서 dentin primer 였는지 composite primer였는지 확실치 않습니다.\n-\n교과서 표에 의하면 composite 은 sandblasting + silane or composite primer, zirconia는\n특수sandblast + zirconia 전용 primer 라고 제시되어 있습니다.","images":[]},{"id":"q047","number":47,"question":"Curing efficiency of four self-etching, self-adhesive resin cements 논문 결과에서 다음 그래프와\n재료가 알맞게 짝지어진 것은?","choices":[ 복하기 위해서 붉은 색을 응시하면 도움이 된다."},{"label":4,"text":"치아의 치태와 색소를 퍼미스로 깨끗이 하고 치아를 건조시킨 다음 색조를 선택한다."},{"label":5,"text":"일치하는 색조가 없을 때는 밝고 옅은 색조를 선택하는 것이 유리하다."}],"answer_raw":"5","explanation":"(치과보존학 4판 346-347pg)\n1) 어두운 구강은 치아를 밝게 보이게 한다\n2) 치아 색조는 첫인상이 매우 중요하며……. 최소 0.06초~0.07초 관찰하되 5초를 넘기지 않는다.\n긴 시간 관찰하면 색순응으로 인해서 착시가 유발된다\n3) 파란색을 응시하면 회복에 도움이 된다\n4) 건조된 상태에서 결정해서는 안된다\n5) 맞는 보기","images":[]},{"id":"q052","number":52,"question":"다음 설명의 괄호에 들어갈 말은?\n“ (\n)는 색의 포화도를 의미하며 강렬한 색과 약한 색을 구분하는 용어이다.”\n“ ( )의 감소를 통해서 치료효과를 얻는 대표적인 예로 표백술이 있다.”","choices":[{"label":1,"text":"색상"},{"label":2,"text":"명도"},{"label":3,"text":"채도"},{"label":4,"text":"질감"},{"label":5,"text":"대비"}],"answer_raw":"3","explanation":"(치과보존학 4판 292pg)","images":[]},{"id":"q053","number":53,"question":"다음 중 옳지 않은 것은?","choices":[{"label":1,"text":"빨간색 핵사메딘을 장시간 사용하면 치아가 암갈색으로 착색될 수 있다."},{"label":2,"text":"커피는 갈색의 착색을 유발할 수 있다."},{"label":3,"text":"외인성 변색은 미백의 예후가 좋다."},{"label":4,"text":"내인성 변색은 전신적인 원인에 의해서만 치아의 내면 구조가 변색되어 나타난다."},{"label":5,"text":"평이한 지문"}],"answer_raw":"4","explanation":"(치과보존학 pg 493) - 보기 순서는 정확히 기억이 안 납니다 ㅠ\n1) O 헥사메딘의 주성분이 클로르헥시딘 (보존학 교과서: 클로르헥시딘 같은 구강청결제도\n장기간 사용하면 암갈색양 변색을 야기한다)\n2) O\n3) O\n4) X 내인성 변색은 외인성처럼 그리 단순하지는 않으며 전신적 또는 국소적 원인에 의해 치아의\n내면 구조가 변색되어 나타난다.-> 내인성변색은 국소적 원인에 의해서도 일어나기때문에\n4번은 틀린 보기\n5) O","images":[]},{"id":"q054","number":54,"question":"다음 색상의 관계 설명 중 옳지 않은 것은?","choices":[{"label":1,"text":"색순응: 광원의 에너지 분포가 변하면 물체에서 반사 또는 투과해 오는 빛의 스펙트럼 분포도\n변화해서 물체의 색이 달라보인다."},{"label":2,"text":"면적대비: 면적이 클수록 밝고 선명해 보이고 면적이 좁을수록 어둡고 탁해 보인다."},{"label":3,"text":"시감도: 같은 파장의 색일지라도 항상 같은 밝기로 느껴지지 않는다."},{"label":4,"text":"색상의 관계에 대한 설명중 하나였습니다.."},{"label":5,"text":"명암순응: 물체의 밝기는 그보다 어두운 배경에서는 보다 밝게 보이고, 그보다 밝은\n배경에서는 보다 어둡게 보인다."}],"answer_raw":"5","explanation":"(치과보존학 pg 293)\n5) 보기는 명암대비의 설명\n-\n명암순응: 빛의 밝기에 대한 순응을 뜻하며, 이는 동공의 크기조절과 망막의 감광성의 조절에\n의해 이루어진다. 예를 들면 한낮에 어두운 영화관에 들어가면 처음에는 아무것도 보이지\n않다가 서서히 어두움에 익숙해지게 된다.","images":[]},{"id":"q055","number":55,"question":"2012 beier의 clinical performance of all ceramic inlay and onlay restorations in posterior teeth에서\n옳지 않은 것은??","choices":[{"label":1,"text":"Nonvital tooth인 치아는 수복물의 성공률을 유의하게 낮추는 요소이다"},{"label":2,"text":"Bruxism은 수복물의 성공률에 유의한 요소가 아니다"},{"label":3,"text":"전체 failure 중 절반이 dentin bonding 하지 않은 케이스였다"},{"label":4,"text":"전체 failure 중 fracture of tooth가 가장 많았다"},{"label":5,"text":"All ceramic inlay / onlay의 10년 estimated success rate는 90% 이상이었다"}],"answer_raw":"4","explanation":"(클래식저널 B-10-1-4)\n1. 본 연구의 유일한 유의성 있는 요소는 vital vs non vital\n2. 1번 설명\n3. 51.1%가 no dentin bonding case\n4. Ceramic fracture가 가장 많음 틀린 보기\n5. 92.4%정도로 높은 성공률","images":[]},{"id":"q056","number":56,"question":"2020 Lee의 clinical outcomes after Apical surgery on the palatal root of the maxillary first molar\nusing palatal approach에서 옳은 것은??","choices":[{"label":1,"text":"상악대구치의 구개측 치근의 치근단수술을 구개접근한 경우와 협측 접근한 경우를 비교한\n연구이다."},{"label":2,"text":"상악대구치의 구개측 치근의 치근단수술 시 구개측접근한 경우의 예후를 전향적으로 평가한\n연구이다."},{"label":3,"text":"상악대구치의 구개측 치근의 치근단수술 시 구개측 접근하는 것은 성공률을 저해하는\n요소이다."},{"label":4,"text":"상악대구치의 구개측 치근의 치근단 수술 시 구개측 접근하는 것은 신경 혈관 손상의 위험성이\n적다."},{"label":5,"text":"Cotton swab test는 수술부위 점막을 cotton swab 했을 때 통증을 반대측 정상점막과 비교하여\n0-10까지 숫자를 기록하여 평가하는 신경검사법이다."}],"answer_raw":"4","explanation":"(뉴저널 Endo 20-2-1)\n1. 구개측으로 접근한 수술을 대상으로만 연구진행\n2. 2010년부터 2017년까지 수술받은 환자를 대상으로 진행한 후향적 연구\n3. 생존률은 91.5%로 다른 치아들과 차이 없음\n4. 신경 및 혈관손상을 예지성 있게 피할 수 있으며 본 연구에서도 신경 및 혈관손상 케이스는\n보이지않았음\n5. 양쪽 palate를 cotton으로 문질러봐서 감각을 비교하는것은 맞으나 hyper, hypo, normal\n세단계로 구분하는 방법","images":[]},{"id":"q057","number":57,"question":"Portenier(2005), The susceptibility of starved, stationary phase, and growing cells of Enterococcus\nfaecalis to endodontic medicaments에서, E. faecalis에 대한 설명으로 옳은 것은?","choices":[{"label":1,"text":"Growth phase에서 세균 독성이 가장 높게 나타났다."},{"label":2,"text":"Starvation phase 에서 약제 내성이 가장 높게 나타났다."},{"label":3,"text":"Alkaline-adapted cells는 bile salt에 더욱 suspectible 하다."},{"label":4,"text":"수산화칼슘에 대한 저항성은 stress-induced protein에 의한 것이다."},{"label":5,"text":"Growth phase에서 stationary phase에서 보다 약제 내성이 높다."}],"answer_raw":"2","explanation":"(클래식 C-1-1-2)\n1. Cells in the exponential growth phase were the most sensitive to all three medicaments and\nwere killed between 3 s and 10 min.\n2. Cells in starvation phase were the most resistant and were not totally eliminated by the\nmedicaments during the 10-min test period.\n3. It has been shown that alkaline-adapted cells develop a high resistance against bile salts.\n4. Stress-induced protein synthesis in itself does not provide for the survival of E. faecalis in\ncalcium hydroxide.\n5. Cells in the exponential growth phase were the most sensitive to all three medicaments and\nwere killed between 3 s and 10 min. Cells in stationary phase were more resistant and living cells\ncould be recovered at 10 min.","images":[]},{"id":"q058","number":58,"question":"CBCT 촬영 시 방사선 노출량을 증가시키는 인자가 아닌 것은?","choices":[{"label":1,"text":"높은 mA"},{"label":2,"text":"높은 kV"},{"label":3,"text":"큰 voxel size"},{"label":4,"text":"넓은 field of view"},{"label":5,"text":"긴 exposure time"}],"answer_raw":"3","explanation":"","images":[]},{"id":"q059","number":59,"question":"다음중 괄호 안에 들어갈 말은?\nNon Vital Bleaching 위한 base 형성시 attachment가 ( ) 에서 높기 때문에\nbobsleigh형태로 만들어준다?","choices":[],"answer_raw":"인접면","explanation":"인접면","images":["images/2023/q059_img1.jpeg"],"source_page":31,"answer_only":true,"answer_display":"인접면"},{"id":"q060","number":60,"question":"Liu et al. (2021) EDTA promotes the mineralization of dental pulp in vitro and in vivo에 대한 설명\n중 옳지 않은 문장은? (뉴저널 2021-1-1)","choices":[{"label":1,"text":"12% EDTA로 전처리한 군에서 reparative dentin이 더 잘 형성되었다."},{"label":2,"text":"MTA 적용 전 EDTA 처리한 군에서 Tunnel defect가 많이 생겼다."},{"label":3,"text":"EDTA-treated dentin은 dental pulp stem cell의 분화, 증식을 촉진한다."},{"label":4,"text":"Dental pulp cell의 분화는 ERK 1/2 signaling pathway에 의해 증진되고 Smad 2/3 signaling\npathway에 의해 억제된다."},{"label":5,"text":"mechanical pu "text":"Dentinal crack에 의해 상아세관 노출시 상아세관액의 inward flow가 일어난다."},{"label":4,"text":"Dentinal crack에 의해 상아세관 노출시 상아세관 내 단백질이 응고(coagulation)된다."},{"label":5,"text":"상아세관 내 단백질 응고로 투과성이 감소하는 현상은 2일 이내 일어난다."}],"answer_raw":"3","explanation":"(inward -> outward)\nPathway 10th edition (한글판) p.560\nPathway 12th edition (영문판) p.578\n1,2 ) 상아세관액은 섬유소나 혈장 알부민 같은 단백질을 포함하고 있으며\n3) 상아세관이 완전치 노출될 때 상대적으로 높은 치수조직압에 의해 상아세관액의 외측 유동이\n일어난다.\n4) 상아세관액은 섬유소나 혈장 알부민 같은 단백질을 포함하고 있으며, 이들은 응고되어 효과적으로\n상아세관 내강을 막을 수 있다.\n5) 따라서 액의 출구를 제한시킴으로써 결과적으로 상아질지각과민증을 줄일 수 있다. 이 현상은 2일\n이내에 발생할 수 있다.","images":[]},{"id":"q071","number":71,"question":"2021년 Bhatt et al의 “Clinical decision making and importance of the AAE/AAOMR position\nstatement for CBCT examination in endodontic cases” 에서 치근단 방사선 사진보다 CBCT로 더 잘\n관찰할 수 있는 것으로 옳지 않은 것은?","choices":[{"label":1,"text":"calcified canal"},{"label":2,"text":"periapical lesions"},{"label":3,"text":"complex root anatomy"},{"label":4,"text":"missed canals"},{"label":5,"text":"vertical root fracture"}],"answer_raw":"1","explanation":"(뉴저널 21-1-5) Conclusion : 치근단방사선에 비해 CBCT는 치근단 병변, 놓친 근관, 치근파절, 복잡한\n해부학을 더 잘 드러냄.\nDiscussion: 본연구에서 CBCT는 치근흡수나 석회화근관을 진단하는데서는 유의하지않음.","images":[]},{"id":"q072","number":72,"question":"Nonodontogenic toothache에 대한 설명으로 옳지 않은 것은?","choices":[{"label":1,"text":"상악동에 의한 nonodontogenic toothache일 경우 타진에 양성일 수 있다."},{"label":2,"text":"temporalis m. 에 의한 연관통은 상악 대구치에 나타날 수 있다."},{"label":3,"text":"myofacial pain일 경우 주로 masseter muscle에 기인한다"},{"label":4,"text":"Myofascial pain의 경우 통증을 악화시키는 요인은 발통점이 있는 근육의 운동이다?"},{"label":5,"text":"neurovascular pain일 경우 머리를 앞으로 숙일 경우 통증이 증가한다."}],"answer_raw":"","explanation":"? POP 10판\n1) p61 상악동/비점막 동통은 상악동 점막 부위를 타진할 때분만 아니라 여러 개의 상악 치아를\n타진했을 때도 나타낼 것이다.\n2) ?\n3) p60-61 Myofacial pain은 과흥분된 근육조직의 작은 병소에서부터 나온다~ 전형적으로 치아에\n동통을 전이하는 근육은 교근, 측두근, 외측익돌근이다.\n4) ?\n5) 못찾겠습니다ㅠ\n***5번이 옳지 않은 보기인 것 같습니다. Neurovascualr pain이 아니고, sinus or nasal mucosal origin에\n의한 비치성 치통(Nonodontogenic toothache of sinus or nasal mucosal origin)에 대한\n설명입니다. 상악동염에 의해서 머리 위치가 변화했을때 동통 증가하는 head dip test 양성반응을 볼 수\n있다고 한다고 하네요 (근거: Dental pulp 2판 p.455 Nonodontogenic toothache of sinus or nasal\nmucosal origin)\n## 5번 내용 Pathway 11판 p.691에도 있어요!\nMusculoskeletal and Somatic pain>pain of sinus or nasal mucosal origin 단락에\n“... Other symptoms of sinus disease include sensitivity to palpation of structures overlying sinuses\n(i.e., paranasal tenderness) and a throbbing or increased pain sensation when the head is placed\nlower than the heart.”","images":[]},{"id":"q073","number":73,"question":"다음 중 옳지 않은 것을 고르시오.","choices":[{"label":1,"text":"항생제는 보통 5~7일간 처방한다."},{"label":2,"text":"Erythromycin은 anaerobe bacteria에 탁월한 효과를 보인다."},{"label":3,"text":"Clindamycin은 Gram(+), anaerobe bacteria에 효과적이다."},{"label":4,"text":"Amoxicillin은 효과범위가 넓고 반감기가 길어서 예방적 항생제에 일차적으로 사용된다."},{"label":5,"text":"Amoxicillin에 clavulanic acid를 같이 쓰면 β-lactamase에 비가역적으로 작용하여\n항생제의 가수분해를 막는다."}],"answer_raw":"2","explanation":"(근관치료학 p.121-122)\n1) O, 교과서에 나와있지 않지만 일반적으로 맞습니다.\n2) X, Erythromycin은 Macrolide계열로, Macrolide는 혐기성 세균에 효과가 없다.\n3) O,Clindamycin은 그람 양성 호기성 세균과 양성 및 음성 혐기성 세균에 모두 효과적이다.\n4) O, 교과서 내용 그대로 있습니다.\n5) O, 아목시실린은 β-lactam핵을 가진 항생제인데, 일부 세균은 β-lactamase를 분비해서 항생제를\n가수분해한다. 이 경우 아목시실린의 효과가 사라지는데 clavulanic acid를 첨가하면, 이것이 β-\nlactamase에 비가역적으로 결합해서 항생제의 가수분해를 방지한다.","images":["images/2023/q073_img1.jpeg"],"source_page":39},{"id":"q074","number":74,"question":"다음 중 mylohyoid muscle과 platysma사이의 공간으로, 하악 구치부 치수가 괴사될 경우 감염이\n생기는 공간은?","choices":[{"label":1,"text":"Mental space"},{"label":2,"text":"Submental space"},{"label":3,"text":"Sublingual space"},{"label":4,"text":"Submandibular space"},{"label":5,"text":"Pterygomandibular space"}],"answer_raw":"4","explanation":"Submandibular space에 대한 설명입니다. (pathway 11판 p.713)","images":[]},{"id":"q075","number":75,"question":"2022년 Int Endod J에 개재된 “Efficacy of four local an aesthesia protocols for mandibular first\nmolars with symptomatic irreversible pulpitis: A randomized clinical trial“에서 비가역성 치수염에서\n가장 효과가 좋은 마취 방법은?\n➀ Group 1 (IANB) : standard inferior alveolar nerve block (IANB) injection\n➁ Group 2 (IANB + IO) : A standard IANB was administered followed by the\nsupplemental intraosseous infusion (IO) injection","choices":[{"label":1,"text":"➂ Group 3 (IANB + PDL) : A standard IANB was administered followed by"},{"label":2,"text":"periodontal ligament (PDL) injection"},{"label":3,"text":"➃ Group 4 (IANB + BI) : A standard IANB was administered followed by buccal"},{"label":4,"text":"infiltration."},{"label":5,"text":"➄ 위의 4가지 방법들에서 유의한 효과는 없었다."}],"answer_raw":"","explanation":"➁\n최신수복 근치 22년 1-2\n<Result>\nThe IANB + IO injection had a significantly higher success rate 92.5% (p < .05), followed by IANB\n+ PDL injection (72.5%), IANB + BI injection (65.0%), respectively with no significant differences\nbetween the IANB + PDL and IANB + BI injections (p > .05).\n- 가장 효과 좋은 방법 순서로는 Group 2 (IANB + IO) > Group 3 (IANB + PDL) > Group 4 (IANB + BI)\n였습니다.","images":[]},{"id":"q076","number":76,"question":"Flare up에 관한 설명으로 옳지 않은 것은?\n➀ 근관충전 완료 후에는 발생하지 않는다.\n➁ 술 전 동통이 있는 경우 발생할 빈도가 높다.","choices":[{"label":1,"text":"➂ 근관치료 시행 후 수 시간에서 수 일 이내에 통증, 부종 등의 증상이 나타나는 것이다."},{"label":2,"text":"➃ 예방으로는 근관치료 시 치근단 정출을 막기 위해 치근단공을 넘어 치근단조직을 자극하지"},{"label":3,"text":"않도록 하는 것이다."},{"label":4,"text":"➄ 예방을 위해 잔사를 밀어내는 작용이 적은 엔진 구동형 (rotary) 니켈-티타늄 파일을 이용하여 crown-"},{"label":5,"text":"down technique으로 근관 형성을 진행한다."}],"answer_raw":"","explanation":"➀\n*pathway p.50\n근관성 flare up은 다양한 이유로 발생되는데, 근단 종말부를 넘어서 성형을 한 경우에 과도한 기구조작,\n상아질 및 치수 잔사를 치근단 부위로 밀어 넣었을 경우, 불완전한 치수조직의 제거, “충전재의 과연장”,\n화학 세척제(세정제, 근관 내 첩약, 그리고 “실러”), 과교합， 치근파절， 미생물적 요소 등을 포함한다.\n*근관치료학 p.213\n근단공을 넘어서 기구조작을 하거나 근관 내 잔사가 치근단부로 밀려나가는 경우, 불완전한\n치수조직의 제 거, 근단공을 넘어가는 근광세정제나 “충전재”의 자극과 교합 그리고 미생물적 요인\n등이 원인으로 생각된다.\n- Flare up의 원인들 중 하나로 “충전재 과연장(자극), 실러”가 포함되어 있으므로 근관충전 완료\n후에도 flare up은 발생할 수 있다는 것을 의미합니다.","images":[]},{"id":"q077","number":77,"question":"다음 중 pulp vitality test인 것을 고르시오.","choices":[{"label":1,"text":"➀ Bite test"},{"label":2,"text":"➁ Cold test"},{"label":3,"text":"➂ Pulp oximetry"},{"label":4,"text":"➃ Percussion"},{"label":5,"text":"➄ Electric pulpal test"}],"answer_raw":"","explanation":"➂\n해설 : POP 10th p.20\n'치수생활력 진단을 위해 pulse oximeter를 이용함에 있어~'\n- bite test와 percussion은 치주인대 검사이며 냉검사와 전기치수검사는 신경을 검사함.","images":[]},{"id":"q078","number":78,"question":"다음을 예방하는 것은?(전치부 내흡수 CBCT 사진 - 출처없는 사진이 출제되어 구글링함. 출제된\n사진은 middle ⅓부위에 내흡수가 있는 사진이었음.)","choices":[{"label":1,"text":"➀ 치은"},{"label":2,"text":"➁ 법랑질"},{"label":3,"text":"➂ 백악질"},{"label":4,"text":"➃ 치주인대"},{"label":5,"text":"➄ 전상아질"}],"answer_raw":"","explanation":"➄\n해설 : 최신근관치료학 교과서 p. 60\n내흡수의 조직병리학적 소견 설명에 '치수와 접근되어 있는 상아질 벽에서는 상아질모세포와\n풋상아질(전상아질)이 나타나지 않으며'라고 서술됨.","images":["images/2023/q078_img1.jpeg"],"source_page":42},{"id":"q079","number":79,"question":"2020년 Cortes의 \"Survival of replanted permanent teeth after traumatic avulsion\"에 대한 내용으로\n옳지 않은 것은?","choices":[{"label":1,"text":"5.5년간 생존율은 50퍼센트이다."},{"label":2,"text":"치근형성정도가 중요한 요인이다"},{"label":3,"text":"탈구된 치아의 보관액으로써 우유는 좋은 보관용액이다."},{"label":4,"text":"16세까지 나이가 증가함에 따라 치아 생존율은 증가한다."},{"label":5,"text":"위 연구에서 전신적 항생제의 유용성을 입증했다."}],"answer_raw":"5","explanation":"(최신 근관 20-1-2)\n① 탈구 후 재식된 영구치의 전체 생존율은 5.5년 후 50%임을 보여줌.\n② result에서 환자의 외상당시나이, 치근의 발달단계가 유의한 예측 인자라고 하였으며, 성숙치아의\n발치율은 미성숙 치아의 절반으로 나타남.\n③ 우유에 보관된 치아가 재식후 증가된 생존율을 보여줌.\n④ *Result에 16세 미만에서 1살이 증가함에따라 발치비율이 감소했다고 나와있습니다.\n⑤ 논문의 결과에서 SAT(전신적 항생제 처방)가 치아의 장기생존에 영향을 미치지 않았음.","images":[]},{"id":"q080","number":80,"question":"2012 Andersson등이 Dental Traumatology에 게재한 \"International Association of Dental\nTraumatology guidelines for the management of traumatic dental injuries: 2. Avulsion of permanent\nteeth\"에 대한 내용으로 옳은 것은?","choices":[{"label":1,"text":"1달 후 근관치료를 시행한다."},{"label":2,"text":"전신적 항생제의 사용은 추천되지 않는다."},{"label":3,"text":"전신적 항생제의 사용시 가장 우선적으로 amoxycillin의 사용이 추천된다."},{"label":4,"text":"미성숙 영구치의 경우 치수 재혈관화와 치근형성이 최우선 목표이다."},{"label":5,"text":"치근형성이 완료된 경우, 4주간 flexible wire로 splint한다."}],"answer_raw":"4","explanation":"* 전신적 항생제로 첫번째로 추천되는 항생제는 tetracyclin이며, 미성숙 영구치의 경우 근관치료를\n시행하지 않거나 치수 재혈관화와 치근 형성이 최우선 목표가 되어야 할 것 같습니다.\n① 치아 재식 7-10일 후 splint를 제거하기 전 근관치료 시작함.\n② 대부분의 경우 치아재식 이후 항생제를 사용할 것을 추천함.\n③ 전신적 항생제 투여시 첫번째로 추천되는 항생제는 tetracyclin이며, 12세 이하 환자에게는 추천되지\n않음.\n(대체로 페니실린 또는 amoxycillin도 사용가능 하다고 나와있습니다.)\n④ 미성숙 영구치는 치수괴사의 임상적,방사선학적 근거가 없는 경우 근관치료를 시행하지 않음.\n⑤ 치근형성이 완료된 영구치의 경우 Flexible splint를 2주 적용함.","images":[]},{"id":"q081","number":81,"question":"석회화된 근관을 다루기 위해 사용하고, 술자가 근관에 143%의 강한 힘을 가할 수 있는 file?","choices":[{"label":1,"text":"k file"},{"label":2,"text":"C+ file"},{"label":3,"text":"flexo file"},{"label":4,"text":"K-flex file"},{"label":5,"text":"reamer"}],"answer_raw":"2","explanation":"[근관치료학 p.229] * 다른 보기들이 정확하지 않습니다. 죄송합니다.","images":[]},{"id":"q082","number":82,"question":"Flare up에서 술후 통증을 예측할 수 있는 가장 큰 예측인자는?\n②\n④ 술전 진통제 복용여부","choices":[{"label":3,"text":"술전 통증 및 Mechanical Allodynia"},{"label":4,"text":"술전 진통제 복용여부"}],"answer_raw":"3","explanation":"[pathway 10판 기준 - 근관치료 시 약리학 단원]* 다른 보기들이 정확하지 않습니다.\n죄송합니다.","images":[]},{"id":"q083","number":83,"question":"Roane JB The “Balanced Force” Concept of instrumentation of Curved canal 에서 다음의 q,r, u,\nv가 나타내는 것은?","choices":[{"label":1,"text":"Flute"},{"label":2,"text":"Cutting edge"},{"label":3,"text":"Rake angle"},{"label":4,"text":"Radial land"},{"label":5,"text":"Clearance angle"}],"answer_raw":"5","explanation":"Clearance angle [필독 C-3-2-3]","images":["images/2023/q083_img1.jpeg"],"source_page":44},{"id":"q084","number":84,"question":"다음 논문 Effect of length on the torsional resistance of rotary nickel titanium instrument 의 결과에\n대해서 옳은것?","choices":[{"label":1,"text":"Shank가 짧아질수록 maximum torsional load가 커진다."},{"label":2,"text":"PTN과 PTG에서 shaft length 길이에 따라 maximal torsional load의 유의한 차이가 있었다? 는\n느낌의 내용"},{"label":3,"text":"Hyflex CM에선 31mm가 25,21mm에 비해서 유의하게 높은 maximum torsional load를 갖는다."},{"label":4,"text":"?"},{"label":5,"text":"Protaper Next에선 31mm가 25,21mm에 비해서 유의하게 높은 maximum torsional load를\n갖는다."}],"answer_raw":"3","explanation":"(최신 20-1-근관3번 논문)\n- 나머지 보기들에서 틀린 내용으로는, protaper next가 protaper gold에 비해서 maximum torsional\nload도 크고, toughness도 크단 내용이 있었고, protaper next file이 31mm가 21,25에 비해서 torsional\nload가 컸다 라는 내용들이 있었습니다.","images":[]},{"id":"q085","number":85,"question":"다음은 rake angle에 대한 그림이다. A-B-C가 알맞게 연결된 것을 고르시오.","choices":[{"label":1,"text":"neutral - positive - negative"},{"label":2,"text":"positive - neutral - negative"},{"label":3,"text":"negative – neutral – positive"},{"label":4,"text":"neutral - negative- positive"},{"label":5,"text":"positive - negative - neutral"}],"answer_raw":"3","explanation":"(보기순서는 시험지 상과 다를 수 있습니다.)\nnegative – neutral – positive\nPOP 11th fig 6-14","images":["images/2023/q085_img1.jpeg"],"source_page":45},{"id":"q086","number":86,"question":"고압증기멸균에 대한 설명으로 괄호에는 압력, 온도, 시간이 비워져 있었습니다.","choices":[],"answer_raw":"1","explanation":"5 psi- 121℃ - 15분\n책마다 조금씩 다르게 되어 있었습니다.\n1) Pop 11th p140 2번째줄\n오토클레이브법은 대부분의 건강과 관련된 시설에서 멸균에 사용하는 가장 전형적인 방법이다.\n일반적으로 15psi, 250℉(121℃)에서 30분 주기로 사용된다.\n30psi, 273℉(134℃)의 높은 온도에서 10분 주기의 순간 멸균방법도 가능하다.\n2) A&S 10th 번역본 p373\n증기압멸균(가압멸균)\n증기압에서의 멸균은 증기가압멸균기에서 시행한다. 소량의 기구는121℃에서 최소 15분, 15lbs\n압력으로 멸균을 시행한다.\n천으로 싼 기구는 134℃ ,30lbs에서 시간을 7분 정도로 줄일 수 있다.\n*15psi, 121℃ 에서 15분이라는 보기는 있었으나, 30분은 없었고 60분 보기가 있었습니다.","images":[],"answer_only":true,"answer_display":"5 psi - 121℃ - 15분"},{"id":"q087","number":87,"question":"근관세척제 관련하여 옳지 않은 것은?","choices":[{"label":1,"text":"NaOCl, EDTA 세척 후에도 EDTA 칼슘결합능은 그대로 유지된다"},{"label":2,"text":"NaOCl과 CHX 세척 시 붉은색 침전물이 생긴다"},{"label":3,"text":"NaOCl와 EDTA 혼용 시 NaOCl의 세척능이 떨어진다"},{"label":4,"text":"EDTA와 CHX 세척 시 검은색 침전물이 생긴다"},{"label":5,"text":"?"}],"answer_raw":"4","explanation":"1) O NaOCl과 혼합시 EDTA의 칼슘 부착능은 유지되지만 NaOCl의조직 분해능은\n잃어버림( POP 10판 p.270)\n2) O 여러색깔인듯.. 사진 참조 [POP 10판 그림 8-48]\n3) O 1)과 동일 해설\n4) X EDTA+ CHX = 흰색 침전물 (POP10판 p.267)\n5) ?","images":[]},{"id":"q088","number":88,"question":"근관세척제 관련 문제","choices":[{"label":5,"text":"IKI와 클로르헥시딘을 혼용해서 사용할 경우 수산화칼슘에 저항성이 있는 세균을 좀 더\n효과적으로 박멸할 수 있다"}],"answer_raw":"5","explanation":"(POP p.335)\n다른 보기는 기억이 잘 안나서요 죄송합니다다다…","images":[]},{"id":"q089","number":89,"question":"NaOCl 에 관한 내용으로 옳지 않은 것은?","choices":[{"label":1,"text":"따뜻하게 데우면 효과가 증진된다."},{"label":2,"text":"pH<3 이하의 강산으로 항세균효과가 있다."},{"label":3,"text":"fatty acid 를 fatty acid salt 와 glycerol로 분해한다."},{"label":4,"text":"염소기가 단백질을 아미노산으로 분해한다."},{"label":5,"text":"자유염소기가 protein amine group에 결합하여 chloramine을 형성한다."}],"answer_raw":"2","explanation":"1) O 근관치료학 334p\n2) X NaOCl은 pH 11.4 알칼리성 ( pathway 10판 p. 333)\n3) ?\n4) O 괴사된 조직과 파편들은 NaOCl의 유리염소로 인해서 단백질이 아미노산으로\n분해되면서 용해됨 ( pathway 10판 p. 359)\n5) O 논문 C-3-4-1 내용","images":[]},{"id":"q090","number":90,"question":"근관충전에 관하여 옳지 않은 것은?","choices":[{"label":1,"text":"근관충전시기에 가봉재의 건전 여부는 관련없다."},{"label":2,"text":"괴사치수에서 삼출물 지속시 근관충전은 시행하면 안된다."},{"label":3,"text":"세정과 성형후 근관충전은 필수적이다."},{"label":4,"text":"근관 세정과 성형후 세균과 치수조직의 괴사 산물들이 효과적으로 제거된 상태를 유지하기\n위해 충전을 시행하여야 한다."},{"label":5,"text":"근관충전의 목적은 구강이나 치근단조직으로부터 근관계로 연결되는 모든 누출통로를\n폐쇄하고 완전히 제거될 수 없었던 자극물을 근관계 내에 봉쇄하는 것이다."}],"answer_raw":"1","explanation":"(근관치료학 371p.)\n** 근관충전 시기를 결정하는 이상적인 요소는 다음과 같다.\n-\n환자는 증상이 없고 타진에 불편감을 가지지 않으며\n-\n누공이 폐쇄되어 치유되어 있거나\n-\n삼출액이 거의 없고 악취가 나지 않아야하며\n-\n근관이 적절한 크기로 확대되어야 하고\n-\n가봉재가 건전하고 변연누출의 흔적이 없어야 한다\n-\n음성배양을 얻을수 있다면 더욱 바람직 하다.","images":[]},{"id":"q091","number":91,"question":"다음 그림이 사용되는 치료 과정은?","choices":[{"label":1,"text":"근관충"},{"label":2,"text":"근관세척"},{"label":3,"text":"거타퍼챠 소독"},{"label":4,"text":"근관파일 소독"},{"label":5,"text":"(평이한 보기)"}],"answer_raw":"1","explanation":"(pathway 11판, p. 312, fig. 7-47)\n-\nthermafil oven (thermaprep II)","images":["images/2023/q091_img1.jpeg"],"source_page":48},{"id":"q092","number":92,"question":"2022 Kim’s “Clinical Efficacy of sealer-based obturation using calcium silicate sealers:a\nrandomized clinical trial”에서 loose한 criteria에서 근관치료 성공률에 대해 유의미한 요소는?","choices":[{"label":1,"text":"환자의 성별"},{"label":2,"text":"환자의 나이"},{"label":3,"text":"술전 PAI"},{"label":4,"text":"sealer extrusion"},{"label":5,"text":"pre-operative pain"}],"answer_raw":"4","explanation":"최신 근관 2022-1-3 Abstract에서 result에 있는 문장","images":[]},{"id":"q093","number":93,"question":"다음 기구의 이름은?","choices":[{"label":1,"text":"Gonon post removal system"},{"label":2,"text":"Eggler post remover"},{"label":3,"text":"Gyro Tip"},{"label":4,"text":"Thomas screw post removal kit"},{"label":5,"text":"Ruddle Post Removal system"}],"answer_raw":"2","explanation":"Eggler post remover ( pathway 10판 p.972-973)","images":["images/2023/q093_img1.jpeg"],"source_page":49},{"id":"q094","number":94,"question":"다음 중 일회 근관치료(1-visit endodontic treatment)가 가능한 치아는?","choices":[{"label":1,"text":"해부학적으로 치료가 어려운 치아"},{"label":2,"text":"심한 통증이 있는 괴사된 치수를 가진 치아"},{"label":3,"text":"급성통증 및 지속되는 삼출물이 없는 치아"},{"label":4,"text":"누공 없는 치근단 병소를 가진 증상 없는 치아"},{"label":5,"text":"타진에 반응이 있는 치아로 급성 치근단 치주염을 가진 치아"}],"answer_raw":"3","explanation":"(근관치료학 p. 157)\n** 일회 근관 치료가 추천 되지 않는 경우\n1. 심한 통증이 있는 괴사된 치수를 가진 치아\n2. 해부학적으로나 치료 술식에 있어 어려운 치아\n3. 누공이 없는 치근단 병소를 가지고 있고 증상이 없는 실활치수를 가진 치아\n4. 타진에 심한 반응을 보이는 급성 치근단치주염을 가진 치아\n5. 대부분의 재치료","images":[]},{"id":"q095","number":95,"question":"apical periodontitis의 치유에 대한 설명으로 옳지 않은 것은?","choices":[{"label":1,"text":"osteoblast가 관여"},{"label":2,"text":"대부분 fibrosis로 귀결"},{"label":3,"text":"치주인대의 multipotent stem cell이 관여"},{"label":4,"text":"anti-inflammatory cytokine 관여"},{"label":5,"text":"결합조직의 치유와 비슷"}],"answer_raw":"2","explanation":"(pathway 10판 p.592)\n- 치근단 치주염병소의 치유는 대부분 재생에 의해 이루어지지만 일부는 섬유화에 의해 치유가\n일어나기도 한다.","images":[]},{"id":"q096","number":96,"question":"2014년 american asso of pediatric dent에 따르면, 미성숙치아의 재식후 결과중 favorable\noutcome으로 아닌 것은?","choices":[{"label":1,"text":"tooth vitality"},{"label":2,"text":"pulp regeneration and apexogenesis (??)"},{"label":3,"text":"reparative dentine"},{"label":4,"text":"radiographic abnormal calcification"},{"label":5,"text":"abscense of symptom"}],"answer_raw":"4","explanation":"-\nPathway 12판 table17.1에 있는 내용입니다.\n-\nAbsence of radiographic evidence of internal or external root resorption, periapical\nradiolucency, abnormal calcification, or other pathologic changes.","images":[]},{"id":"q097","number":97,"question":"상악 우측중절치의 치근단수술 직후(A), 2년후(B), 3년후(C) 에 촬영한 치근단 방사선 사진입니다.\n상악 우측중절치의 방사선학적 치유 분류는?","choices":[{"label":1,"text":"Complete healing"},{"label":2,"text":"Incomplete healing"},{"label":3,"text":"Uncertain healing"},{"label":4,"text":"Failure"},{"label":5,"text":"Extraction"}],"answer_raw":"3","explanation":"(POP 11th edition p.485 Fig.11-11)","images":["images/2023/q097_img1.jpeg"],"source_page":51},{"id":"q098","number":98,"question":"아래 사진에 보이는 기구의 용도는?","choices":[{"label":1,"text":"크라운 프렙"},{"label":2,"text":"아말감 폴리싱"},{"label":3,"text":"교합조정"},{"label":4,"text":"근관 와동형성"},{"label":5,"text":"치근단 수술시 골삭제"}],"answer_raw":"5","explanation":"(POP 10th edition p.802)\n(POP 11th edition p.411)","images":["images/2023/q098_img1.jpeg"],"source_page":52},{"id":"q099","number":99,"question":"수직 이완 절개 시 원칙으로 옳은 것을 고르시오","choices":[{"label":1,"text":"A vertical incision should cut across frenum and muscle attachment."},{"label":2,"text":"The incision should be placed superior to a bony eminence."},{"label":3,"text":"Frenum and muscle attachment should be located in the reflected tissue."},{"label":4,"text":"The incision should be made perpendicular to the supraperiosteal vessels in the attached\ngingiva and submucosa"},{"label":5,"text":"The incision should extend from the depth of the vestibular sulcus to the midpoint\nbetween the dental papilla and the horizontal aspect of the buccal gingival sulcus."}],"answer_raw":"5","explanation":"(POP 11th edition p.409)\n-\n문장이 완벽하게 일치하진 않았지만 상기와 같은 내용이었습니다.\n① No cuts should be made across frenum and muscle attachment.\n② The incision should not be placed superior to a bony eminence.\n③ Frenum and muscle attachment should not be located in the reflected tissue.\n④ The incision should be made parallel to the supraperiosteal vessels in the attached gingiva and\nsubmucosa","images":[]},{"id":"q100","number":100,"question":"노령화에 따른 치수 변화 중 옳지 않은 것을 고르시오","choices":[{"label":1,"text":"조상아세포가 감소한다."},{"label":2,"text":"치수 내의 혈관 및 신경섬유들의 수가 감소한다."},{"label":3,"text":"치수 조직 내의 교원질 섬유 수가 감소한다."},{"label":4,"text":"이차 상아질과 삼차 상아질이 형성되면서 치수 부피가 지속적으로 감소된다."},{"label":5,"text":"혈관 내벽 세포 내의 미세 소포, 세포 골격 및 골지체의 증가 등이 관찰된다."}],"answer_raw":"3","explanation":"(근관치료학 p.690)\n3) 한편 치수 조직 내의 교원질 섬유 수는 증가하고,","images":[]}]},"2024":{"year":2024,"title":"2024 치과보존과 전문의시험 1차","questions":[{"id":"q001","number":1,"question":"다음의 모식도와 같이 Inward 유발 자극은 ?","choices":[{"label":1,"text":"Cold"},{"label":2,"text":"Osmotic pressure"},{"label":3,"text":"Hot water"},{"label":4,"text":"Air"},{"label":5,"text":"sugar??"}],"answer_raw":"3","explanation":"필독 A-1-2 1996 pashley. 및 pathway 11th p.28 - 그림은 pathway 11th 1-35 그대로 나옴 (pathway 12th는 29p)","images":["images/2024/q001.png"]},{"id":"q002","number":2,"question":"최신 근관 21-4-1\n논문내용 설명(QLF에 대한 약간의 설명이 있었습니다), 다음중 틀린것은 ?","choices":[{"label":1,"text":"이 기계는 405nm 파장의 빛과 필터를 이용해서 현광반응의 정량을 한다."},{"label":2,"text":"이 기계는 우식의 진단과, 세균의 침착, 무기질 손실 등을 평가하는데 사용된다."},{"label":3,"text":"이는 현광을 감지하는 원리를 사용하여 치아 파절을 진단하는데 임상적으로 사용될 수 있다."},{"label":4,"text":"평이했던 QLF에 대한 설명"},{"label":5,"text":"파절선은 오랫동안 포피린이라는 성분이 침투할 수 있는데, 이 성분 때문에 세균, 치태는 파란색으로 관찰된다."}],"answer_raw":"5","explanation":"최신 근관 21-4-1 이네요 감사합니다 문제가 우식 확인하는 게 맞나요? 기억이 제대로 안납니다..","images":[]},{"id":"q003","number":3,"question":"시술 전에 자발적 증상이 없고, 전기치수 검사에서 양성반응을 보인 치아에서 우식 제거를 하는데 치수가 0.5mm 노출되었다, 이때 노출된 치수 위에 적용할 수 있는 재료는?","choices":[{"label":1,"text":"Gi"},{"label":2,"text":"compomer"},{"label":3,"text":"mta"},{"label":4,"text":"아말감"},{"label":5,"text":"바니쉬"}],"answer_raw":"3","explanation":"치과보존학 책 p152-153, 문제에서 얘기한 치료법은 직접 치수복조술로, \n치수복조재로 사용 가능 한 재료 중에 수산화칼슘, 상아질 접착제, mta, theracal 이라고 적혀있습니다.","images":["images/2024/q003.jpg"]},{"id":"q004","number":4,"question":"심한 자극이 지속적으로 가해지면, 자극에 의해 직접 영향 받은 상아모세포는 죽고 새롭게 만들어진 상아모세포에 의해서 (       )이 생성되며, 활동적인 우식병소의 자극은 상아질의 심한 파괴와 상당한 치수손상을 야기한다. 그러한 경우 세포 함입이 있을 수 있다. \n( )에 해당하는 것은?","choices":[{"label":1,"text":"1차 상아질"},{"label":2,"text":"2차 상아질"},{"label":3,"text":"상아전질"},{"label":4,"text":"수복상아질"},{"label":5,"text":"구간상아질"}],"answer_raw":"4","explanation":"치과보존학 책 p19, 삼차상아질,반응상아질,수복상아질 부분에 해당하는 내용입니다.","images":[]},{"id":"q005","number":5,"question":"상아질 지각과민에 대한 다음 설명 중 옳은 것은?","choices":[{"label":1,"text":"10대에서 많이 발생한다."},{"label":2,"text":"남성의 경우 많이 발생한다."},{"label":3,"text":"협면에서 다른 치면에서보다 많이 발생한다."},{"label":4,"text":"전치에서 많이 발생한다."},{"label":5,"text":"상아질이 노출된 모든 치아에서 발생한다."}],"answer_raw":"3","explanation":"치과보존학 4판 64p, 30-40대 호발, 여성 호발, 견치와 소구치 호발, 상아질이 노출된다고 해서 모두 과민증을 보이지는 않는다","images":[]},{"id":"q006","number":6,"question":"다음의 빈 칸에 들어갈 말로 알맞은 것은? \"심한 통증이 있는 치아에서 정상 치아가 타진에 반응하는 것은 중추감작(central sensitization)으로 인한 (        )으로 설명되곤 한다.\"","choices":[{"label":1,"text":"allodynia"},{"label":2,"text":"paraesthesia"},{"label":3,"text":"dysesthesia"},{"label":4,"text":"hyperalgesia"},{"label":5,"text":"reffered pain"}],"answer_raw":"1","explanation":"근관치료학 203p 마지막 문단 (번역 없이 영어단어만 제공됨)","images":[]},{"id":"q007","number":7,"question":"근관치료 후 술후 동통 환자의 진통제 투약에 관한 다음 그래프와 관련해 옳은 것은?","choices":[{"label":1,"text":"placebo 그룹에서는 아무런 진통 효과가 없었다."},{"label":2,"text":"NSAIDs(non-steroidal anti inflammatory drugs)만 투여한 경우에는 충분한 진통효과가 나타나지 않았다."},{"label":3,"text":"NSAIDs와 Acetaminophen을 병용한 경우 충분한 진통효과가 나타났다."},{"label":4,"text":"NSAIDs에 opioid의 추가 사용은 NSAIDs 단독 사용보다 2배의 진통효과를 갖는다."},{"label":5,"text":"NSAIDs와 Acetaminophen의 병용은 NSAIDs 단독 사용과 유의한 차이가 없었다."}],"answer_raw":"3","explanation":"pathway 10판 한글판 738 첫 문단, 그림 19-4\n1) 교과서에는 정확한 언급 없으나 원본 논문에 모든 그룹에서 baseline과 유의차 나타났다고 언급\n2)위 해설 동일\n4) opioid가 아니고 아세트아미노펜 추가 얘기. 패스웨이 언급된 문장\n5) 교과 학적으로 상호 작용하여 Ca-10-MDP 염을 형성할 수 있기 때문입니다. \n2) 실란제는 지르코니아의 수산화를 일으킬 수 있으며 결과적으로 10-MDP의 흡착을 변경하므로 UA 내에 포함된 실란 비율을 최적화하는 것이 중요합니다.\n3) 불화수소산과 별도의 실란 제제를 사용한 기존 유리-세라믹 전처리가 여전히 gold standard로 남아 있고, 실란 함유 UA와 비교할 때 더 높은 결합 강도 값을 제공하는 것으로 나타났습니다.\n4,5)비우식성 치경부 병변에 복합레진 수복 시 \nUA를 ER 모드에서 사용할 때 수술 후 민감도(POS) 위험이 더 높았으며\nSE 모드만으로는 법랑질 탈회 가능성이 낮기 때문에 복합 수복물의 적절한 유지를 제공하는 데 충분하지 않습니다.\n\n5번 보기가 저게 아니었던거 같은데...? 비우식성 치경부 병소 복합레진 수복 시, UA를 SE로만 쓰면 유지가 어렵다 뭐 이런 내용 아니었나요? 그래서 오히려 5번이 답이었던거 같은데,,, 1번은 collagen fibril과 결합하는게 아니라 HAp와 결합하니까 틀린것 같구요..\n: 저도 5번보기 저것 아니었던것같아요, 1번보기의 MDP가 collagen fibril과 결합하는게 아니라서 틀린보기라고 생각했고, 5번 골랐어요 (다른사람입니다. 저도요)","images":[]},{"id":"q026","number":26,"question":"치간이개를 복합레진으로 직접 수복 시, 아래 설명 중 옳은 것을 고르시오","choices":[{"label":1,"text":"교합력 적게 받으므로 강한 접착을 하지않아도 된다"},{"label":2,"text":"법랑질에만 접착하는 경우에도 습윤접착을 해야한다"},{"label":3,"text":"미삭제법랑질에 SE만해도 결합력이 충분하다"},{"label":4,"text":"수복 후 치아가 너무 넓어질것같으면 미리 치은성형술을 한다"},{"label":5,"text":"perikymata를 강조해서 형성해주면 치아가 길어보인다"}],"answer_raw":"4","explanation":"(치과보존학 358-359)\n1) 복합레진에 의한 치간이개 수복은 전적으로 접착에 의존한다.\n기계적 유지형태가 없고 수복 후에도 중등도 이상의 응력이 가해지는 부위이기 때문에 강력한 접착을 요구한다.\n2) 주로 법랑질에 대한 접착이 이루어지기 때문에 습윤접착과 같은 모호한 적용기준이 없어 산부식형 접착제를 추천한다.\n3) 자가부식형 접착제는 미삭제 또는 과광화 법랑질에 대하여 부식 능력의 한계가 있다.\n5) perikymata를 강조하면 치아는 짧아보인다.","images":[]},{"id":"q027","number":27,"question":"미백제에 의한 접착력의 감소를 해결하는 방법으로 옳지 않은 것은?","choices":[{"label":1,"text":"산부식 전 와동에 중등도의 사면을 부여한다"},{"label":2,"text":"산화방지제인 sodium ascorbate 혹은 catalase를 와동 내에 도포한다"},{"label":3,"text":"최종 수복하기 전에 적어도 7일간 수복을 유예한다."},{"label":4,"text":"ethanol 같은 탈수제나 acetone을 포함하는 접착제를 사용한다"},{"label":5,"text":"일시적으로 수산화 칼슘 paste를 적용하는 것은 최종수복에 사용되는 레진 재료의 접착을 방해할 수 있으므로 사용하지 않는다."}],"answer_raw":"5","explanation":"(치과보존학 p.479-480)","images":[]},{"id":"q028","number":28,"question":"다음 사진이 의미하는 것은?","choices":[{"label":1,"text":"교모"},{"label":2,"text":"마모"},{"label":3,"text":"굴곡파절"},{"label":4,"text":"내인성침식"},{"label":5,"text":"외인성침식"}],"answer_raw":"3","explanation": 가 71%의 정확성을 가짐을 알 수 있다.","images":[],"source_page":3},{"id":"q007","number":7,"question":"급성 치근단 치주염에서 농 형성에 관여하는 주요한 세포는?","choices":[{"label":1,"text":"단핵구"},{"label":2,"text":"대식세포"},{"label":3,"text":"비만세포"},{"label":4,"text":"파골세포"},{"label":5,"text":"호중성백혈구"}],"answer_raw":"5","explanation":"번\n(근관치료학 p.73)\n감염이 동반한 급성치근단치주염을 조기에 적절히 치료하지 않으면 단시간에 염증이 치조골로\n파급하여 다형핵백혈구(호중구)의 침윤이 증가되어 농양이 형성된다.","images":[],"source_page":4},{"id":"q008","number":8,"question":"치수염증에 관여하는 매개체 중 혈관을 수축시키는 것은?","choices":[{"label":1,"text":"substance P"},{"label":2,"text":"neurokinin A"},{"label":3,"text":"neuropeptide Y"},{"label":4,"text":"vasoactive intestinal peptide"},{"label":5,"text":"calcitonin gene-related peptide"}],"answer_raw":"3","explanation":"코헨 10판 한글판 541pg) 신경성 매개체 부분\n   SP,CGRP,NKA,NKY,혈관활성장펩타이드(vasoactive intestinal peptide) 가 분비되어 혈\n관확장과 혈관 투과성증가와 같은 혈관반응에 영향을 미친다.\n   노르에피네프린, 신경펩타이드Y, ATP와 같은 매개체의 국소적인 분비에 반응하여 교감신\n경이 자극되면 치수 혈액 흐름이 변화한다고 알려져 왔다.\n코헨 10판 한글판 516pg) 치수혈류의 조절\n  치수교감신경섬유의 노르에피네프린과 국소적으로 공유하는 NPY 역시 치수의 혈관 수축에\n기여한다.","images":[],"source_page":4},{"id":"q009","number":9,"question":"치수 생활력 검사시 전기치수검사기에서 발생되는 전류에 자극되어 반응하는 신경섬유는?","choices":[{"label":1,"text":"A 섬유"},{"label":2,"text":"B 섬유"},{"label":3,"text":"C 섬유"},{"label":4,"text":"교감신경섬유"},{"label":5,"text":"부교감신경섬유"}],"answer_raw":"1","explanation":"(근관치료학 p.22)\n심화학습 마지막 문장 : 따라서 전기치수검사 및 냉온검사 모두 A 섬유의 활성화만을 측정하\n는 것이라고 볼 수 있다.","images":[],"source_page":4},{"id":"q010","number":10,"question":"다음 수복 과정에 대하여 옳은 것은?","choices":[{"label":1,"text":"치은성형술 또는 치관확장술은 금기이다."},{"label":2,"text":"perikymata를 강조하면 치아는 길어 보인다."},{"label":3,"text":"순측-근심 선각을 원심으로 이동하면 치아는 넓어보인다."},{"label":4,"text":"접촉점을 설측으로 이동하면 치아는 넓어 보인다."},{"label":5,"text":"순측치간공극을 크게 하면 치아는 좁아 보인다."}],"answer_raw":"5","explanation":"(치과보존학 4판 p.359)\n1) 치은성형술 또는 치관확장술을 치간이개 수복 전에 선행할 수 있다.\n2) perikymata를 강조하면 치아는 짧아 보인다.\n3) 순측-근심 선각을 원심으로 이동하면 치아는 좁아 보인다.\n4) 접촉점을 설측으로 이동하면 치아는 좁아 보인다.\n5) 정답","images":["images/questions/q010.png"],"source_page":5},{"id":"q011","number":11,"question":"세라믹 인레이의 접착 후 마무리 및 연마 과정에 관한 사진이다. 임상 과정 순서대로 나\n열한 것은?\nA)                                  B)\nC)                                  D)\nA) Diamond polishing paste\nB) 30 flute carbide bur\nC) Rubber abrasive point\nD) Flame shape fine grit diamond bur","choices":[{"label":1,"text":"B D A C"},{"label":2,"text":"D C B A"},{"label":3,"text":"C A B D"},{"label":4,"text":"B D C A"},{"label":5,"text":"D B C A"}],"answer_raw":"5","explanation":"A&S 2000년 판\np.587-588","images":["images/questions/q011.png"],"source_page":6,"explanationImages":["images/explanations/q011_explanation_1.png"]},{"id":"q012","number":12,"question":"지각과민처치 중 신경반응조절(neuralmodalation) 전달능에 영향을 미치는 것은?","choices":[{"label":1,"text":"레이저"},{"label":2,"text":"옥살산"},{"label":3,"text":"질산칼륨"},{"label":4,"text":"염산스트론튬"},{"label":5,"text":"상아질접착제"}],"answer_raw":"3","explanation":") 질산칼륨\n패스웨이 한글판 p.545\n“potassium nitrate와 같은 신경조절물질”, strontium chloride, oxalate 또는 상아질 접착\n제와 같은 상아세관-봉쇄 물질은 적어도 일시적으로 과민증을 완화시킨다.","images":[],"source_page":7},{"id":"q013","number":13,"question":"다음 그림과 같은 아말감 2급 와동 형태에서 발생할 수 있는 현상은?","choices":[{"label":1,"text":"치아파절"},{"label":2,"text":"변연 변색"},{"label":3,"text":"수복물 파절"},{"label":4,"text":"수복물 탈락"},{"label":5,"text":"변연 마무리 어려움"}],"answer_raw":"3","explanation":") 수복물파절\n치과보존학 4판 p.188 그림 10-10\n아래 캡션을 보면\nb. 잘못된 형태: 치은연이 지나치게 좁게 형성되어 교합력에 저항하지 못하고 아말감의 부피\n가 적어 교합력을 받을 때 파절이 일어나기 쉬운 모습","images":["images/questions/q013.png"],"source_page":7},{"id":"q014","number":14,"question":"HEMA(2-hydroxyethyl methacrylate)가 치질 표면에 대해 친수성과 습윤성을 가지게\n하는 기능기는?","choices":[{"label":1,"text":"싸이올기"},{"label":2,"text":"메티올기"},{"label":3,"text":"카르보닐기"},{"label":4,"text":"카르복실기"},{"label":5,"text":"하이드록실기"}],"answer_raw":"5","explanation":") 하이드록실기\n\n\n\n\n             HEMA","images":[],"source_page":8,"explanationImages":["images/explanations/q014_explanation_1.png"]},{"id":"q015","number":15,"question":"다음 어떤 재료의 치질과의
